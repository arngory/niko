// NikoService: Niko's own calls to its desktop daemon, nikod, served beside the core's daemon's services through the
// same channel and credentials (docs/design/desktop-stage3.md). Go: libcore/nikopb (shared/tool/gen_proto_go.sh); Dart:
// lib/gen of the window, arngory/niko-desktop (its tool/gen_proto.sh).
syntax = "proto3";

package niko.v1;

option go_package = "libcore/nikopb;nikopb";

service NikoService {
  // What this daemon is. Any caller the daemon verified.
  rpc GetInfo(GetInfoRequest) returns (Info);
  // Which rule of the running core a connection would match and where it would go; no connection is made. The
  // daemon's owner only: it reads the owner's core; it runs outside the daemon's lifecycle lock, so a stop does not
  // wait for its lookups. FAILED_PRECONDITION when no core runs; ABORTED when the core stopped during the test (its
  // answer would be a closing core's, not the running one's).
  rpc RouteTest(RouteTestRequest) returns (RouteTestResult);

  // The calls below are on the caller's own store (libcore/nikostore): any caller the daemon verified, each with the
  // store of its user. Until the daemon names its caller to NikoService (a hook in the fork, desktop-stage3.md §6),
  // only development mode's caller is known; elsewhere they are UNIMPLEMENTED. FAILED_PRECONDITION for a store a
  // newer Niko wrote.

  // What changes in the store, and the results of its tasks: first a reset with the revision now, then each change;
  // a reset again where some were lost. A change says what changed: the window reads it again.
  rpc Watch(WatchRequest) returns (stream Change);

  // The groups, in their order.
  rpc ListGroups(Empty) returns (GroupList);
  // The profiles of a group, or of all, in the list's order: rows, without their beans. NOT_FOUND for no such group.
  rpc ListProfiles(ListProfilesRequest) returns (ProfileList);
  // A profile with its bean. NOT_FOUND; FAILED_PRECONDITION where its secrets cannot be opened on this machine.
  rpc GetProfile(ProfileId) returns (Profile);
  // A profile from its type and bean: a new one (id 0) at the end of its group, or the one of its id with a new bean of
  // the same type, where it is. INVALID_ARGUMENT for a bean that is not one of its type.
  rpc SaveProfile(Profile) returns (Profile);
  // Deletes the profiles of those ids that are there.
  rpc DeleteProfiles(ProfileIds) returns (Empty);
  // Puts profiles, in their order, into a group before one of its profiles or at its end.
  rpc MoveProfiles(MoveRequest) returns (Empty);
  // A group: of the user's own (BASIC), a new one (id 0) or a new name; of a subscription (SUBSCRIPTION, D-SUB-01,
  // -02, -08), a new one with its subscription's address and settings (its name the app's default, "Subscription
  // #…", where none is given, which its first update replaces by the provider's), or the name and settings of one;
  // what its updates set is kept. Saving makes no update: Refresh does. INVALID_ARGUMENT for an address that is no
  // http(s) URL, an interval under 15 minutes; FAILED_PRECONDITION for a group of the other type.
  rpc SaveGroup(Group) returns (Group);
  // Deletes a group and its profiles; the ungrouped group stays (FAILED_PRECONDITION).
  rpc DeleteGroup(GroupId) returns (Empty);
  // The profile the window connects with (D-MAIN-07): kept in state.json, none (0) once deleted. Watch says SELECTED
  // with its id, or no id for none. Id 0 selects none; NOT_FOUND for no such profile; FAILED_PRECONDITION for one whose
  // secrets cannot be opened on this machine.
  rpc Select(ProfileId) returns (Empty);
  // The selected profile; id 0: none.
  rpc GetSelected(Empty) returns (ProfileId);
  // The link to share a profile by (D-PROFILE-07), as the app writes it: a link of its type's own, else sn://.
  // NOT_FOUND; FAILED_PRECONDITION where its secrets cannot be opened on this machine, and for a raycontrol node's
  // profile (its rows are this device's: another device registers with an invite of its own); UNIMPLEMENTED for a kind
  // with no link (a plugin's profile).
  rpc ShareProfile(ProfileId) returns (ShareLink);
  // Builds the config of a profile in the daemon, as the app builds it, for this computer (Windows or Linux) with the
  // computer's settings (GetSettings) in the mode asked, else theirs, and starts the core with it (reloads the one
  // running), as DesktopService.StartService starts a config with no options: the caller becomes the daemon's owner.
  // By default proxy mode: the local proxy on 127.0.0.1:2080 with no login, on Windows the caller's system proxy too
  // (system_proxy), set by the daemon for the caller; VPN mode is the TUN, which the core opens only with the daemon's
  // privileges. FAILED_PRECONDITION for no profile selected, one
  // whose secrets cannot be opened on this machine, or settings whose secrets cannot; NOT_FOUND; INVALID_ARGUMENT for
  // a profile the build refuses, or no such mode; UNIMPLEMENTED for a plugin's profile; PERMISSION_DENIED where another
  // user owns the daemon; the core's own error for a config it refuses or cannot start.
  rpc Connect(ConnectRequest) returns (Empty);

  // The computer's settings (D-SET-05, -16, -18): what Connect builds the config with. FAILED_PRECONDITION where
  // their secrets were sealed by another machine or account: they are to be set again.
  rpc GetSettings(Empty) returns (Settings);
  // Sets the settings named to their values in the request, the others as they were, in one write: the settings
  // then. Watch says SETTINGS. INVALID_ARGUMENT for a name that is no field of Settings, or a value it may not have,
  // and nothing is changed; FAILED_PRECONDITION where the secrets cannot be opened on this machine and the change
  // does not set them again.
  rpc UpdateSettings(SettingsUpdate) returns (Settings);

  // What an input is and what its import would add; nothing is written, and no store is needed.
  rpc Recognize(ImportInput) returns (ImportPreview);
  // Imports an input: the task's progress, then its result, the last message (done). Share links and sn://; a
  // subscription's link (http(s), clash://install-config, another client's "add subscription" link) makes a group of
  // that subscription and updates it, as the app's import does: the result names the group (group_id). A raycontrol
  // node's invite (rcinv1, RCINV2, RCINV3) registers this computer with the node (D-ADD-06), a device package
  // (rcdev1) is kept as it is; either way the node is kept with its device key sealed, and its subscription fetched
  // into a group of its own (the result names the node, node_id, and its group). An invite that needs a PIN and has
  // none, or a wrong one, ends with pin (FAILED_PRECONDITION): the window asks for it and imports again with it; the
  // client key the first try made is sent again, so a retry after an answer that was lost gets the same device. A
  // whole group shared as sn://subscription is recognized, its import UNIMPLEMENTED.
  rpc Import(ImportRequest) returns (stream TaskProgress);

  // Updates a subscription's group (D-SUB-03), or every one (group_id 0), as the app's update does: the answer
  // fetched, its profiles merged into the group's, its traffic and expiry kept (Subscription). A task, as Import is:
  // its progress, then its result; the result in Watch too, and the group's change. The daemon updates the groups
  // that say so on their own, by their interval. NOT_FOUND; FAILED_PRECONDITION for a group of no subscription or
  // one whose address cannot be opened on this machine (to be given again); ABORTED where an update of the group runs
  // already; UNAVAILABLE where the provider did not answer, INVALID_ARGUMENT where its answer has no profiles,
  // PERMISSION_DENIED where its panel refused this device: as the result's code.
  rpc Refresh(RefreshRequest) returns (stream TaskProgress);

  // The raycontrol nodes (D-NODE-01…07, D-MAIN-13), in the order imported: what their packages and last
  // subscriptions say, never their keys. Watch says NODES. A node's subscription is fetched by Refresh (node_id, or
  // its group's id), and by the daemon on its own when its next update is due.
  rpc ListNodes(Empty) returns (NodeList);
  // Removes a node with its device key, its group and its profiles (D-NODE-07): it comes back only with a new
  // invite. NOT_FOUND.
  rpc DeleteNode(NodeId) returns (Empty);

  // The route rules (D-RULES-01), in the order the build takes them: what Connect builds the config with, the
  // enabled ones. Watch says RULES.
  rpc ListRules(Empty) returns (RuleList);
  // Saves a rule: a new one (id 0) at the end, or the one of that id with these fields where it is (its order and
  // its apps stay). The rule as saved. INVALID_ARGUMENT for what a rule may not be (an outbound that is no profile, a
  // network other than tcp or udp, its own JSON not an object, a list over 1 MiB); NOT_FOUND.
  rpc SaveRule(Rule) returns (Rule);
  rpc DeleteRules(RuleIds) returns (Empty);
  // Puts rules, in the order given, before another one (0: at the end); the rules are numbered again from 1.
  // NOT_FOUND; INVALID_ARGUMENT for no rule, or one to put them before that is not there or among them.
  rpc MoveRules(MoveRulesRequest) returns (Empty);
  // A ready-made set of rules (D-RULES-05): Russia's two replace its rules there are, at the end. The rules added;
  // their rule-sets are downloaded by UpdateRuleSets (rule_sets).
  rpc ApplyPreset(PresetRequest) returns (PresetResult);
  // The rule-sets the rules name that the daemon downloads (BG-09, D-RULES-03): each with its file, when it was
  // fetched, what it holds and its last download's error. Watch says RULE_SETS.
  rpc ListRuleSets(Empty) returns (RuleSetList);
  // Downloads rule-sets (D-RULES-03): those asked, or those of the enabled rules, each missing or older than the
  // update interval (rule_set_update_hours), or each with force. Directly, with the limits of the app's (https alone,
  // 32 MiB, 120 s in all, 30 s without a byte); a list replaces its file only once the core's reader takes it
  // (libcore's CheckRuleSet). A task, as Refresh is; the result's code the first failure's (UNAVAILABLE where a
  // server did not answer, INVALID_ARGUMENT for what is not a rule-set or not https, ABORTED where an update runs
  // already). The core takes a list it started without when it starts again. While the core runs, the daemon updates
  // the enabled rules' lists on its own, by the interval.
  rpc UpdateRuleSets(RuleSetRequest) returns (stream TaskProgress);

  // Exports the caller's decrypted user-mode store for one-time migration to the system service.
  // Available only when the daemon runs in --user-mode (FAILED_PRECONDITION on the system service).
  rpc ExportUserStore(Empty) returns (UserStoreSnapshot);
  // Imports a decrypted user-mode store snapshot into the caller's service store, re-sealing all
  // secrets under the service's context. Available to any verified caller on its own store (PolicyCaller).
  rpc ImportUserStore(UserStoreSnapshot) returns (ImportUserStoreResult);

  // Measures HTTP round-trip latency through the running core's default outbound (D-MAIN-18).
  // Owner-only, outside the lifecycle lock. FAILED_PRECONDITION when no core runs.
  rpc TestConnection(TestConnectionRequest) returns (TestConnectionResult);
  // Queries an HTTPS lookup provider (cloudflare, ipinfo, ipwho, ipapi-co) through the running core's
  // default outbound to discover exit IP and country (D-MAIN-03/14). Owner-only, outside the lifecycle lock.
  rpc ExitAddress(ExitAddressRequest) returns (ExitAddressResult);
  // Measures HTTP latency for a batch of stored profiles (or all profiles of a group) using isolated
  // in-memory test cores, streaming each result as it finishes (D-MAIN-08/12).
  rpc TestProfiles(TestProfilesRequest) returns (stream ProfileTestResult);

  // Runs a full diagnostic test against a raycontrol node ("Why isn't it working", D-WHY): direct path,
  // subscription refresh, DNS tunnel check, and each profile, streaming steps and returning redacted findings.
  // Owner-only, outside the lifecycle lock.
  rpc RunNodeTest(NodeTestRequest) returns (stream NodeTestEvent);
  // Proxies an allowlisted admin RPC (NodeService/* or DeviceService/GetSelf) to a raycontrol node using the
  // daemon's sealed client certificate (D-ADMIN). Owner-only, outside the lifecycle lock.
  rpc NodeAdminCall(NodeAdminRequest) returns (NodeAdminResponse);
  // Dismisses the D-STATE-SWITCHED notice after the watchdog automatically switched a node's active profile.
  rpc ClearNodeSwitched(NodeId) returns (Empty);
  // Toggles lan-v1 visibility for this device on a raycontrol node.
  rpc SetNodeLan(SetNodeLanRequest) returns (Empty);
}

message Empty {}

message GetInfoRequest {}

message Info {
  // Niko's version, as its build names it
  string niko_version = 1;
  // the core's version
  string core_version = 2;
  // the schema of the daemon's store (nikostore's); 0: a daemon without one
  int32 store_schema = 3;
  // the version of this API: what the window may ask. 2: the store, Watch and the import; 3: Select and GetSelected;
  // 4: ShareProfile; 5: Connect; 6: Connect's mode, the config a computer's; 7: the computer's settings, Connect
  // with them; 8: the programs through Niko; 9: subscriptions (Group.subscription, Refresh, their import); 10: the
  // route rules, the Russian preset and the rule-sets (ListRules…UpdateRuleSets), their settings; 11: raycontrol
  // nodes (their import by invite with its PIN, ListNodes, DeleteNode, Refresh of a node, their profiles in Connect);
  // 13: user-mode capabilities (privileged, tun) and store migration (ExportUserStore, ImportUserStore);
  // 14: TestConnection, ExitAddress, TestProfiles, and zip file import
  int32 api = 4;
  // True when running as the privileged system service; false in unprivileged --user-mode.
  bool privileged = 5;
  // True when VPN (TUN) mode is available; false in unprivileged --user-mode.
  bool tun = 6;
}

message UserStoreSnapshot {
  bytes json = 1;
}

message ImportUserStoreResult {
  int32 groups = 1;
  int32 profiles = 2;
  int32 rules = 3;
  int32 nodes = 4;
}

message TestConnectionRequest {
  // Optional HTTP(S) URL; empty uses the default connection test URL.
  string url = 1;
  // Timeout in milliseconds; 0 uses 5000 ms (capped at 30000 ms).
  int32 timeout_ms = 2;
}

message TestConnectionResult {
  int32 latency_ms = 1;
  string error = 2;
}

message ExitAddressRequest {
  // One of: cloudflare (default), ipinfo, ipwho, ipapi-co.
  string provider = 1;
  // Timeout in milliseconds; 0 uses 10000 ms (capped at 30000 ms).
  int32 timeout_ms = 2;
}

message ExitAddressResult {
  string provider = 1;
  string ip = 2;
  string country_code = 3;
  string country = 4;
  string city = 5;
}

message TestProfilesRequest {
  // Specific profile IDs to test; if empty, all profiles in group_id are tested.
  repeated int64 profile_ids = 1;
  int64 group_id = 2;
  // Optional HTTP(S) URL; empty uses the default connection test URL.
  string url = 3;
  // Per-profile timeout in milliseconds; 0 uses 5000 ms (capped at 30000 ms).
  int32 timeout_ms = 4;
}

message ProfileTestResult {
  int64 profile_id = 1;
  int32 latency_ms = 2;
  string error = 3;
}

message RouteTestRequest {
  // tcp (the default) or udp
  string network = 1;
  // a domain or an address
  string host = 2;
  uint32 port = 3;
  // the inbound's tag: tun-in (the default), mixed-in or another of the running core's
  string inbound = 4;
  // DNS queries allowed, through the core's DNS: an app's own query for a domain through the VPN, a resolve
  // action's; they leave what a real query would (a fake address, a cache entry)
  bool resolve = 5;
}

// A rule the connection matched on its way.
message RouteTestStep {
  int32 index = 1;
  string rule = 2;
  string action = 3;
  // a resolve action's addresses
  repeated string resolved = 4;
  // what the action did, or what of it was taken on trust
  string note = 5;
}

message RouteTestResult {
  // the rule that decided; -1: none, the final outbound took it (or a lookup before the rules failed)
  int32 index = 1;
  string rule = 2;
  string action = 3;
  string outbound = 4;
  // a lookup the connection cannot do without failed, and it goes nowhere
  string error = 5;
  // the connection as the rules first saw it
  string destination = 6;
  bool fake_ip = 7;
  // what the core's DNS answered the app's own query through the VPN
  repeated string resolved = 8;
  // what the rules did not see as they would see a real connection
  repeated string notes = 9;
  repeated RouteTestStep steps = 10;
}

message WatchRequest {}

// What one write changed, or a task's result.
message Change {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    PROFILES = 1;
    GROUPS = 2;
    NODES = 3;
    RULES = 4;
    RULE_SETS = 5;
    SETTINGS = 6;
    TESTS = 7;
    SELECTED = 8;
    TASK = 9;
  }
  // grows with each change from the daemon's start; a reset's is the revision now
  uint64 revision = 1;
  // read again all that is shown: the first message, and where changes were lost
  bool reset = 2;
  Kind kind = 3;
  // what changed: added, changed or removed; empty: the whole kind
  repeated int64 ids = 4;
  // the task's result, with kind TASK
  TaskProgress task = 5;
}

// A task of the daemon's (an import): its steps, then its result. A task goes on to its end without the stream that
// asked for it; its result comes in Watch too.
message TaskProgress {
  string task_id = 1;
  // a line for the user
  string line = 2;
  // the result
  bool done = 3;
  // the result's gRPC code: 0 done, else what error says
  int32 code = 4;
  string error = 5;
  // an invite's import that needs its PIN (D-ADD-06): asked of the user, then Import again with it
  PinNeeded pin = 6;
  // what the task added or changed: the profiles an import or an update added
  repeated int64 ids = 7;
  // the subscription's group the task made or updated, a node's too
  int64 group_id = 8;
  // the raycontrol node the task imported or updated
  string node_id = 9;
}

// An invite asks for its PIN: 6 digits the user got from the node's administrator by another way.
message PinNeeded {
  // the node's host, as the invite names it
  string host = 1;
  // the tries the invite has left; -1: not known yet (the invite says it needs one, nothing was sent)
  int32 left = 2;
  // the PIN sent was wrong
  bool wrong = 3;
}

message Group {
  enum Type {
    BASIC = 0;
    SUBSCRIPTION = 1;
  }
  int64 id = 1;
  int64 order = 2;
  string name = 3;
  // the default group, made with the store: an import with no group goes there; it is not deleted
  bool ungrouped = 4;
  Type type = 5;
  // how many profiles it has; not saved
  int32 profiles = 6;
  // a subscription's group's
  Subscription subscription = 7;
  // a raycontrol node's group: its profiles are the node's subscription's, which only its updates change
  string node_id = 8;
}

// A group's subscription (the app's SubscriptionBean). The settings are the user's; what an update says is read only.
message Subscription {
  // the address the profiles are fetched from: http or https; empty where it was sealed on another machine and is
  // to be given again
  string link = 1;
  // one profile of each server
  bool deduplication = 2;
  // the servers' names resolved at each update
  bool force_resolve = 3;
  // the timed update waits for a connection
  bool update_when_connected_only = 4;
  // the User-Agent the provider is asked with; empty: the app's
  string custom_user_agent = 5;
  // the timed update, every auto_update_delay minutes (at least 15; a day by default); the provider's interval turns
  // it on at the first update
  bool auto_update = 6;
  int32 auto_update_delay = 7;

  // read only, from the updates: the last one's time (unix seconds, 0 for none); the traffic used and allowed
  // (bytes) and the expiry (unix seconds) the provider said, 0 for unknown; the provider's announcement
  int64 last_updated = 8;
  int64 used = 9;
  int64 total = 10;
  int64 expire = 11;
  string announce = 12;
  // an update of it runs now
  bool updating = 13;
}

message RefreshRequest {
  // the subscription's group (a node's group: its node); 0 with no node_id: every subscription's
  int64 group_id = 1;
  // a raycontrol node (D-NODE-02): its subscription
  string node_id = 2;
}

message GroupId {
  int64 id = 1;
}

message GroupList {
  repeated Group groups = 1;
}

message ListProfilesRequest {
  // 0: every group's
  int64 group_id = 1;
}

message Profile {
  int64 id = 1;
  int64 group_id = 2;
  int64 order = 3;
  // the bean's type, as the app's TypeMap names it: naive, hysteria, vmess (VLESS too), socks...
  string type = 4;
  // the bean's display name and address; not saved, the bean's own are
  string name = 5;
  string address = 6;
  // the whole bean: JSON with the app's field names, as the golden fixtures have it; empty in a list's rows
  string bean_json = 7;
  // the raycontrol node whose subscription's profile this is; "" for none
  string node_id = 9;
}

message ProfileList {
  repeated Profile profiles = 1;
}

message ProfileId {
  int64 id = 1;
}

message ShareLink {
  string link = 1;
}

message ConnectRequest {
  // How the computer's traffic reaches the core (D-NAV-02).
  enum Mode {
    // the local proxy; the default
    PROXY = 0;
    // the TUN: the system routes all traffic into it
    VPN = 1;
  }
  // the profile; 0: the selected one
  int64 profile_id = 1;
  // none: the settings' (service_mode)
  optional Mode mode = 2;
}

// A computer's settings: those its config's build takes (nikoconf.Settings, the app's ConfigSettings), with the app's
// values; as JSON their names are the app's (mixedPort). The window's own (its view) are the window's.
message Settings {
  // proxy or vpn: how the computer's traffic reaches the core (D-NAV-02) where Connect asks no mode; proxy by default
  string service_mode = 1;
  // in proxy mode the local proxy is the system's while the core runs: the daemon sets it for the user who connected,
  // and ManagedService.SetSystemProxyEnabled turns it off and on; on by default on Windows
  bool system_proxy = 2;
  // the TUN's stack: 0 gVisor, 1 system, 2 mixed
  int32 tun_implementation = 3;
  // the TUN's, from 1000 to 10000
  int32 mtu = 4;
  // 0 off, 1 on, 2 first, 3 only
  int32 ipv6_mode = 5;
  // no profile checks its server's certificate
  bool global_allow_insecure = 6;
  // DNS servers, a line each, "#" a comment, as the app reads them: the build takes the first (D-SET-18). "local"
  // is the system's
  string remote_dns = 7;
  string direct_dns = 8;
  // fake addresses for the TUN's queries
  bool enable_fake_dns = 9;
  // "" for the core's own, else auto, prefer_ipv4, prefer_ipv6, ipv4_only or ipv6_only
  string domain_strategy_for_remote = 10;
  string domain_strategy_for_direct = 11;
  string domain_strategy_for_server = 12;
  // an expired cache entry answered at once and refreshed behind
  bool dns_optimistic_cache = 13;
  // private addresses go direct (D-SET-16)
  bool bypass_lan_in_core = 14;
  // the local proxy: its port, from 1 to 65535
  int32 mixed_port = 15;
  // its login, none where the password is empty: the user's name (no colon; empty: "user") and password, printable
  // characters, 255 bytes at most
  string mixed_username = 16;
  string mixed_password = 17;
  // it listens on every address, not 127.0.0.1 alone: other devices of the LAN may use it
  bool allow_access = 18;
  // 0 off, 1 on
  int32 traffic_sniffing = 19;
  // domains resolved before routing
  bool resolve_destination = 20;
  // QUIC refused on a profile that carries UDP inside a stream, so browsers go to TCP at once
  bool refuse_quic_over_streams = 21;
  // an echo no outbound carries refused, not answered by the TUN
  bool icmp_no_local_reply = 22;
  // the core's log: 0 none (panic alone), 1 warn, 2 info, 3 debug, 4 trace
  int32 log_level = 23;
  // which programs go through Niko (D-RULES-06), as the phone's per-app proxy: 0 all, 1 only those of programs (the
  // rest direct), 2 all but those; a rule by program ahead of the rules
  int32 programs_mode = 24;
  // the programs, a line each: a name ("firefox.exe") or a full path, as the system names the process; empty lines
  // are none
  string programs = 25;
  // the rules' DNS rules: a rule's domains looked up by its way's DNS (direct ones by the direct DNS)
  bool enable_dns_routing = 26;
  // how often the rule-sets are fetched again, in hours: from 1 to 720
  int32 rule_set_update_hours = 27;
  // «Обход DPI для прямых соединений» on the direct rules with their dpi_bypass: 0 off, 1 a ready-made strategy
  // (dpi_direct_preset: tlsrec_sni, split_sni, disoob_sld, disorder_1), 2 a ByeDPI string (dpi_direct_custom)
  int32 dpi_direct = 28;
  string dpi_direct_preset = 29;
  string dpi_direct_custom = 30;
  // Phase P6 raycontrol dynamic settings: automatic failover on failure, measured Brutal for Hysteria2,
  // and opt-in anonymous daily network summaries to the node.
  bool raycontrol_auto_switch = 31;
  bool raycontrol_brutal = 32;
  bool raycontrol_reports = 33;
}

message SettingsUpdate {
  Settings settings = 1;
  // the names of the fields that change, as this file has them (mixed_port); the others' values are not read
  repeated string fields = 2;
}

message ProfileIds {
  repeated int64 ids = 1;
}

message MoveRequest {
  repeated int64 ids = 1;
  // the group they go into
  int64 group_id = 2;
  // the profile of that group they go before; 0: at its end
  int64 before = 3;
}

message ImportInput {
  // a paste, the clipboard, a QR code's text
  string text = 1;
  // a file's content, which the window read (the daemon reads no path); taken as text where text is empty
  bytes file = 2;
  string file_name = 3;
}

message ImportPreview {
  enum Kind {
    NOTHING = 0;
    PROFILES = 1;
    SUBSCRIPTION = 2;
    NODE = 3;
  }
  // NODE: a raycontrol node's invite or device package, whose import comes with the nodes
  Kind kind = 1;
  // the profiles an import would add, as rows without ids
  repeated Profile profiles = 2;
  // the subscription's link, with kind SUBSCRIPTION: its import makes a group of it
  string subscription = 3;
  // the node, with kind NODE: what the window says before the import
  NodePreview node = 4;
}

// What an invite or a device package names (D-ADD-06, -07); INVALID_ARGUMENT from Recognize where it does not read.
message NodePreview {
  // an invite (it registers this computer), else a device package
  bool invite = 1;
  // the node's host and name (names-v1, "" for none)
  string host = 2;
  string dns_name = 3;
  // the invite needs a PIN
  bool pin_required = 4;
  // when the invite expires, Unix seconds; 0: a package's, none
  int64 expires = 5;
  // a node kept already: the import replaces its device key (and its admin access), its group and profiles stay;
  // known_host is its host where the new one is another (a moved node, or someone else's link)
  bool replaces = 6;
  string known_host = 7;
}

message NodeId {
  string id = 1;
}

message NodeList {
  repeated Node nodes = 1;
}

// A raycontrol node as its package and last subscription have it: what its card shows (D-NODE-01…07, D-MAIN-13).
message Node {
  // spa.node_id
  string id = 1;
  string host = 2;
  // its admin's name for it, else "raycontrol · " and its host (D-NODE-01); note, what its owner tells its users (D-NODE-03)
  string name = 3;
  string note = 4;
  // its group, 0 before its first subscription; how many profiles it has (D-NODE-06: ListProfiles of it)
  int64 group_id = 5;
  int32 profiles = 6;
  // names-v1: the node's name, "" for none
  string dns_name = 7;
  // the device is an admin of the node (its remote API); the admin mode is not the desktop's yet
  bool admin = 8;
  // the device's subscription, signed by the node's ed25519 and ML-DSA-65 keys, each checked (D-NODE-05)
  bool subscription = 9;
  // the last subscription taken and until when it holds (this computer's clock, Unix seconds, 0: none yet), when the
  // next is fetched (0: not planned) (D-NODE-05, D-MAIN-13)
  int64 updated = 10;
  int64 expires = 11;
  int64 next_update = 12;
  // the node refused this device (revoked, or another key): no update is planned, a new invite is needed
  bool refused = 13;
  // updates failed in a row, the last one's error since the daemon started
  int32 failed = 14;
  string error = 15;
  // the traffic used and allowed (bytes) since and until when (Unix seconds, 0: no reset) (D-NODE-04, D-MAIN-13);
  // none for a user without a limit
  NodeTraffic traffic = 16;
  // the node's minimum version of Niko, "" for none; refused_version: no profiles came for this version
  string min_version = 17;
  bool refused_version = 18;
  // the node's clock minus this one's (s): over 30 SPA fails
  int64 clock_skew = 19;
  // an update of it runs now
  bool updating = 20;
  // its keys were sealed on another machine or by another account: it is to be imported again
  bool unreadable = 21;
  // Phase P6 dynamic capabilities and watchdog switch notice (D-STATE-SWITCHED).
  bool has_probe = 22;
  bool has_lan = 23;
  bool lan_show = 24;
  int32 relays = 25;
  string switched_from = 26;
  string switched_to = 27;
  int64 switched_at = 28;
}

message NodeTraffic {
  int64 used = 1;
  int64 limit = 2;
  int64 since = 3;
  int64 reset = 4;
  // used up, as the node says: no profiles until the reset
  bool exhausted = 5;
  // 90 % of the limit used
  bool near_limit = 6;
}

message ImportRequest {
  ImportInput input = 1;
  // the group the profiles go into; 0: the ungrouped one
  int64 group_id = 2;
  // an invite's PIN, 6 digits (TaskProgress.pin asked for it)
  string pin = 3;
}

// A route rule (RuleEntity): what it matches, all its fields together, and where that goes. The lists are text as
// the app's editor takes them: items by lines or commas. Domains: "full:", "domain:", "regexp:", "keyword:" or a
// suffix; "srs:https://…" a rule-set the daemon downloads, "rule-set:https://…" one the core fetches as it starts.
message Rule {
  int64 id = 1;
  string name = 2;
  // its place: the build takes the rules by it (read only: MoveRules)
  int64 order = 3;
  bool enabled = 4;
  string domains = 5;
  // addresses and subnets; "geoip:private" the private ones
  string ip = 6;
  // ports and ranges ("8000:9000")
  string port = 7;
  string source_port = 8;
  // "", tcp or udp
  string network = 9;
  // the source's subnets
  string source = 10;
  // sniffed protocols: tls, http, quic, bittorrent…
  string protocol = 11;
  // 0 the proxy, -1 directly (bypass), -2 blocked, else a profile's id
  int64 outbound = 12;
  // a computer's programs (D-RULES-02): a process's name ("firefox.exe") or its full path
  repeated string programs = 13;
  // «Обход DPI»: the strategy of dpi_direct on this rule where it goes directly
  bool dpi_bypass = 14;
  // the rule's own JSON, merged over it: an object, or none
  string config = 15;
  // how many of the phone's apps it names (read only): a computer leaves such a rule out where it has no programs
  int32 packages = 16;
}

message RuleList {
  repeated Rule rules = 1;
}

message RuleIds {
  repeated int64 ids = 1;
}

message MoveRulesRequest {
  repeated int64 ids = 1;
  // the rule they go before; 0: at the end
  int64 before = 2;
}

message PresetRequest {
  enum Preset {
    PRESET_UNSPECIFIED = 0;
    // blocked in Russia through the proxy, Russian services directly (runetfreedom's lists)
    RUSSIA = 1;
  }
  Preset preset = 1;
  // the rules' names, in the window's language: what is blocked, what goes directly; none for the app's English
  string blocked_name = 2;
  string direct_name = 3;
}

message PresetResult {
  // the rules added, in their order
  repeated Rule rules = 1;
  // their rule-sets, for UpdateRuleSets
  repeated string rule_sets = 2;
}

// A rule-set the daemon downloads, as a rule names it.
message RuleSet {
  // as the rules have it: "srs:" and its address
  string item = 1;
  // its address; the window shows it to the user alone
  string url = 2;
  // fetched over https: a list in the clear is never fetched
  bool fetchable = 3;
  // named by a rule that is on
  bool enabled = 4;
  // its file is here: the build takes it
  bool downloaded = 5;
  int64 size = 6;
  // when its file was fetched, Unix seconds; 0: never
  int64 updated = 7;
  // what it holds: 1 domains, 2 addresses, 3 both; 0 not known
  int32 kinds = 8;
  // its last download's error, since the daemon started; "" for none
  string error = 9;
  // a download of it runs now
  bool updating = 10;
}

message RuleSetList {
  repeated RuleSet rule_sets = 1;
  // the interval of the updates (Settings.rule_set_update_hours)
  int32 update_hours = 2;
}

message RuleSetRequest {
  // the items to download; none: those of the enabled rules
  repeated string items = 1;
  // fetched even where its file is newer than the interval
  bool force = 2;
}

message NodeTestRequest {
  string node_id = 1;
  // Optional run id (r-YYYYMMDD-HHMM by default); letters, digits, '.', '-', '_' only (1..64 chars).
  string run_id = 2;
}

message NodeTestProfile {
  string key = 1;
  string name = 2;
  string type = 3;
  string carrier = 4;
  string relay = 5;
  bool works = 6;
  int64 kbps = 7;
  int64 first_byte_ms = 8;
  string cause = 9;
  string error = 10;
  int64 stalled_at_kb = 11;
  optional bool udp_ok = 12;
  double udp_loss_pct = 13;
}

message NodeTestNote {
  string note = 1;
  int64 number = 2;
  string detail = 3;
}

message NodeTestFindings {
  repeated NodeTestProfile profiles = 1;
  repeated NodeTestNote notes = 2;
}

message NodeTestEvent {
  string run_id = 1;
  string step = 2;
  string line = 3;
  bool done = 4;
  string error = 5;
  NodeTestFindings findings = 6;
  string report_name = 7;
  string report_text = 8;
}

message NodeAdminRequest {
  string node_id = 1;
  // Method name on raycontrol.node.v1.NodeService (e.g. "GetStatus", "ListUsers") or "DeviceService/GetSelf".
  string method = 2;
  // Optional JSON request body; defaults to "{}".
  string body_json = 3;
}

message NodeAdminResponse {
  string body_json = 1;
}

message SetNodeLanRequest {
  string node_id = 1;
  bool show = 2;
}
