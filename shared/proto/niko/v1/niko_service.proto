// NikoService: Niko's own calls to its desktop daemon, nikod, served beside the core's daemon's services through the
// same channel and credentials (docs/design/desktop-stage3.md). Go: libcore/nikopb (shared/tool/gen_proto_go.sh); Dart:
// desktop/lib/gen (desktop/tool/gen_proto.sh).
syntax = "proto3";

package niko.v1;

option go_package = "libcore/nikopb;nikopb";

service NikoService {
  // What this daemon is. Any caller the daemon verified.
  rpc GetInfo(GetInfoRequest) returns (Info);
  // Which rule of the running core a connection would match and where it would go; no connection is made. The
  // daemon's owner only: it reads the owner's core; it runs outside the daemon's lifecycle lock, so a stop does not
  // wait for its lookups. FAILED_PRECONDITION when no core runs; ABORTED when the core stopped during the test (its
  // answer would be a closing core's, not the running one's).
  rpc RouteTest(RouteTestRequest) returns (RouteTestResult);

  // The calls below are on the caller's own store (libcore/nikostore): any caller the daemon verified, each with the
  // store of its user. Until the daemon names its caller to NikoService (a hook in the fork, desktop-stage3.md §6),
  // only development mode's caller is known; elsewhere they are UNIMPLEMENTED. FAILED_PRECONDITION for a store a
  // newer Niko wrote.

  // What changes in the store, and the results of its tasks: first a reset with the revision now, then each change;
  // a reset again where some were lost. A change says what changed: the window reads it again.
  rpc Watch(WatchRequest) returns (stream Change);

  // The groups, in their order.
  rpc ListGroups(Empty) returns (GroupList);
  // The profiles of a group, or of all, in the list's order: rows, without their beans. NOT_FOUND for no such group.
  rpc ListProfiles(ListProfilesRequest) returns (ProfileList);
  // A profile with its bean. NOT_FOUND; FAILED_PRECONDITION where its secrets cannot be opened on this machine.
  rpc GetProfile(ProfileId) returns (Profile);
  // A profile from its type and bean: a new one (id 0) at the end of its group, or the one of its id with a new bean of
  // the same type, where it is. INVALID_ARGUMENT for a bean that is not one of its type.
  rpc SaveProfile(Profile) returns (Profile);
  // Deletes the profiles of those ids that are there.
  rpc DeleteProfiles(ProfileIds) returns (Empty);
  // Puts profiles, in their order, into a group before one of its profiles or at its end.
  rpc MoveProfiles(MoveRequest) returns (Empty);
  // A group: of the user's own (BASIC), a new one (id 0) or a new name; of a subscription (SUBSCRIPTION, D-SUB-01,
  // -02, -08), a new one with its subscription's address and settings (its name the app's default, "Subscription
  // #…", where none is given, which its first update replaces by the provider's), or the name and settings of one;
  // what its updates set is kept. Saving makes no update: Refresh does. INVALID_ARGUMENT for an address that is no
  // http(s) URL, an interval under 15 minutes; FAILED_PRECONDITION for a group of the other type.
  rpc SaveGroup(Group) returns (Group);
  // Deletes a group and its profiles; the ungrouped group stays (FAILED_PRECONDITION).
  rpc DeleteGroup(GroupId) returns (Empty);
  // The profile the window connects with (D-MAIN-07): kept in state.json, none (0) once deleted. Watch says SELECTED
  // with its id, or no id for none. Id 0 selects none; NOT_FOUND for no such profile; FAILED_PRECONDITION for one whose
  // secrets cannot be opened on this machine.
  rpc Select(ProfileId) returns (Empty);
  // The selected profile; id 0: none.
  rpc GetSelected(Empty) returns (ProfileId);
  // The link to share a profile by (D-PROFILE-07), as the app writes it: a link of its type's own, else sn://.
  // NOT_FOUND; FAILED_PRECONDITION where its secrets cannot be opened on this machine; UNIMPLEMENTED for a kind with
  // no link (a plugin's profile).
  rpc ShareProfile(ProfileId) returns (ShareLink);
  // Builds the config of a profile in the daemon, as the app builds it, for this computer (Windows or Linux) with the
  // computer's settings (GetSettings) in the mode asked, else theirs, and starts the core with it (reloads the one
  // running), as DesktopService.StartService starts a config with no options: the caller becomes the daemon's owner.
  // By default proxy mode: the local proxy on 127.0.0.1:2080 with no login, on Windows the caller's system proxy too
  // (system_proxy), set by the daemon for the caller; VPN mode is the TUN, which the core opens only with the daemon's
  // privileges. FAILED_PRECONDITION for no profile selected, one
  // whose secrets cannot be opened on this machine, or settings whose secrets cannot; NOT_FOUND; INVALID_ARGUMENT for
  // a profile the build refuses, or no such mode; UNIMPLEMENTED for a plugin's profile; PERMISSION_DENIED where another
  // user owns the daemon; the core's own error for a config it refuses or cannot start.
  rpc Connect(ConnectRequest) returns (Empty);

  // The computer's settings (D-SET-05, -16, -18): what Connect builds the config with. FAILED_PRECONDITION where
  // their secrets were sealed by another machine or account: they are to be set again.
  rpc GetSettings(Empty) returns (Settings);
  // Sets the settings named to their values in the request, the others as they were, in one write: the settings
  // then. Watch says SETTINGS. INVALID_ARGUMENT for a name that is no field of Settings, or a value it may not have,
  // and nothing is changed; FAILED_PRECONDITION where the secrets cannot be opened on this machine and the change
  // does not set them again.
  rpc UpdateSettings(SettingsUpdate) returns (Settings);

  // What an input is and what its import would add; nothing is written, and no store is needed.
  rpc Recognize(ImportInput) returns (ImportPreview);
  // Imports an input: the task's progress, then its result, the last message (done). Share links and sn://; a
  // subscription's link (http(s), clash://install-config, another client's "add subscription" link) makes a group of
  // that subscription and updates it, as the app's import does: the result names the group (group_id). A raycontrol
  // node's invite or device package is recognized, its import comes with the nodes (UNIMPLEMENTED as the result's
  // code), and so is a whole group shared as sn://subscription.
  rpc Import(ImportRequest) returns (stream TaskProgress);

  // Updates a subscription's group (D-SUB-03), or every one (group_id 0), as the app's update does: the answer
  // fetched, its profiles merged into the group's, its traffic and expiry kept (Subscription). A task, as Import is:
  // its progress, then its result; the result in Watch too, and the group's change. The daemon updates the groups
  // that say so on their own, by their interval. NOT_FOUND; FAILED_PRECONDITION for a group of no subscription or
  // one whose address cannot be opened on this machine (to be given again); ABORTED where an update of the group runs
  // already; UNAVAILABLE where the provider did not answer, INVALID_ARGUMENT where its answer has no profiles,
  // PERMISSION_DENIED where its panel refused this device: as the result's code.
  rpc Refresh(RefreshRequest) returns (stream TaskProgress);
}

message Empty {}

message GetInfoRequest {}

message Info {
  // Niko's version, as its build names it
  string niko_version = 1;
  // the core's version
  string core_version = 2;
  // the schema of the daemon's store (nikostore's); 0: a daemon without one
  int32 store_schema = 3;
  // the version of this API: what the window may ask. 2: the store, Watch and the import; 3: Select and GetSelected;
  // 4: ShareProfile; 5: Connect; 6: Connect's mode, the config a computer's; 7: the computer's settings, Connect
  // with them; 8: the programs through Niko; 9: subscriptions (Group.subscription, Refresh, their import)
  int32 api = 4;
}

message RouteTestRequest {
  // tcp (the default) or udp
  string network = 1;
  // a domain or an address
  string host = 2;
  uint32 port = 3;
  // the inbound's tag: tun-in (the default), mixed-in or another of the running core's
  string inbound = 4;
  // DNS queries allowed, through the core's DNS: an app's own query for a domain through the VPN, a resolve
  // action's; they leave what a real query would (a fake address, a cache entry)
  bool resolve = 5;
}

// A rule the connection matched on its way.
message RouteTestStep {
  int32 index = 1;
  string rule = 2;
  string action = 3;
  // a resolve action's addresses
  repeated string resolved = 4;
  // what the action did, or what of it was taken on trust
  string note = 5;
}

message RouteTestResult {
  // the rule that decided; -1: none, the final outbound took it (or a lookup before the rules failed)
  int32 index = 1;
  string rule = 2;
  string action = 3;
  string outbound = 4;
  // a lookup the connection cannot do without failed, and it goes nowhere
  string error = 5;
  // the connection as the rules first saw it
  string destination = 6;
  bool fake_ip = 7;
  // what the core's DNS answered the app's own query through the VPN
  repeated string resolved = 8;
  // what the rules did not see as they would see a real connection
  repeated string notes = 9;
  repeated RouteTestStep steps = 10;
}

message WatchRequest {}

// What one write changed, or a task's result.
message Change {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    PROFILES = 1;
    GROUPS = 2;
    NODES = 3;
    RULES = 4;
    RULE_SETS = 5;
    SETTINGS = 6;
    TESTS = 7;
    SELECTED = 8;
    TASK = 9;
  }
  // grows with each change from the daemon's start; a reset's is the revision now
  uint64 revision = 1;
  // read again all that is shown: the first message, and where changes were lost
  bool reset = 2;
  Kind kind = 3;
  // what changed: added, changed or removed; empty: the whole kind
  repeated int64 ids = 4;
  // the task's result, with kind TASK
  TaskProgress task = 5;
}

// A task of the daemon's (an import): its steps, then its result. A task goes on to its end without the stream that
// asked for it; its result comes in Watch too.
message TaskProgress {
  string task_id = 1;
  // a line for the user
  string line = 2;
  // the result
  bool done = 3;
  // the result's gRPC code: 0 done, else what error says
  int32 code = 4;
  string error = 5;
  // what the task added or changed: the profiles an import or an update added
  repeated int64 ids = 7;
  // the subscription's group the task made or updated
  int64 group_id = 8;
}

message Group {
  enum Type {
    BASIC = 0;
    SUBSCRIPTION = 1;
  }
  int64 id = 1;
  int64 order = 2;
  string name = 3;
  // the default group, made with the store: an import with no group goes there; it is not deleted
  bool ungrouped = 4;
  Type type = 5;
  // how many profiles it has; not saved
  int32 profiles = 6;
  // a subscription's group's
  Subscription subscription = 7;
}

// A group's subscription (the app's SubscriptionBean). The settings are the user's; what an update says is read only.
message Subscription {
  // the address the profiles are fetched from: http or https; empty where it was sealed on another machine and is
  // to be given again
  string link = 1;
  // one profile of each server
  bool deduplication = 2;
  // the servers' names resolved at each update
  bool force_resolve = 3;
  // the timed update waits for a connection
  bool update_when_connected_only = 4;
  // the User-Agent the provider is asked with; empty: the app's
  string custom_user_agent = 5;
  // the timed update, every auto_update_delay minutes (at least 15; a day by default); the provider's interval turns
  // it on at the first update
  bool auto_update = 6;
  int32 auto_update_delay = 7;

  // read only, from the updates: the last one's time (unix seconds, 0 for none); the traffic used and allowed
  // (bytes) and the expiry (unix seconds) the provider said, 0 for unknown; the provider's announcement
  int64 last_updated = 8;
  int64 used = 9;
  int64 total = 10;
  int64 expire = 11;
  string announce = 12;
  // an update of it runs now
  bool updating = 13;
}

message RefreshRequest {
  // the subscription's group; 0: every one
  int64 group_id = 1;
}

message GroupId {
  int64 id = 1;
}

message GroupList {
  repeated Group groups = 1;
}

message ListProfilesRequest {
  // 0: every group's
  int64 group_id = 1;
}

message Profile {
  int64 id = 1;
  int64 group_id = 2;
  int64 order = 3;
  // the bean's type, as the app's TypeMap names it: naive, hysteria, vmess (VLESS too), socks...
  string type = 4;
  // the bean's display name and address; not saved, the bean's own are
  string name = 5;
  string address = 6;
  // the whole bean: JSON with the app's field names, as the golden fixtures have it; empty in a list's rows
  string bean_json = 7;
}

message ProfileList {
  repeated Profile profiles = 1;
}

message ProfileId {
  int64 id = 1;
}

message ShareLink {
  string link = 1;
}

message ConnectRequest {
  // How the computer's traffic reaches the core (D-NAV-02).
  enum Mode {
    // the local proxy; the default
    PROXY = 0;
    // the TUN: the system routes all traffic into it
    VPN = 1;
  }
  // the profile; 0: the selected one
  int64 profile_id = 1;
  // none: the settings' (service_mode)
  optional Mode mode = 2;
}

// A computer's settings: those its config's build takes (nikoconf.Settings, the app's ConfigSettings), with the app's
// values; as JSON their names are the app's (mixedPort). The window's own (its view) are the window's.
message Settings {
  // proxy or vpn: how the computer's traffic reaches the core (D-NAV-02) where Connect asks no mode; proxy by default
  string service_mode = 1;
  // in proxy mode the local proxy is the system's while the core runs: the daemon sets it for the user who connected,
  // and ManagedService.SetSystemProxyEnabled turns it off and on; on by default on Windows
  bool system_proxy = 2;
  // the TUN's stack: 0 gVisor, 1 system, 2 mixed
  int32 tun_implementation = 3;
  // the TUN's, from 1000 to 10000
  int32 mtu = 4;
  // 0 off, 1 on, 2 first, 3 only
  int32 ipv6_mode = 5;
  // no profile checks its server's certificate
  bool global_allow_insecure = 6;
  // DNS servers, a line each, "#" a comment, as the app reads them: the build takes the first (D-SET-18). "local"
  // is the system's
  string remote_dns = 7;
  string direct_dns = 8;
  // fake addresses for the TUN's queries
  bool enable_fake_dns = 9;
  // "" for the core's own, else auto, prefer_ipv4, prefer_ipv6, ipv4_only or ipv6_only
  string domain_strategy_for_remote = 10;
  string domain_strategy_for_direct = 11;
  string domain_strategy_for_server = 12;
  // an expired cache entry answered at once and refreshed behind
  bool dns_optimistic_cache = 13;
  // private addresses go direct (D-SET-16)
  bool bypass_lan_in_core = 14;
  // the local proxy: its port, from 1 to 65535
  int32 mixed_port = 15;
  // its login, none where the password is empty: the user's name (no colon; empty: "user") and password, printable
  // characters, 255 bytes at most
  string mixed_username = 16;
  string mixed_password = 17;
  // it listens on every address, not 127.0.0.1 alone: other devices of the LAN may use it
  bool allow_access = 18;
  // 0 off, 1 on
  int32 traffic_sniffing = 19;
  // domains resolved before routing
  bool resolve_destination = 20;
  // QUIC refused on a profile that carries UDP inside a stream, so browsers go to TCP at once
  bool refuse_quic_over_streams = 21;
  // an echo no outbound carries refused, not answered by the TUN
  bool icmp_no_local_reply = 22;
  // the core's log: 0 none (panic alone), 1 warn, 2 info, 3 debug, 4 trace
  int32 log_level = 23;
  // which programs go through Niko (D-RULES-06), as the phone's per-app proxy: 0 all, 1 only those of programs (the
  // rest direct), 2 all but those; a rule by program ahead of the rules
  int32 programs_mode = 24;
  // the programs, a line each: a name ("firefox.exe") or a full path, as the system names the process; empty lines
  // are none
  string programs = 25;
}

message SettingsUpdate {
  Settings settings = 1;
  // the names of the fields that change, as this file has them (mixed_port); the others' values are not read
  repeated string fields = 2;
}

message ProfileIds {
  repeated int64 ids = 1;
}

message MoveRequest {
  repeated int64 ids = 1;
  // the group they go into
  int64 group_id = 2;
  // the profile of that group they go before; 0: at its end
  int64 before = 3;
}

message ImportInput {
  // a paste, the clipboard, a QR code's text
  string text = 1;
  // a file's content, which the window read (the daemon reads no path); taken as text where text is empty
  bytes file = 2;
  string file_name = 3;
}

message ImportPreview {
  enum Kind {
    NOTHING = 0;
    PROFILES = 1;
    SUBSCRIPTION = 2;
    // a raycontrol node's invite or device package: nodes come with slice 11
    NODE = 3;
  }
  Kind kind = 1;
  // the profiles an import would add, as rows without ids
  repeated Profile profiles = 2;
  // the subscription's link, with kind SUBSCRIPTION: its import makes a group of it
  string subscription = 3;
}

message ImportRequest {
  ImportInput input = 1;
  // the group the profiles go into; 0: the ungrouped one
  int64 group_id = 2;
}
