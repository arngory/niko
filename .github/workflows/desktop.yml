# The desktop client, Windows first (the owner's decision of 2026-11-15): the core and its daemon (experimental/boxdd,
# the service a desktop app talks to) built for Windows with Niko's protocols, port knocking and naive among them, and
# the Go the desktop client takes over from the app tested on Windows itself. naive is Chromium 158's libcronet.dll
# from the fork of cronet-go (built by the server session), which the core loads with purego from beside its
# executable: each architecture's directory holds the two executables and the library. The window is Flutter
# (desktop/): analysed, tested and built on Windows and on Linux, and its link to the daemon checked against the real
# boxdd in development mode (stage 2b of docs/design/desktop.md).
name: Desktop (Windows)

on:
  push:
    paths:
      - "buildScript/lib/core/get_source_env.sh"
      - "libcore/go.mod"
      - "libcore/raysub/**"
      - "libcore/rayapi/**"
      - "libcore/rayprobe/**"
      - "libcore/probe/**"
      - "libcore/dnsprobe/**"
      - "libcore/minisign/**"
      - "libcore/stun/**"
      - "libcore/routetest/**"
      - "libcore/nikopb/**"
      - "libcore/nikoservice/**"
      - "libcore/nikofmt/**"
      - "libcore/cmd/nikod/**"
      - "libcore/go.mod"
      - "libcore/go.sum"
      - "desktop/**"
      - "shared/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

# read-only token: nothing here writes to the repository
permissions:
  contents: read

env:
  TAGS: with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_xhttp,with_awg,with_dnstt,with_masterdnsvpn,with_yggdrasil,badlinkname,tfogo_checklinkname0

# one run per branch for pushes: a newer push cancels the push run it supersedes (one full run per commit); a
# manual or scheduled run (another version, other inputs) has a group of its own and is never cancelled by them
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: libcore/go.mod
          cache-dependency-path: libcore/go.sum

      - name: Fetch sources
        run: ./run lib core/init

      # the daemon's own tags for Windows (the external WinDivert and USB/IP drivers) besides Niko's, naive through
      # purego; pure Go, so cross-compiled here. Each architecture's library is the one the fork's SHA256SUMS names,
      # of the Chromium the Android library is (the core's intermediate anchors are of that release)
      - name: The core, the daemon and naive's library for Windows
        run: |
          NIKO_VERSION="$(sed -n 's/^VERSION_NAME=//p' niko.properties)-${GITHUB_SHA::7}"
          cd ../sing-box
          chromium="$(sed -n 's/^const ChromiumAnchorsVersion = "\(.*\)"$/\1/p' common/certificate/chromium_anchors_neko_generated.go)"
          [ -n "$chromium" ] || { echo "::error::no Chromium version of the core's anchors"; exit 1; }
          for arch in amd64 arm64; do
            out="$RUNNER_TEMP/desktop/windows-$arch"
            mkdir -p "$out"
            for pkg in cmd/sing-box cmd/boxdd; do
              GOOS=windows GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -checklinkname=0" \
                -tags="$TAGS,with_naive_outbound,with_purego,with_external_windivert,with_external_usbip_drivers" \
                -o "$out/$(basename "$pkg").exe" "./$pkg"
            done
            # Niko's daemon: boxdd with NikoService beside it (docs/design/desktop-stage3.md, slice 1)
            (cd "$GITHUB_WORKSPACE/libcore" && GOOS=windows GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags="-s -w -checklinkname=0 -X libcore/nikoservice.Version=$NIKO_VERSION" \
              -tags="$TAGS,with_naive_outbound,with_purego,with_external_windivert,with_external_usbip_drivers" \
              -o "$out/nikod.exe" ./cmd/nikod)
            go mod download "github.com/sagernet/cronet-go/lib/windows_$arch"
            lib="$(go list -m -f '{{.Dir}}' "github.com/sagernet/cronet-go/lib/windows_$arch")"
            sums="$(go list -m -f '{{.Dir}}' github.com/sagernet/cronet-go)/SHA256SUMS"
            want="$(awk -v f="lib/windows_$arch/libcronet.dll" '$2 == f {print $1}' "$sums")"
            have="$(sha256sum "$lib/libcronet.dll" | cut -d' ' -f1)"
            [ -n "$want" ] && [ "$have" = "$want" ] ||
              { echo "::error::windows_$arch libcronet.dll $have, the fork's SHA256SUMS says '${want:-none}'"; exit 1; }
            grep -q "const Version = \"$chromium\"" "$lib/libcronet.go" ||
              { echo "::error::windows_$arch is not Chromium $chromium"; exit 1; }
            cp "$lib/libcronet.dll" "$out/libcronet.dll"
            echo "windows-$arch: $(du -h "$out"/* | tr '\t\n' ' ')(libcronet.dll $have, Chromium $chromium)"
          done
          # the daemon for Linux, for the window's test against it there (Niko's tags; naive needs its library and is
          # not what that test asks for)
          mkdir -p "$RUNNER_TEMP/desktop/linux-amd64"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -checklinkname=0" -tags="$TAGS" \
            -o "$RUNNER_TEMP/desktop/linux-amd64/boxdd" ./cmd/boxdd
          (cd "$GITHUB_WORKSPACE/libcore" && GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -checklinkname=0 -X libcore/nikoservice.Version=$NIKO_VERSION" -tags="$TAGS" \
            -o "$RUNNER_TEMP/desktop/linux-amd64/nikod" ./cmd/nikod)
          # port knocking is in the core now: a profile of a raycontrol node needs it to reach the node; and naive
          for daemon in boxdd nikod; do
            go version -m "$RUNNER_TEMP/desktop/windows-amd64/$daemon.exe" > /dev/null
            for pkg in knock naive; do
              strings "$RUNNER_TEMP/desktop/windows-amd64/$daemon.exe" | grep -q "sing-box/protocol/$pkg" ||
                { echo "::error::$daemon has no $pkg"; exit 1; }
            done
          done
          strings "$RUNNER_TEMP/desktop/windows-amd64/nikod.exe" | grep -q "niko.v1.NikoService" ||
            { echo "::error::nikod has no NikoService"; exit 1; }

      - name: The binaries
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: desktop-windows
          path: ${{ runner.temp }}/desktop
          retention-days: 7

  # the Go the desktop client takes over, on Windows itself: the core's knock and certificates, libcore's node
  # subscription, the node's API, the probes, the update signature, the share links against the golden fixtures
  # (nikofmt; ci.yml's golden job has the app write them)
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: libcore/go.mod
          cache-dependency-path: libcore/go.sum

      # what ./run lib core/init fetches, without the NDK's environment that script sets up
      - name: Fetch sources
        run: |
          . buildScript/lib/core/get_source_env.sh
          git clone --filter=blob:none "$REPOSITORY_SING_BOX" ../sing-box
          git -C ../sing-box checkout -q "$COMMIT_SING_BOX"

      - name: The core's packages on Windows
        working-directory: ../sing-box
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" ./protocol/knock ./common/certificate ./common/udpdesync ./common/nikoicmp

      # libcronet.dll of the fork's module through purego, beside the test's executable as beside the desktop's (the
      # loader takes it from there, not from PATH): naive over HTTP/2 and QUIC against the core's own naive inbound,
      # the profile's root and key pins; and a root of the Windows store (put in for the test, taken out after)
      # refused without CRONET_WINDOWS_SYSTEM_ROOTS=1
      - name: naive on Windows
        working-directory: ../sing-box
        env:
          CGO_ENABLED: "0"
          NEKO_NAIVE_WINDOWS_ROOTS: "1"
        run: |
          go mod download github.com/sagernet/cronet-go/lib/windows_amd64
          lib="$(go list -m -f '{{.Dir}}' github.com/sagernet/cronet-go/lib/windows_amd64)"
          bin="$RUNNER_TEMP/naive-test"
          mkdir -p "$bin"
          go test -c -o "$bin/naive.test.exe" -ldflags=-checklinkname=0 -tags="$TAGS,with_naive_outbound,with_purego" \
            ./protocol/naive
          cp "$lib/libcronet.dll" "$bin/"
          cd "$bin"
          ./naive.test.exe -test.count=1 -test.v -test.timeout=10m -test.run 'TestNekoNaiveWindows'

      - name: libcore's packages on Windows
        working-directory: libcore
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" ./raysub ./rayapi ./minisign ./probe ./rayprobe ./dnsprobe ./stun ./nikoservice ./routetest ./nikofmt/...

  # The window (desktop/, Flutter): the generated files are what their sources give, the analyser is clean, the
  # tests pass, and the link to the daemon works against the real boxdd of this run in development mode: the button
  # starts a config, the status and the traffic are seen (stage 2b). Then the release build, which has no
  # development link in it.
  app:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # Flutter 3.50.0 stable, by its commit
      FLUTTER_VERSION: "3.50.0"
      FLUTTER_COMMIT: ab2912035e160d9cad6306df307576da6128ebdb
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Flutter
        run: |
          git clone -q --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          have="$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)"
          [ "$have" = "$FLUTTER_COMMIT" ] || { echo "::error::Flutter $FLUTTER_VERSION is $have, pinned $FLUTTER_COMMIT"; exit 1; }
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          flutter --disable-analytics > /dev/null
          flutter --version

      - name: What Linux needs to build a window
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q clang cmake ninja-build pkg-config libgtk-3-dev > /dev/null

      - name: Dependencies, as locked
        working-directory: desktop
        run: flutter pub get --enforce-lockfile

      # generated files against their sources: the theme against shared/tokens.json, the daemon's API against the
      # core's protos at the commit the app pins
      - name: Go, for the generated Go
        if: runner.os == 'Linux'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: libcore/go.mod
          cache: false

      - name: Generated files are current
        if: runner.os == 'Linux'
        run: |
          python3 -I shared/tool/gen_tokens.py --check
          # the window's icons too (desktop/lib/ui/icons.g.dart), from the same SVGs as Android's
          python3 -I shared/tool/gen_icons.py --check
          . buildScript/lib/core/get_source_env.sh
          git clone -q --filter=blob:none --no-checkout "$REPOSITORY_SING_BOX" "$RUNNER_TEMP/core"
          git -C "$RUNNER_TEMP/core" checkout -q "$COMMIT_SING_BOX"
          python3 -m pip install -q grpcio-tools==1.85.1
          dart pub global activate protoc_plugin 25.1.0 > /dev/null
          export PATH="$PATH:$HOME/.pub-cache/bin"
          desktop/tool/gen_proto.sh --check "$RUNNER_TEMP/core"
          # NikoService as Go (libcore/nikopb), from the same shared/proto
          shared/tool/gen_proto_go.sh --check

      - name: Analyse
        working-directory: desktop
        run: flutter analyze && dart analyze tool

      - name: Tests
        working-directory: desktop
        run: flutter test

      - name: The screens, when a picture differs
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: desktop-golden-failures-${{ runner.os }}
          path: desktop/test/failures
          if-no-files-found: ignore
          retention-days: 7

      - name: The daemon of this run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: desktop-windows
          path: ${{ runner.temp }}/daemon

      - name: The window's link against the real daemon
        working-directory: desktop
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            daemon="$RUNNER_TEMP/daemon/windows-amd64/nikod.exe"
          else
            daemon="$RUNNER_TEMP/daemon/linux-amd64/nikod"
            chmod +x "$daemon"
          fi
          NIKO_DAEMON="$daemon" flutter test test/real_daemon_test.dart

      # «Что решить», п. 2 of docs/design/desktop.md: what dart:io can open towards the daemon's worker here
      - name: Local sockets dart:io has on this system (informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: desktop
        run: |
          {
            echo "### dart:io and local sockets, $RUNNER_OS"
            echo '```'
            dart run tool/probe_local_sockets.dart
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # no NIKO_DEV: the release has no way to a daemon over TCP
      - name: Build
        working-directory: desktop
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            flutter build windows --release
            out=build/windows/x64/runner/Release
          else
            flutter build linux --release
            out=build/linux/x64/release/bundle
          fi
          ls -la "$out"
          du -sh "$out"
          # the development link's own words are not in a release
          if grep -r -a -l -- "--daemon takes 127.0.0.1" "$out" > /dev/null; then
            echo "::error::the release build carries the development link"; exit 1
          fi
          echo "WINDOW_OUT=desktop/$out" >> "$GITHUB_ENV"

      - name: The window
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: niko-window-${{ runner.os }}
          path: ${{ env.WINDOW_OUT }}
          retention-days: 7
