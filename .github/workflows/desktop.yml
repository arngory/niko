# The desktop client's daemon, Windows first (the owner's decision of 2026-11-15): the core and its daemon
# (experimental/boxdd, the service a desktop app talks to) built for Windows with Niko's protocols, port knocking and
# naive among them, Niko's own daemon nikod (boxdd with NikoService beside it), and the Go the desktop client takes
# over from the app tested on Windows itself. naive is Chromium 158's libcronet.dll from the fork of cronet-go (built
# by the server session), which the core loads with purego from beside its executable: each architecture's directory
# holds the executables and the library. The window (Flutter) lives in arngory/niko-desktop since 2026-11-23 and pins
# this repository by commit: its CI builds nikod from that commit as the build job here does and checks the window
# against it, its generated files against shared/ (docs/design/desktop-stage3.md, «Где живёт окно»).
name: Desktop (Windows)

on:
  push:
    paths:
      - "buildScript/lib/core/get_source_env.sh"
      - "libcore/go.mod"
      - "libcore/raysub/**"
      - "libcore/rayapi/**"
      - "libcore/rayprobe/**"
      - "libcore/probe/**"
      - "libcore/dnsprobe/**"
      - "libcore/minisign/**"
      - "libcore/stun/**"
      - "libcore/routetest/**"
      - "libcore/ruleset/**"
      - "libcore/nikopb/**"
      - "libcore/nikoservice/**"
      - "libcore/nikostore/**"
      - "libcore/nikofmt/**"
      - "libcore/nikoconf/**"
      - "libcore/nikosub/**"
      - "libcore/nikoray/**"
      - "libcore/cmd/nikod/**"
      - "libcore/go.mod"
      - "libcore/go.sum"
      - "shared/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

# read-only token: nothing here writes to the repository
permissions:
  contents: read

env:
  TAGS: with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_xhttp,with_awg,with_dnstt,with_masterdnsvpn,with_yggdrasil,badlinkname,tfogo_checklinkname0

# one run per branch for pushes: a newer push cancels the push run it supersedes (one full run per commit); a
# manual or scheduled run (another version, other inputs) has a group of its own and is never cancelled by them
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: libcore/go.mod
          cache-dependency-path: libcore/go.sum

      - name: Fetch sources
        run: ./run lib core/init

      # the daemon's own tags for Windows (the external WinDivert and USB/IP drivers) besides Niko's, naive through
      # purego; pure Go, so cross-compiled here. Each architecture's library is the one the fork's SHA256SUMS names,
      # of the Chromium the Android library is (the core's intermediate anchors are of that release)
      - name: The core, the daemon and naive's library for Windows
        run: |
          NIKO_VERSION="$(sed -n 's/^VERSION_NAME=//p' niko.properties)-${GITHUB_SHA::7}"
          cd ../sing-box
          chromium="$(sed -n 's/^const ChromiumAnchorsVersion = "\(.*\)"$/\1/p' common/certificate/chromium_anchors_neko_generated.go)"
          [ -n "$chromium" ] || { echo "::error::no Chromium version of the core's anchors"; exit 1; }
          for arch in amd64 arm64; do
            out="$RUNNER_TEMP/desktop/windows-$arch"
            mkdir -p "$out"
            for pkg in cmd/sing-box cmd/boxdd; do
              GOOS=windows GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -checklinkname=0" \
                -tags="$TAGS,with_naive_outbound,with_purego,with_external_windivert,with_external_usbip_drivers" \
                -o "$out/$(basename "$pkg").exe" "./$pkg"
            done
            # Niko's daemon: boxdd with NikoService beside it (docs/design/desktop-stage3.md, slice 1)
            (cd "$GITHUB_WORKSPACE/libcore" && GOOS=windows GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags="-s -w -checklinkname=0 -X libcore/nikoservice.Version=$NIKO_VERSION" \
              -tags="$TAGS,with_naive_outbound,with_purego,with_external_windivert,with_external_usbip_drivers" \
              -o "$out/nikod.exe" ./cmd/nikod)
            go mod download "github.com/sagernet/cronet-go/lib/windows_$arch"
            lib="$(go list -m -f '{{.Dir}}' "github.com/sagernet/cronet-go/lib/windows_$arch")"
            sums="$(go list -m -f '{{.Dir}}' github.com/sagernet/cronet-go)/SHA256SUMS"
            want="$(awk -v f="lib/windows_$arch/libcronet.dll" '$2 == f {print $1}' "$sums")"
            have="$(sha256sum "$lib/libcronet.dll" | cut -d' ' -f1)"
            [ -n "$want" ] && [ "$have" = "$want" ] ||
              { echo "::error::windows_$arch libcronet.dll $have, the fork's SHA256SUMS says '${want:-none}'"; exit 1; }
            grep -q "const Version = \"$chromium\"" "$lib/libcronet.go" ||
              { echo "::error::windows_$arch is not Chromium $chromium"; exit 1; }
            cp "$lib/libcronet.dll" "$out/libcronet.dll"
            echo "windows-$arch: $(du -h "$out"/* | tr '\t\n' ' ')(libcronet.dll $have, Chromium $chromium)"
          done
          # the daemon for Linux, as the window's CI builds it for its test there (Niko's tags; naive needs its library
          # and is not what that test asks for)
          mkdir -p "$RUNNER_TEMP/desktop/linux-amd64"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -checklinkname=0" -tags="$TAGS" \
            -o "$RUNNER_TEMP/desktop/linux-amd64/boxdd" ./cmd/boxdd
          (cd "$GITHUB_WORKSPACE/libcore" && GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -checklinkname=0 -X libcore/nikoservice.Version=$NIKO_VERSION" -tags="$TAGS" \
            -o "$RUNNER_TEMP/desktop/linux-amd64/nikod" ./cmd/nikod)
          # port knocking is in the core now: a profile of a raycontrol node needs it to reach the node; and naive
          for daemon in boxdd nikod; do
            go version -m "$RUNNER_TEMP/desktop/windows-amd64/$daemon.exe" > /dev/null
            for pkg in knock naive; do
              strings "$RUNNER_TEMP/desktop/windows-amd64/$daemon.exe" | grep -q "sing-box/protocol/$pkg" ||
                { echo "::error::$daemon has no $pkg"; exit 1; }
            done
          done
          strings "$RUNNER_TEMP/desktop/windows-amd64/nikod.exe" | grep -q "niko.v1.NikoService" ||
            { echo "::error::nikod has no NikoService"; exit 1; }

      # for a manual check of a commit here; the window's CI builds its own from the commit it pins
      - name: The binaries
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: desktop-windows
          path: ${{ runner.temp }}/desktop
          retention-days: 7

  # the Go the desktop client takes over, on Windows itself: the core's knock and certificates, libcore's node
  # subscription, the node's API, the probes, the update signature, the share links against the golden fixtures
  # (nikofmt; ci.yml's golden job has the app write them), the daemon's store with its secrets under DPAPI
  # (nikostore) and NikoService's calls on it
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: libcore/go.mod
          cache-dependency-path: libcore/go.sum

      # what ./run lib core/init fetches, without the NDK's environment that script sets up
      - name: Fetch sources
        run: |
          . buildScript/lib/core/get_source_env.sh
          git clone --filter=blob:none "$REPOSITORY_SING_BOX" ../sing-box
          git -C ../sing-box checkout -q "$COMMIT_SING_BOX"

      - name: The core's packages on Windows
        working-directory: ../sing-box
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" ./protocol/knock ./common/certificate ./common/udpdesync ./common/nikoicmp ./experimental/boxdd

      # libcronet.dll of the fork's module through purego, beside the test's executable as beside the desktop's (the
      # loader takes it from there, not from PATH): naive over HTTP/2 and QUIC against the core's own naive inbound,
      # the profile's root and key pins; and a root of the Windows store (put in for the test, taken out after)
      # refused without CRONET_WINDOWS_SYSTEM_ROOTS=1
      - name: naive on Windows
        working-directory: ../sing-box
        env:
          CGO_ENABLED: "0"
          NEKO_NAIVE_WINDOWS_ROOTS: "1"
        run: |
          go mod download github.com/sagernet/cronet-go/lib/windows_amd64
          lib="$(go list -m -f '{{.Dir}}' github.com/sagernet/cronet-go/lib/windows_amd64)"
          bin="$RUNNER_TEMP/naive-test"
          mkdir -p "$bin"
          go test -c -o "$bin/naive.test.exe" -ldflags=-checklinkname=0 -tags="$TAGS,with_naive_outbound,with_purego" \
            ./protocol/naive
          cp "$lib/libcronet.dll" "$bin/"
          cd "$bin"
          ./naive.test.exe -test.count=1 -test.v -test.timeout=10m -test.run 'TestNekoNaiveWindows'

      - name: libcore's packages on Windows
        working-directory: libcore
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" ./raysub ./rayapi ./minisign ./probe ./rayprobe ./dnsprobe ./stun ./nikoservice ./nikostore ./routetest ./ruleset ./nikofmt/... ./nikoconf/... ./nikosub/... ./nikoray/...

  # NikoService as Go (libcore/nikopb) is what shared/proto gives. The window's Dart from the same proto, and its theme
  # and icons from shared/tokens.json and shared/icons, are checked by arngory/niko-desktop's CI against the commit it
  # pins (shared/tool/gen_tokens.py and gen_icons.py --desktop)
  generated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: libcore/go.mod
          cache: false

      - name: Generated Go is current
        run: |
          python3 -m pip install -q grpcio-tools==1.85.1
          shared/tool/gen_proto_go.sh --check
