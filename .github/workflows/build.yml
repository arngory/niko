name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        default: ""
      require-signing:
        description: Fail when signing secrets are missing
        type: boolean
        default: false
      lint:
        description: Run Android lint (new issues beyond app/lint-baseline.xml fail the build)
        type: boolean
        default: false
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASS:
        required: false
      ALIAS_NAME:
        required: false
      ALIAS_PASS:
        required: false

env:
  NDK_VERSION: 28.2.13676358

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: LibCore cache key
        id: key
        run: |
          # SingBoxOptions.java is checked against the core by libcore's options_drift_test.go
          key=$(git ls-files -z buildScript libcore app/src/main/java/io/niko/SingBoxOptions.java \
            | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "key=libcore-${NDK_VERSION}-${key}" >> "$GITHUB_OUTPUT"

      - name: LibCore cache
        id: cache
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: ${{ steps.key.outputs.key }}

      - name: Install Go
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: libcore/go.mod
          cache-dependency-path: libcore/go.sum

      - name: Install NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Fetch sources
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core/init

      - name: Test
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          TAGS=with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_xhttp,with_awg,with_dnstt,with_masterdnsvpn,with_yggdrasil,badlinkname,tfogo_checklinkname0
          (cd ../sing-box && go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" ./boxapi ./route/rule && go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" -run "TestRealityChromeKeyShares|TestRealityClassicalFallbackShared|TestNekoUTLSCurvePreferences|TestNekoUTLSCurvePreferencesSTD" ./common/tls && go test -count=1 ./common/tls/chromehello && go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" -run TestNekoAWGIpcLines ./transport/wireguard && go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" -run TestNekoVLESSEncryptionSpec ./protocol/vless && go test -count=1 -run "TestNekoDNSTT|TestNekoDNSAuth" ./transport/dnstt && go test -count=1 ./common/udpdesync && go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" -run TestNekoMasterDNSVPN ./protocol/masterdnsvpn && go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" -run "TestNekoYggdrasil" ./protocol/yggdrasil && go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" -run TestNekoHysteria2HalfClose ./protocol/hysteria2 && go test -count=1 -run TestNekoFakeIP ./dns/transport/fakeip)
          (cd ../sing-box/third_party/sing-quic && go test -count=1 -run "TestDropTooLarge|TestReadPacketSkipsOversized" ./hysteria2)
          (cd ../sing-box/third_party/masterdnsvpn && go test -count=1 ./embed ./internal/compression ./internal/dnsparser ./internal/udpserver)
          (cd libcore && go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" . ./knock ./raysub ./rayapi ./probe ./rayprobe ./dnsprobe ./minisign)

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core/build

      - name: Upload LibCore
        uses: actions/upload-artifact@v4
        with:
          name: libcore
          path: app/libs/libcore.aar
          if-no-files-found: error

  slipstream:
    name: Native Build (slipstream client)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: slipstream cache key
        id: key
        run: |
          key=$(git ls-files -z buildScript/lib/slipstream | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "key=slipstream-${NDK_VERSION}-${key}" >> "$GITHUB_OUTPUT"

      - name: slipstream cache
        id: cache
        uses: actions/cache@v4
        with:
          path: app/executableSo
          key: ${{ steps.key.outputs.key }}

      - name: Install the NDK and ninja
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          # the SDK's download breaks off now and then ("Premature EOF"): three tries
          for try in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" > /dev/null && break
            test "$try" -lt 3 && sleep 10
          done
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib slipstream/build

      - name: Upload the slipstream client
        uses: actions/upload-artifact@v4
        with:
          name: slipstream
          path: app/executableSo
          if-no-files-found: error

  apk:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs: [libcore, slipstream]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Download LibCore
        uses: actions/download-artifact@v4
        with:
          name: libcore
          path: app/libs

      - name: Download the slipstream client
        uses: actions/download-artifact@v4
        with:
          name: slipstream
          path: app/executableSo

      - name: The slipstream client executable in each ABI
        run: |
          chmod 755 app/executableSo/*/libslipstream.so
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do test -x "app/executableSo/$abi/libslipstream.so"; done

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          REQUIRE_SIGNING: ${{ inputs.require-signing }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$REQUIRE_SIGNING" = "true" ]; then
              echo "::error::KEYSTORE_BASE64 secret is not set, refusing to publish unsigned APKs"
              exit 1
            fi
            echo "::warning::No signing key, APKs will be unsigned"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          # fail early with the aliases that do exist instead of a packaging error
          if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASS" \
              -alias "$(printf '%s' "$ALIAS_NAME" | xargs)" > /dev/null 2>&1; then
            echo "::error::alias from ALIAS_NAME not found in the keystore (or KEYSTORE_PASS is wrong). Aliases present:"
            keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASS" | grep -i 'entry' || true
            exit 1
          fi

      - name: Gradle build
        env:
          BUILD_PLUGIN: none
          # assets.sh asks the GitHub API for the latest geoip and geosite releases: unauthenticated, the shared
          # runner addresses run into the rate limit
          GITHUB_TOKEN: ${{ github.token }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          [ -n "$KEYSTORE_FILE" ] || unset KEYSTORE_PASS ALIAS_NAME ALIAS_PASS
          ./run init action gradle
          tasks="app:testOssReleaseUnitTest app:assembleOssRelease"
          [ "${{ inputs.lint }}" = "true" ] && tasks="$tasks app:lintOssRelease"
          ./gradlew --no-daemon $tasks

      - name: Upload lint report
        if: ${{ inputs.lint && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/lint.html
          if-no-files-found: ignore

      - name: Collect APKs
        run: |
          mkdir -p apks
          find app/build/outputs/apk/oss/release -name '*.apk' -exec cp {} apks/ \;
          (cd apks && sha256sum *.apk > SHA256SUMS)
          ls -la apks

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: apks
          if-no-files-found: error
