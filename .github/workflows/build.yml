name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        default: ""
      lint:
        description: Run Android lint (new issues beyond app/lint-baseline.xml fail the build)
        type: boolean
        default: false

# read-only: Gradle, its plugins and the dependencies run here; the caller can only narrow this
permissions:
  contents: read

env:
  NDK_VERSION: 28.2.13676358

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          # build code runs in these jobs: the token stays out of .git/config
          persist-credentials: false

      - name: LibCore cache key
        id: key
        run: |
          # SingBoxOptions.java is checked against the core by libcore's options_drift_test.go
          key=$(git ls-files -z buildScript libcore app/src/main/java/io/niko/SingBoxOptions.java \
            | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "key=libcore-${NDK_VERSION}-${key}" >> "$GITHUB_OUTPUT"

      - name: LibCore cache
        id: cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: app/libs/libcore.aar
          key: ${{ steps.key.outputs.key }}

      - name: Install Go
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: libcore/go.mod
          cache-dependency-path: libcore/go.sum

      - name: Install NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Fetch sources
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core/init

      - name: Test
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          TAGS=with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_xhttp,with_awg,with_dnstt,with_masterdnsvpn,with_yggdrasil,badlinkname,tfogo_checklinkname0
          (cd ../sing-box && go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" ./boxapi ./route/rule && go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" -run "TestRealityChromeKeyShares|TestRealityClassicalFallbackShared|TestNekoUTLSCurvePreferences|TestNekoUTLSCurvePreferencesSTD" ./common/tls && go test -count=1 ./common/tls/chromehello && go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" -run TestNekoAWGIpcLines ./transport/wireguard && go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" -run TestNekoVLESSEncryptionSpec ./protocol/vless && go test -count=1 -run "TestNekoDNSTT|TestNekoDNSAuth" ./transport/dnstt && go test -count=1 ./common/udpdesync && go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" -run TestNekoMasterDNSVPN ./protocol/masterdnsvpn && go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" -run "TestNekoYggdrasil" ./protocol/yggdrasil && go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" -run TestNekoHysteria2HalfClose ./protocol/hysteria2 && go test -count=1 -run TestNekoFakeIP ./dns/transport/fakeip && go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" -run TestNeko ./protocol/mieru ./protocol/trojan ./protocol/naive ./protocol/tun ./route && go test -count=1 ./common/nikoicmp && go test -count=1 -run TestNeko ./common/certificate && go test -count=1 ./cmd/internal/update_chromium_anchors && go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" ./protocol/knock)
          (cd ../sing-box/third_party/sing-quic && go test -count=1 -run "TestDropTooLarge|TestReadPacketSkipsOversized" ./hysteria2)
          (cd ../sing-box/third_party/masterdnsvpn && go test -count=1 ./embed ./internal/compression ./internal/dnsparser ./internal/udpserver)
          (cd libcore && go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" . ./raysub ./rayapi ./probe ./rayprobe ./dnsprobe ./minisign ./stun)

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core/build

      - name: Upload LibCore
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: libcore
          path: app/libs/libcore.aar
          if-no-files-found: error

  slipstream:
    name: Native Build (slipstream client)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          # build code runs in these jobs: the token stays out of .git/config
          persist-credentials: false

      - name: slipstream cache key
        id: key
        run: |
          key=$(git ls-files -z buildScript/lib/slipstream | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "key=slipstream-${NDK_VERSION}-${key}" >> "$GITHUB_OUTPUT"

      - name: slipstream cache
        id: cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: app/executableSo
          key: ${{ steps.key.outputs.key }}

      - name: Install the NDK and ninja
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          # the SDK's download breaks off now and then ("Premature EOF"): three tries
          for try in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" > /dev/null && break
            test "$try" -lt 3 && sleep 10
          done
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib slipstream/build

      - name: Upload the slipstream client
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: slipstream
          path: app/executableSo
          if-no-files-found: error

  apk:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs: [libcore, slipstream]
    # No key ever reaches this job: Gradle, its plugins and the dependencies run here, and the APKs come out
    # unsigned (Niko-<version>-<abi>-unsigned.apk). release.yml signs them in a job of its own under the environment
    # release (.github/scripts/release-sign.sh); the emulator jobs of ci.yml sign theirs with a throwaway key
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          # build code runs in these jobs: the token stays out of .git/config
          persist-credentials: false

      # the design system's colours in the app's resources are what shared/tokens.json gives (the same check
      # desktop.yml makes for the window's theme), and the icons what the SVGs of shared/icons give
      - name: Generated resources are current
        run: |
          python3 -I shared/tool/gen_tokens.py --check
          python3 -I shared/tool/gen_icons.py --check

      - name: Download LibCore
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: libcore
          path: app/libs

      - name: Download the slipstream client
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: slipstream
          path: app/executableSo

      - name: The slipstream client executable in each ABI
        run: |
          chmod 755 app/executableSo/*/libslipstream.so
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do test -x "app/executableSo/$abi/libslipstream.so"; done

      - name: Install Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Gradle build
        env:
          BUILD_PLUGIN: none
          # assets.sh asks the GitHub API for the latest geoip and geosite releases: unauthenticated, the shared
          # runner addresses run into the rate limit
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./run init action gradle
          tasks="app:testOssReleaseUnitTest app:assembleOssRelease"
          [ "${{ inputs.lint }}" = "true" ] && tasks="$tasks app:lintOssRelease"
          ./gradlew --no-daemon $tasks

      - name: Upload lint report
        if: ${{ inputs.lint && !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: lint-report
          path: app/build/lint.html
          if-no-files-found: ignore

      - name: Collect APKs
        run: |
          mkdir -p apks
          find app/build/outputs/apk/oss/release -name '*.apk' -exec cp {} apks/ \;
          (cd apks && sha256sum *.apk > SHA256SUMS)
          ls -la apks

      - name: Upload APKs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: APKs
          path: apks
          if-no-files-found: error
