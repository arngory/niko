name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        default: ""
      require-signing:
        description: Fail when signing secrets are missing; signs in the environment release (the owner approves)
        type: boolean
        default: false
      tag:
        description: Release tag, the trusted comment of the SHA256SUMS signature ("niko <tag>")
        type: string
        default: ""
      lint:
        description: Run Android lint (new issues beyond app/lint-baseline.xml fail the build)
        type: boolean
        default: false
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASS:
        required: false
      ALIAS_NAME:
        required: false
      ALIAS_PASS:
        required: false
      MINISIGN_SECRET_KEY:
        required: false

env:
  NDK_VERSION: 28.2.13676358

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}

      - name: LibCore cache key
        id: key
        run: |
          # SingBoxOptions.java is checked against the core by libcore's options_drift_test.go
          key=$(git ls-files -z buildScript libcore app/src/main/java/io/niko/SingBoxOptions.java \
            | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "key=libcore-${NDK_VERSION}-${key}" >> "$GITHUB_OUTPUT"

      - name: LibCore cache
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: app/libs/libcore.aar
          key: ${{ steps.key.outputs.key }}

      - name: Install Go
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: libcore/go.mod
          cache-dependency-path: libcore/go.sum

      - name: Install NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Fetch sources
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core/init

      - name: Test
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          TAGS=with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_xhttp,with_awg,with_dnstt,with_masterdnsvpn,with_yggdrasil,badlinkname,tfogo_checklinkname0
          (cd ../sing-box && go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" ./boxapi ./route/rule && go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" -run "TestRealityChromeKeyShares|TestRealityClassicalFallbackShared|TestNekoUTLSCurvePreferences|TestNekoUTLSCurvePreferencesSTD" ./common/tls && go test -count=1 ./common/tls/chromehello && go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" -run TestNekoAWGIpcLines ./transport/wireguard && go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" -run TestNekoVLESSEncryptionSpec ./protocol/vless && go test -count=1 -run "TestNekoDNSTT|TestNekoDNSAuth" ./transport/dnstt && go test -count=1 ./common/udpdesync && go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" -run TestNekoMasterDNSVPN ./protocol/masterdnsvpn && go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" -run "TestNekoYggdrasil" ./protocol/yggdrasil && go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" -run TestNekoHysteria2HalfClose ./protocol/hysteria2 && go test -count=1 -run TestNekoFakeIP ./dns/transport/fakeip && go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" -run TestNeko ./protocol/mieru ./protocol/trojan ./protocol/naive ./protocol/tun ./route && go test -count=1 ./common/nikoicmp && go test -count=1 -run TestNeko ./common/certificate && go test -count=1 ./cmd/internal/update_chromium_anchors && go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" ./protocol/knock)
          (cd ../sing-box/third_party/sing-quic && go test -count=1 -run "TestDropTooLarge|TestReadPacketSkipsOversized" ./hysteria2)
          (cd ../sing-box/third_party/masterdnsvpn && go test -count=1 ./embed ./internal/compression ./internal/dnsparser ./internal/udpserver)
          (cd libcore && go test -count=1 -ldflags=-checklinkname=0 -tags="$TAGS" . ./raysub ./rayapi ./probe ./rayprobe ./dnsprobe ./minisign ./stun)

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core/build

      - name: Upload LibCore
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: libcore
          path: app/libs/libcore.aar
          if-no-files-found: error

  slipstream:
    name: Native Build (slipstream client)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}

      - name: slipstream cache key
        id: key
        run: |
          key=$(git ls-files -z buildScript/lib/slipstream | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "key=slipstream-${NDK_VERSION}-${key}" >> "$GITHUB_OUTPUT"

      - name: slipstream cache
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: app/executableSo
          key: ${{ steps.key.outputs.key }}

      - name: Install the NDK and ninja
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          # the SDK's download breaks off now and then ("Premature EOF"): three tries
          for try in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" > /dev/null && break
            test "$try" -lt 3 && sleep 10
          done
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib slipstream/build

      - name: Upload the slipstream client
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slipstream
          path: app/executableSo
          if-no-files-found: error

  apk:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs: [libcore, slipstream]
    # The release keys (keystore, alias, minisign) are secrets of the environment release only: its one required
    # reviewer is the owner, and it admits v* tags and main. A release build waits here for that approval, once;
    # CI builds take no environment and no key, their APKs unsigned (the emulator jobs sign theirs with a
    # throwaway key)
    environment: ${{ inputs.require-signing && 'release' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}

      - name: Download LibCore
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: libcore
          path: app/libs

      - name: Download the slipstream client
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: slipstream
          path: app/executableSo

      - name: The slipstream client executable in each ABI
        run: |
          chmod 755 app/executableSo/*/libslipstream.so
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do test -x "app/executableSo/$abi/libslipstream.so"; done

      - name: Install Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          REQUIRE_SIGNING: ${{ inputs.require-signing }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$REQUIRE_SIGNING" = "true" ]; then
              echo "::error::KEYSTORE_BASE64 secret is not set, refusing to publish unsigned APKs"
              exit 1
            fi
            echo "::warning::No signing key, APKs will be unsigned"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          # fail early with the aliases that do exist instead of a packaging error
          if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASS" \
              -alias "$(printf '%s' "$ALIAS_NAME" | xargs)" > /dev/null 2>&1; then
            echo "::error::alias from ALIAS_NAME not found in the keystore (or KEYSTORE_PASS is wrong). Aliases present:"
            keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASS" | grep -i 'entry' || true
            exit 1
          fi

      - name: Gradle build
        env:
          BUILD_PLUGIN: none
          # assets.sh asks the GitHub API for the latest geoip and geosite releases: unauthenticated, the shared
          # runner addresses run into the rate limit
          GITHUB_TOKEN: ${{ github.token }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          [ -n "$KEYSTORE_FILE" ] || unset KEYSTORE_PASS ALIAS_NAME ALIAS_PASS
          ./run init action gradle
          tasks="app:testOssReleaseUnitTest app:assembleOssRelease"
          [ "${{ inputs.lint }}" = "true" ] && tasks="$tasks app:lintOssRelease"
          ./gradlew --no-daemon $tasks

      - name: Upload lint report
        if: ${{ inputs.lint && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-report
          path: app/build/lint.html
          if-no-files-found: ignore

      - name: Collect APKs
        run: |
          mkdir -p apks
          find app/build/outputs/apk/oss/release -name '*.apk' -exec cp {} apks/ \;
          (cd apks && sha256sum *.apk > SHA256SUMS)
          ls -la apks

      # SHA256SUMS signed with minisign (MINISIGN_SECRET_KEY, a key made with minisign -G -W) in this job, under the
      # same approval as the APK key: the GitHub build checks it with niko-update.pub, the trusted comment its tag,
      # before it installs an update (io.niko.utils.Updates; docs/RELEASE_SIGNING.md §5). Release publishes it
      # after checking it again
      - name: Sign SHA256SUMS
        if: ${{ inputs.require-signing }}
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          TAG: ${{ inputs.tag }}
        run: |
          [ -n "$TAG" ] || { echo "::error::a signed build needs the release tag"; exit 1; }
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            if [ -f niko-update.pub ]; then
              echo "::error::the app checks updates with niko-update.pub, and MINISIGN_SECRET_KEY is not set: it would refuse this release"
              exit 1
            fi
            echo "::warning::MINISIGN_SECRET_KEY is not set: SHA256SUMS goes out unsigned"
            exit 0
          fi
          sudo apt-get install -y -q minisign > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q minisign; }
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/niko-update.key"
          minisign -S -s "$RUNNER_TEMP/niko-update.key" -m apks/SHA256SUMS -t "niko $TAG" < /dev/null
          rm -f "$RUNNER_TEMP/niko-update.key"

      - name: Upload APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: APKs
          path: apks
          if-no-files-found: error
