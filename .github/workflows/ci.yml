name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      lint: true
    secrets: inherit

  # the release APK on an emulator: it starts, survives configuration changes and leaks no activity
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: APKs
          path: apks
      - name: A throwaway signature for an unsigned APK
        # without the signing secrets (forks, pull requests from them) the release APK is unsigned and does not
        # install: a key for this emulator only, never the release key
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          apk=$(ls apks/*-x86_64.apk | head -1)
          if ! "$bt/apksigner" verify "$apk" > /dev/null 2>&1; then
            keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -storepass smokekey -keypass smokekey -alias smoke \
              -keyalg RSA -keysize 2048 -validity 1 -dname CN=smoke -noprompt
            "$bt/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
            "$bt/apksigner" sign --ks "$RUNNER_TEMP/smoke.jks" --ks-pass pass:smokekey --out "$apk" "$RUNNER_TEMP/aligned.apk"
            echo "the APK was unsigned: signed with a throwaway key for the emulator"
          fi
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start, rotate, leave
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/smoke.sh apks
