name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# read-only token: nothing here writes to the repository
permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      lint: true
    secrets: inherit

  # the release APK on an emulator: it starts, survives configuration changes and leaks no activity
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: APKs
          path: apks
      - name: A throwaway signature for an unsigned APK
        # without the signing secrets (forks, pull requests from them) the release APK is unsigned and does not
        # install: a key for this emulator only, never the release key
        run: bash .github/scripts/emulator-sign.sh apks
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start, rotate, leave
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/smoke.sh apks

  # the app end to end (e2e.sh) on an emulator, against a CI node under rayd serve -supervise as raycontrol-interop's,
  # behind its perimeter (rayspa: SPA, the rotating UDP ports the app's Hysteria2 takes): the invite opened as a link
  # registers the device, the subscription brings the node's Hysteria2 profile, the VPN goes up through it, and a
  # request of the emulator's reaches the runner's HTTP server from the node's address
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: APKs
          path: apks
      - name: A throwaway signature for an unsigned APK
        run: bash .github/scripts/emulator-sign.sh apks

      - name: Fetch raycontrol
        run: |
          . .github/raycontrol.env
          git clone --filter=blob:none "$REPOSITORY_RAYCONTROL" raycontrol
          git -C raycontrol checkout -q "$COMMIT_RAYCONTROL"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: raycontrol/go.mod
          cache: false
      - name: Build rayd, rayctl and rayspa; niko-server
        run: |
          mkdir -p /tmp/rcbin
          (cd raycontrol && CGO_ENABLED=0 go build -o /tmp/rcbin/rayd ./cmd/rayd &&
            CGO_ENABLED=0 go build -o /tmp/rcbin/rayctl ./cmd/rayctl &&
            CGO_ENABLED=0 go build -o /tmp/rcbin/rayspa ./cmd/rayspa)
          . .github/niko-server.env
          curl -fsSL --retry 3 -o /tmp/rcbin/niko-server "$NIKO_SERVER_RELEASES/download/$NIKO_SERVER_TAG/niko-server-linux-amd64"
          echo "$NIKO_SERVER_SHA256_AMD64  /tmp/rcbin/niko-server" | sha256sum -c -
          chmod +x /tmp/rcbin/niko-server

      - name: The node under rayd serve -supervise behind its perimeter; the runner's HTTP server
        run: |
          # raycontrol-interop's addresses: the runner 203.0.113.1, the node .2
          docker network create --subnet 203.0.113.0/24 --gateway 203.0.113.1 rc-net > /dev/null
          docker run -d --name rc-node --network rc-net --ip 203.0.113.2 --cap-add NET_ADMIN -v /tmp/rcbin:/opt/rc:ro \
            debian:13 sleep infinity > /dev/null
          x() { docker exec rc-node "$@"; }
          x sh -c 'apt-get update -qq > /dev/null && apt-get install -y -qq nftables > /dev/null'
          x mkdir -p /var/lib/raycontrol /run/raycontrol
          x /opt/rc/rayd init -host 203.0.113.2 > /dev/null
          # no Xray: its services are not used here (rayd says so and starts the others).
          # NIKO_SERVER_UNSAFE_ANY_DESTINATION: the tunnel may reach the runner on this private network; never on a
          # real node
          x sh -c 'NIKO_SERVER_UNSAFE_ANY_DESTINATION=1 nohup /opt/rc/rayd serve -supervise \
            -niko-server /opt/rc/niko-server -acme-directory "" > /var/log/rayd.log 2>&1 &'
          for i in $(seq 50); do x test -S /run/raycontrol/rayd.sock && break; sleep 0.2; done
          # the remote API the app registers through, and one service for its subscription
          x /opt/rc/rayctl service add api api > /dev/null
          x /opt/rc/rayctl service add hy2-obfs hy2o > /dev/null
          x /opt/rc/rayctl user add alice -services hy2o > /dev/null
          x /opt/rc/rayctl device invite alice phone -o /root/phone.invite > /dev/null
          x cat /root/phone.invite > /tmp/phone.invite
          # raycontrol v0.14 gives the short rcinv2 by default (RCINV2:, upper case for its QR code)
          grep -qE '^(rcinv1:|RCINV2:)' /tmp/phone.invite || { echo "not an invite: $(head -c 7 /tmp/phone.invite)"; exit 1; }
          for i in $(seq 150); do x test -S /run/niko/hy2o/stats.sock && break; sleep 0.2; done
          x test -S /run/niko/hy2o/stats.sock || { echo "no Hysteria2"; x tail -n 80 /var/log/rayd.log; exit 1; }
          # the perimeter as a node runs it: closed but to SPA, the services' rotating UDP ports to their own
          docker exec -d rc-node sh -c '/opt/rc/rayspa run > /var/log/rayspa.log 2>&1'
          for i in $(seq 150); do x grep -q 'snapshot applied' /var/log/rayspa.log 2>/dev/null && break; sleep 0.2; done
          x grep -q 'snapshot applied' /var/log/rayspa.log || { x cat /var/log/rayspa.log; exit 1; }
          # the token the server gives; its log says the address each request came from
          mkdir -p /tmp/www
          head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n' > /tmp/www/e2e
          nohup python3 -u -m http.server 8080 --bind 203.0.113.1 --directory /tmp/www > /tmp/www.log 2>&1 &
          for i in $(seq 50); do curl -fs http://203.0.113.1:8080/e2e > /dev/null && break; sleep 0.2; done
          curl -fsS http://203.0.113.1:8080/e2e > /dev/null

      - name: A slipstream server on the runner, its VLESS stage behind it
        run: |
          # the server as raycontrol ships it (its release, the fork's test key, ALPN picoquic_sample): the app's row
          # through the client (mapping ports, the process, the rules above the DNS hijack), no node needed; the
          # bundled client's fork at the app's pin for the runner's own check
          . buildScript/lib/slipstream/env.sh
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq cmake ninja-build pkg-config libssl-dev meson > /dev/null
          git init -q /tmp/slip && git -C /tmp/slip remote add origin "$REPOSITORY_SLIPSTREAM"
          git -C /tmp/slip fetch -q --depth 1 origin "$COMMIT_SLIPSTREAM"
          git -C /tmp/slip checkout -q FETCH_HEAD && git -C /tmp/slip submodule update -q --init --recursive
          (cd /tmp/slip && meson setup --buildtype=release --warnlevel=0 build > /dev/null &&
            ninja -C build slipstream-client > /dev/null)
          . .github/slipstream-server.env
          curl -fsSL --retry 3 -o /tmp/slip/slipstream-server \
            "$SLIPSTREAM_SERVER_RELEASES/download/$SLIPSTREAM_SERVER_TAG/slipstream-server-linux-amd64"
          echo "$SLIPSTREAM_SERVER_SHA256_AMD64  /tmp/slip/slipstream-server" | sha256sum -c -
          chmod +x /tmp/slip/slipstream-server
          # the VLESS stage the server forwards to, in a box of its own: through the tunnel the runner's server sees
          # 203.0.113.3. Xray's freedom blocks private and reserved addresses for a VLESS inbound by default
          # (finalRules), TEST-NET-3 among them: the test network is let through
          . .github/xray-interop.env
          git clone -q --filter=blob:none "$REPOSITORY_XRAY" /tmp/xray && git -C /tmp/xray checkout -q "$COMMIT_XRAY"
          mkdir -p /tmp/slipbin
          (cd /tmp/xray && CGO_ENABLED=0 GOTOOLCHAIN=auto go build -o /tmp/slipbin/xray ./main)
          uuid=$(cat /proc/sys/kernel/random/uuid)
          # the same Xray, a Trojan inbound under TLS beside it: its certificate from a root of this stand's own, which
          # the emulator gets as a root its user installed (e2e.sh: the root store setting)
          mkdir -p /tmp/slipbin/roots
          (cd /tmp/slipbin/roots &&
            openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout root.key -out root.pem -days 2 \
              -subj "/CN=niko e2e root" -addext "basicConstraints=critical,CA:TRUE" \
              -addext "keyUsage=critical,keyCertSign,cRLSign" 2> /dev/null &&
            openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout leaf.key -out leaf.csr \
              -subj "/CN=roots.e2e.test" 2> /dev/null &&
            printf 'subjectAltName=DNS:roots.e2e.test\nextendedKeyUsage=serverAuth\nbasicConstraints=CA:FALSE\n' > leaf.ext &&
            openssl x509 -req -in leaf.csr -CA root.pem -CAkey root.key -CAcreateserial -days 2 -extfile leaf.ext \
              -out leaf.pem 2> /dev/null &&
            openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout naive.key -out naive.csr \
              -subj "/CN=naive.test" 2> /dev/null &&
            printf 'subjectAltName=DNS:naive.test\nextendedKeyUsage=serverAuth\nbasicConstraints=CA:FALSE\n' > naive.ext &&
            openssl x509 -req -in naive.csr -CA root.pem -CAkey root.key -CAcreateserial -days 2 -extfile naive.ext \
              -out naive.pem 2> /dev/null &&
            chmod 644 leaf.key naive.key && rm root.key)
          trojan=$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')
          printf '%s' '{"log": {"loglevel": "info"}, "inbounds": [{"listen": "0.0.0.0", "port": 10443, "protocol": "vless",
            "settings": {"clients": [{"id": "UUID"}], "decryption": "none"}}, {"listen": "0.0.0.0", "port": 10444,
            "protocol": "trojan", "settings": {"clients": [{"password": "TROJAN"}]}, "streamSettings": {"network": "tcp",
            "security": "tls", "tlsSettings": {"certificates": [{"certificateFile": "/opt/slip/roots/leaf.pem",
            "keyFile": "/opt/slip/roots/leaf.key"}]}}}], "outbounds": [{"protocol": "freedom",
            "settings": {"finalRules": [{"action": "allow", "ip": ["203.0.113.0/24"]}]}}]}' \
            | sed "s/UUID/$uuid/; s/TROJAN/$trojan/" > /tmp/slipbin/xray.json
          echo "trojan://$trojan@203.0.113.3:10444?security=tls&sni=roots.e2e.test&type=tcp#e2e-roots" > /tmp/roots.link
          docker run -d --name rc-slip --network rc-net --ip 203.0.113.3 -v /tmp/slipbin:/opt/slip:ro debian:13 \
            /opt/slip/xray run -c /opt/slip/xray.json > /dev/null
          nohup /tmp/slip/slipstream-server --dns-listen-address=203.0.113.1 --dns-listen-port=5353 \
            --target-address=203.0.113.3:10443 --domain=tunnel.test --alpn=picoquic_sample \
            --cert=/tmp/slip/certs/cert.pem --key=/tmp/slip/certs/key.pem > /tmp/slip.log 2>&1 &
          pin=$(openssl x509 -in /tmp/slip/certs/cert.pem -pubkey -noout | openssl pkey -pubin -outform der \
            | openssl dgst -sha256 -binary | basenc --base64url | tr -d '=')
          python3 -I -c '
          import sys, urllib.parse
          uuid, pin = sys.argv[1:]
          query = urllib.parse.urlencode({"encryption": "none", "security": "none", "type": "tcp",
              "niko-dns": "slipstream;203.0.113.1:5353;tunnel.test;1",
              "niko-slip": "v1;%s;picoquic_sample;test.example.com" % pin}, quote_via=urllib.parse.quote)
          print("vless://%s@203.0.113.3:10443?%s#e2e-slipstream" % (uuid, query))
          ' "$uuid" "$pin" > /tmp/slip.link
          grep -q '^vless://' /tmp/slip.link
          sleep 1
          docker ps --filter name=rc-slip --format '{{.Status}}' | grep -q Up || { docker logs rc-slip; exit 1; }
          # the TLS stage answers with a chain to the stand's root, and to none of the runner's own
          openssl s_client -connect 203.0.113.3:10444 -servername roots.e2e.test -CAfile /tmp/slipbin/roots/root.pem \
            -verify_return_error < /dev/null 2>&1 | grep -q 'Verify return code: 0 (ok)' ||
            { echo "::error::the TLS stage does not answer with a chain to the stand's root"; docker logs rc-slip; exit 1; }
          if openssl s_client -connect 203.0.113.3:10444 -servername roots.e2e.test -verify_return_error \
            < /dev/null 2>&1 | grep -q 'Verify return code: 0 (ok)'; then
            echo "::error::the TLS stage's chain verifies against the runner's own roots"; exit 1
          fi
          pgrep -f slipstream-server > /dev/null || { cat /tmp/slip.log; exit 1; }
          # the same chain from the runner, before the emulator: the fork's client, Xray as the VLESS client, a request
          # that has to reach the runner's server from the stage
          nohup /tmp/slip/build/slipstream-client --tcp-listen-port=7700 --resolver=203.0.113.1:5353 --domain=tunnel.test \
            --pin="$pin" > /tmp/slip-client.log 2>&1 &
          printf '%s' '{"log": {"loglevel": "warning"}, "inbounds": [{"listen": "127.0.0.1", "port": 1080, "protocol": "socks"}],
            "outbounds": [{"protocol": "vless", "settings": {"vnext": [{"address": "127.0.0.1", "port": 7700,
            "users": [{"id": "UUID", "encryption": "none"}]}]}}]}' | sed "s/UUID/$uuid/" > /tmp/slip-vless.json
          nohup /tmp/slipbin/xray run -c /tmp/slip-vless.json > /tmp/slip-vless.log 2>&1 &
          for i in $(seq 30); do
            curl -fsS --max-time 20 --socks5 127.0.0.1:1080 "http://203.0.113.1:8080/e2e?runner-slip-$i" > /dev/null &&
              grep -q '^203.0.113.3 .*runner-slip' /tmp/www.log && break
            sleep 2
          done
          grep '^203.0.113.3 .*runner-slip' /tmp/www.log || {
            echo "::error::the slipstream chain does not carry a request from the runner"
            cat /tmp/slip-client.log /tmp/slip-vless.log; docker logs rc-slip 2>&1 | tail -n 40; exit 1; }
          pkill -f 'slipstream-client --tcp-listen-port=7700' || true
          pkill -f 'slip-vless.json' || true

      - name: A naive server under the stand's root
        run: |
          # rayd naive behind the node's front, as raycontrol-interop's naive job stands it, in a box of its own
          # (203.0.113.5): what the emulator sends through it reaches the runner's server from that address. Its
          # certificate is from the stand's root (the step above), which the emulator gets as a root its user
          # installed: the app's naive is Chromium of the library the APK carries, and nothing else runs it on Android
          mkdir -p /tmp/naivestage
          pw=$(openssl rand -hex 16)
          printf '["%s"]' "$(printf %s "$pw" | sha256sum | cut -d' ' -f1)" > /tmp/naivestage/users.json
          jq -n '{schema: 1, role: "front", log: {level: "info"},
            tcp: {listen: ["0.0.0.0:18446"], routes: [{sni: ["naive.test"], backend: "naive"}]},
            udp: {listen: ["0.0.0.0:18446"], routes: [{sni: ["naive.test"], backend: "naive-quic"}]},
            backends: {naive: {socket: "/run/naive/fd.sock", mode: "fd", uid: 0},
                       "naive-quic": {socket: "/run/naive/packet.sock", mode: "packet", uid: 0}}}' > /tmp/naivestage/front.json
          docker run -d --name rc-naive --network rc-net --ip 203.0.113.5 -v /tmp/rcbin:/opt/rc:ro \
            -v /tmp/slipbin/roots:/opt/roots:ro -v /tmp/naivestage:/opt/stage:ro debian:13 sleep infinity > /dev/null
          n() { docker exec rc-naive "$@"; }
          n sh -c 'mkdir -p /run/naive && chmod 0710 /run/naive'
          docker exec -d rc-naive sh -c '/opt/rc/rayd naive -users /opt/stage/users.json -chain /opt/roots/naive.pem \
            -key /opt/roots/naive.key -front-uid 0 -socket /run/naive/fd.sock -quic-socket /run/naive/packet.sock \
            > /var/log/naive.log 2>&1'
          for i in $(seq 50); do n test -S /run/naive/fd.sock && n test -S /run/naive/packet.sock && break; sleep 0.2; done
          n test -S /run/naive/fd.sock && n test -S /run/naive/packet.sock ||
            { echo "::error::rayd naive did not start"; n cat /var/log/naive.log; exit 1; }
          n /opt/rc/niko-server check -c /opt/stage/front.json --json
          docker exec -d rc-naive sh -c '/opt/rc/niko-server front -c /opt/stage/front.json > /var/log/front.log 2>&1'
          sleep 1
          # the stage answers under its name with a chain to the stand's root
          openssl s_client -connect 203.0.113.5:18446 -servername naive.test -CAfile /tmp/slipbin/roots/root.pem \
            -verify_return_error < /dev/null 2>&1 | grep -q 'Verify return code: 0 (ok)' ||
            { echo "::error::the naive stage does not answer with a chain to the stand's root"
              n cat /var/log/front.log /var/log/naive.log; exit 1; }
          # the profiles: one that names no root (the phone's stores are all it has), and two that carry the root, over
          # HTTP/2 and over QUIC
          python3 -I -c '
          import sys, urllib.parse
          pw, root, out = sys.argv[1], open(sys.argv[2]).read(), sys.argv[3]
          def link(scheme, name, **more):
              query = urllib.parse.urlencode(dict({"sni": "naive.test"}, **more), quote_via=urllib.parse.quote)
              return "naive+%s://niko:%s@203.0.113.5:18446?%s#%s" % (scheme, pw, query, name)
          open(out + "/h2.link", "w").write(link("https", "e2e-naive"))
          open(out + "/quic.link", "w").write(link("quic", "e2e-naive-quic-bare"))
          # a site of a public CA that is no naive server: the chain must pass, the CONNECT must not
          open(out + "/public.link", "w").write("naive+https://niko:%s@www.gstatic.com:443#e2e-naive-public" % pw)
          open(out + "/h2-cert.link", "w").write(link("https", "e2e-naive-cert", cert=root))
          open(out + "/quic-cert.link", "w").write(link("quic", "e2e-naive-quic", cert=root))
          # and one to a port on the runner where only the first TLS record is read (e2e.sh, hello.py)
          open(out + "/hello.link", "w").write(link("https", "e2e-naive-hello").replace("203.0.113.5:18446", "203.0.113.1:18447"))
          ' "$pw" /tmp/slipbin/roots/root.pem /tmp/naivestage
          grep -q '^naive+quic://' /tmp/naivestage/quic-cert.link
          grep -q '@203.0.113.1:18447?' /tmp/naivestage/hello.link
          # the ClientHello captured from Chrome, as the core at the app's pin keeps it (kept current by fingerprint.yml)
          . buildScript/lib/core/get_source_env.sh
          git clone -q --filter=blob:none --no-checkout "$REPOSITORY_SING_BOX" /tmp/core-hello
          git -C /tmp/core-hello show "$COMMIT_SING_BOX:common/tls/chromehello/hello.hex" > /tmp/naivestage/chrome-hello.hex
          git -C /tmp/core-hello show "$COMMIT_SING_BOX:common/tls/chromehello/SOURCE" > /tmp/naivestage/chrome-hello.source
          test -s /tmp/naivestage/chrome-hello.hex

      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The invite, the VPN, a request through it
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/e2e.sh apks /tmp/phone.invite /tmp/www.log /tmp/www/e2e /tmp/e2e /tmp/slip.link /tmp/slipbin/roots/root.pem /tmp/roots.link /tmp/naivestage

      - name: What the emulator showed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e
          path: /tmp/e2e
          if-no-files-found: ignore
          retention-days: 7
      - name: Logs
        if: always()
        run: |
          docker exec rc-node tail -n 120 /var/log/rayd.log || true
          echo "--- the perimeter"; docker exec rc-node tail -n 60 /var/log/rayspa.log || true
          docker exec rc-node nft list ruleset 2>/dev/null | grep -cE 'dnat|redirect' | sed 's/^/  nat rules: /' || true
          echo "--- the runner's server"; cat /tmp/www.log || true
          echo "--- slipstream's server"; tail -n 80 /tmp/slip.log || true
          echo "--- its VLESS stage"; docker logs rc-slip 2>&1 | grep -v 'accepted udp:\|gstatic\|googleapis\|google.com' | tail -n 120 || true
          echo "--- the naive stage"; docker exec rc-naive sh -c 'tail -n 40 /var/log/front.log; tail -n 60 /var/log/naive.log' 2>&1 || true
          docker rm -f rc-node rc-slip rc-naive > /dev/null 2>&1 || true
