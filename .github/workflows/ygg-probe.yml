name: Yggdrasil probe

# Live check of the core's Yggdrasil endpoint: peers with the public peers and
# opens services inside the network. Runs when this file changes or by hand.
# The services and the peers are other people's: yggstack (the Yggdrasil
# project's own node with a SOCKS proxy) runs beside the core with the same
# peers, and the check fails only when it reaches the services and the core
# does not. When neither does, the network is down for both: a warning. A
# yggstack that is not running fails the check; one with no peer up where the
# core has some is no reference, and fails it when the core falls short.
on:
  push:
    paths: [".github/workflows/ygg-probe.yml", "buildScript/lib/core/get_source_env.sh"]
  workflow_dispatch:

permissions:
  contents: read

# one run per branch for pushes: a newer push cancels the push run it supersedes (one full run per commit); a
# manual or scheduled run (another version, other inputs) has a group of its own and is never cancelled by them
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: true

# Go modules: the proxy first, and the module's own repository when the proxy fails (its downloads were cut mid-stream
# three times on 2026-11-24). What is fetched either way is held by go.sum and the checksum database
env:
  GOPROXY: "https://proxy.golang.org|direct"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # yggstack 1.0.6 (yggdrasil-go v0.5.15, as the core's fork)
      REPOSITORY_YGGSTACK: https://github.com/yggdrasil-network/yggstack
      COMMIT_YGGSTACK: 91fc38063dd7044c1c18318d8907bcc68e95db0d
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Fetch core
        run: |
          . buildScript/lib/core/get_source_env.sh
          git clone --filter=blob:none "$REPOSITORY_SING_BOX" core
          git -C core checkout -q "$COMMIT_SING_BOX"
          git clone --filter=blob:none "$REPOSITORY_YGGSTACK" yggstack
          git -C yggstack checkout -q "$COMMIT_YGGSTACK"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: core/go.mod
          cache: false

      - name: Build core
        working-directory: core
        run: go build -o /tmp/sing-box -ldflags=-checklinkname=0 -tags=with_yggdrasil,with_gvisor,badlinkname,tfogo_checklinkname0 ./cmd/sing-box

      - name: Build yggstack
        working-directory: yggstack
        run: CGO_ENABLED=0 go build -o /tmp/yggstack -trimpath ./cmd/yggstack && /tmp/yggstack -version | head -2

      - name: Public peers
        run: |
          git clone --depth 1 https://github.com/yggdrasil-network/public-peers /tmp/peers
          grep -rhoE '(tls|tcp|quic|ws|wss)://[^` <>)]+' /tmp/peers --include='*.md' --exclude=README.md \
            | grep -E '^[a-z]+://[^/]+:[0-9]+(/|\?|$)' | sort -u > /tmp/peers.txt
          wc -l < /tmp/peers.txt
          cut -d: -f1 /tmp/peers.txt | sort | uniq -c

      - name: Run node
        run: |
          jq -n --rawfile peers /tmp/peers.txt --arg key "$(openssl rand -hex 32)" '{
            log: {level: "info", timestamp: true},
            inbounds: [{type: "mixed", listen: "127.0.0.1", listen_port: 14080}],
            endpoints: [{type: "yggdrasil", tag: "ygg", private_key: $key, node_info_privacy: true,
              peers: ($peers | split("\n") | map(select(length > 0)))}],
            outbounds: [{type: "direct", tag: "direct"}],
            route: {rules: [{ip_cidr: ["200::/7"], outbound: "ygg"}], final: "direct"}
          }' > /tmp/node.json
          /tmp/sing-box check -c /tmp/node.json
          nohup /tmp/sing-box run -c /tmp/node.json > /tmp/node.log 2>&1 &
          # the reference: the same peers, a key of its own, no multicast, SOCKS on 14081
          /tmp/yggstack -genconf -json | jq --rawfile peers /tmp/peers.txt '.Peers = ($peers | split("\n") |
            map(select(length > 0))) | .MulticastInterfaces = [] | .NodeInfoPrivacy = true' > /tmp/yggstack.json
          nohup /tmp/yggstack -useconffile /tmp/yggstack.json -socks 127.0.0.1:14081 > /tmp/yggstack.log 2>&1 &
          sleep 45
          echo "connected peers: $(grep -c 'Connected outbound' /tmp/node.log)"
          grep -oE 'Connected outbound: [^,]+' /tmp/node.log | sed 's/.*@//' | sort -u > /tmp/up.txt
          cut -d: -f1 /tmp/up.txt | sort | uniq -c
          cat /tmp/up.txt
          echo "address:"
          grep -m1 'Yggdrasil address' /tmp/node.log || true

      # live services of other people: one of them may be down, so the step wants most of them, not all. Each is
      # asked through the core (14080) and through yggstack (14081) at once, so both see the network as it is then
      - name: Services inside the network
        run: |
          services=("IP checker|http://[200:56bd:a9e9:c1fa:8f99:1d3c:3c84:6507]/"
                    "Project homepage|http://[300:8101:e046:d91e::5]/"
                    "Web directory|http://[21e:a51c:885b:7db0:166e:927:98cd:d186]/"
                    "Search|http://[200:b48d:469e:c7c7:3e13:c41d:ba4d:d2b8]/"
                    "Map|http://[227:bc24:9a82:e290:7f4a:f992:2ef6:5b34]/")
          ask() { curl -sS -m 30 -o "$3" -w '%{http_code} %{time_total}s' -x "socks5h://127.0.0.1:$1" "$2" 2>&1; }
          ok=0 ref=0
          for s in "${services[@]}"; do
            name=${s%%|*} url=${s#*|}
            rm -f /tmp/body /tmp/body.ref
            ask 14080 "$url" /tmp/body > /tmp/out & a=$!
            ask 14081 "$url" /tmp/body.ref > /tmp/out.ref & b=$!
            wait $a && ok=$((ok + 1)); wait $b && ref=$((ref + 1))
            title=$(grep -oiE '<title>[^<]*' /tmp/body 2>/dev/null | head -1 | cut -c8-80)
            echo "$name | $url | core: $(head -c 120 /tmp/out) | yggstack: $(head -c 120 /tmp/out.ref) | $title"
          done
          echo "answered: $ok of 5 through the core, $ref of 5 through yggstack"
          # the peers up now: each key@address by its last Connected or Disconnected line
          up() { awk '/(Connected|Disconnected) outbound: /{ match($0, /outbound: [^,]+/); p = substr($0, RSTART + 10, RLENGTH - 10)
                       up[p] = ($0 ~ /Disconnected outbound: /) ? 0 : 1 } END { n = 0; for (p in up) n += up[p]; print n }' "$1"; }
          core_peers=$(up /tmp/node.log) ref_peers=$(up /tmp/yggstack.log)
          echo "peers up: $core_peers through the core, $ref_peers through yggstack"
          if ! pgrep -x yggstack > /dev/null; then echo "the reference is not running"; exit 1; fi
          # the reference counts only with peers up: a core with none where yggstack has some fails whatever the
          # services say, yggstack with none where the core has some is no reference, neither with any is the network
          if [ "$core_peers" -eq 0 ] && [ "$ref_peers" -gt 0 ]; then echo "the core has no peer up"; exit 1; fi
          if [ "$ok" -ge 3 ]; then exit 0; fi
          if [ "$core_peers" -eq 0 ] && [ "$ref_peers" -eq 0 ]; then
            echo "::warning::no public peer is up for the core or yggstack: the runner's network, not the core"
            exit 0
          fi
          if [ "$ref_peers" -eq 0 ]; then echo "the reference has no peer up"; exit 1; fi
          if [ "$ref" -lt 3 ]; then
            echo "::warning::the services do not answer yggstack either ($ref of 5): the network, not the core"
            exit 0
          fi
          echo "the core reaches $ok of 5 where yggstack reaches $ref"; exit 1

      - name: Node log
        if: always()
        run: |
          grep -E 'Connected|ERROR|WARN' /tmp/node.log | cut -c1-200 | head -150 || true
          echo "yggstack: $(grep -c 'Connected outbound' /tmp/yggstack.log) peers connected"
          grep -iE 'error|panic' /tmp/yggstack.log | cut -c1-200 | head -20 || true
          pkill -x sing-box || true
          pkill -x yggstack || true
