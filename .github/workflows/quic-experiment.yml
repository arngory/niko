# An experiment, run by hand: QUIC (HTTP/3) against TCP (HTTP/2) through the profiles that carry UDP inside a TCP
# stream (VLESS REALITY with Vision and XUDP, naive with UDP over TCP v2), and straight, when the path between the
# client and the node loses packets and is slow. It decides what "QUIC → TCP on stream profiles" (the app's
# refuseQuicOverStreams, off by default) is worth. Xray's own VLESS client refuses UDP/443 under Vision for this
# reason (flow xtls-rprx-vision-udp443 lets it through); sing-box carries it.
#
# One runner: the core's server and client, and quicbench (.github/experiments/quicbench) serving HTTP/2 and HTTP/3.
# netem on lo delays, drops and rate-limits only the "internet" leg: the tunnels' server ports and the straight
# server's port. lo gets a 1500-byte MTU and no segmentation offloads, so netem sees real packets, not 64 KB batches.
name: QUIC experiment

on:
  workflow_dispatch:
    inputs:
      losses:
        description: "Packet loss of the path, % (space-separated)"
        default: "0 1 3"
      delay:
        description: "One-way delay of the path, ms (the round trip is twice it)"
        default: "40"
      rate:
        description: "The path's rate (netem)"
        default: "50mbit"
      congestion:
        description: "TCP congestion control (space-separated; raycontrol nodes run bbr)"
        default: "bbr cubic"
      reps:
        description: "Repetitions per row (the row shows medians)"
        default: "3"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: .github/experiments/quicbench/go.mod
          cache: false

      - name: quicbench
        working-directory: .github/experiments/quicbench
        run: go build -o /tmp/quicbench .

      - name: The core (server and client; naive through cronet)
        run: |
          . buildScript/lib/core/get_source_env.sh
          git clone --filter=blob:none "$REPOSITORY_SING_BOX" /tmp/sing-box-src
          git -C /tmp/sing-box-src checkout -q "$COMMIT_SING_BOX"
          sudo apt-get install -y -qq lld > /dev/null
          cd /tmp/sing-box-src
          CC=clang CXX=clang++ CGO_LDFLAGS=-fuse-ld=lld CGO_ENABLED=1 GOTOOLCHAIN=auto go build -o /tmp/sing-box \
            -ldflags=-checklinkname=0 -tags=with_utls,with_naive_outbound,badlinkname,tfogo_checklinkname0 ./cmd/sing-box
          /tmp/sing-box version | head -1

      - name: Servers and the client
        run: |
          mkdir -p /tmp/qb && cd /tmp/qb
          # quic-go sends with UDP GSO where it can: netem would see one batch as one packet
          export QUIC_GO_DISABLE_GSO=true
          # 19001: behind the tunnels (and REALITY's handshake target); 19002: straight, on the lossy path
          nohup /tmp/quicbench serve -listen 127.0.0.1:19001,127.0.0.1:19002 -cert cert.pem -key key.pem > serve.log 2>&1 &
          for i in $(seq 50); do grep -q ready serve.log 2>/dev/null && break; sleep 0.2; done
          grep -q ready serve.log
          uuid=$(/tmp/sing-box generate uuid)
          keys=$(/tmp/sing-box generate reality-keypair)
          priv=$(echo "$keys" | awk '/PrivateKey/ {print $2}')
          pub=$(echo "$keys" | awk '/PublicKey/ {print $2}')
          pw=$(openssl rand -hex 16)
          jq -n --arg uuid "$uuid" --arg priv "$priv" --arg pw "$pw" '{log: {level: "warn"},
            inbounds: [
              {type: "vless", tag: "reality", listen: "127.0.0.1", listen_port: 18443,
               users: [{uuid: $uuid, flow: "xtls-rprx-vision"}],
               tls: {enabled: true, server_name: "bench.test",
                     reality: {enabled: true, handshake: {server: "127.0.0.1", server_port: 19001},
                               private_key: $priv, short_id: ["0123456789abcdef"]}}},
              {type: "naive", tag: "naive", listen: "127.0.0.1", listen_port: 18444,
               users: [{username: "niko", password: $pw}],
               tls: {enabled: true, server_name: "bench.test", certificate_path: "/tmp/qb/cert.pem", key_path: "/tmp/qb/key.pem"}}],
            outbounds: [{type: "direct", tag: "direct"}]}' > server.json
          # the client as the app builds these profiles: Vision with XUDP, naive with udp_over_tcp (uot=2); a direct
          # inbound per tunnel stands for the app's TUN and leads to the bench server behind the node
          jq -n --arg uuid "$uuid" --arg pub "$pub" --arg pw "$pw" '{log: {level: "warn"},
            inbounds: [
              {type: "direct", tag: "to-reality", listen: "127.0.0.1", listen_port: 20001, override_address: "127.0.0.1", override_port: 19001},
              {type: "direct", tag: "to-naive", listen: "127.0.0.1", listen_port: 20002, override_address: "127.0.0.1", override_port: 19001}],
            outbounds: [
              {type: "vless", tag: "reality", server: "127.0.0.1", server_port: 18443, uuid: $uuid,
               flow: "xtls-rprx-vision", packet_encoding: "xudp",
               tls: {enabled: true, server_name: "bench.test", utls: {enabled: true, fingerprint: "chrome"},
                     reality: {enabled: true, public_key: $pub, short_id: "0123456789abcdef"}}},
              {type: "naive", tag: "naive", server: "127.0.0.1", server_port: 18444, username: "niko", password: $pw,
               udp_over_tcp: true, tls: {enabled: true, server_name: "bench.test", certificate_path: "/tmp/qb/cert.pem"}}],
            route: {rules: [{inbound: ["to-reality"], outbound: "reality"}, {inbound: ["to-naive"], outbound: "naive"}]}}' > client.json
          /tmp/sing-box check -c server.json
          /tmp/sing-box check -c client.json
          nohup /tmp/sing-box run -c server.json > server.log 2>&1 &
          nohup /tmp/sing-box run -c client.json > client.log 2>&1 &
          for i in $(seq 50); do
            [ -n "$(ss -Hltn 'sport = :18443')" ] && [ -n "$(ss -Hltn 'sport = :18444')" ] &&
              [ -n "$(ss -Hltn 'sport = :20001')" ] && [ -n "$(ss -Hltn 'sport = :20002')" ] && break
            sleep 0.2
          done
          # the path as a link: real packets and a buffer of about a round trip, not loopback's 64 KB ones
          sudo ip link set lo mtu 1500
          sudo ethtool -K lo tso off gso off gro off || true
          sudo modprobe sch_netem
          sudo modprobe tcp_bbr || true

      - name: Measure
        env:
          LOSSES: ${{ inputs.losses }}
          DELAY: ${{ inputs.delay }}
          RATE: ${{ inputs.rate }}
          CONGESTION: ${{ inputs.congestion }}
          REPS: ${{ inputs.reps }}
        run: |
          cd /tmp/qb
          export QUIC_GO_DISABLE_GSO=true
          # the inputs are a person's, but they still go into tc and sysctl: numbers and names only
          for v in $LOSSES; do [[ "$v" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "not a loss: $v"; exit 1; }; done
          # whole numbers: the delay goes into shell arithmetic, the repetitions into an int flag
          for v in "$DELAY" "$REPS"; do [[ "$v" =~ ^[0-9]+$ ]] || { echo "not a whole number: $v"; exit 1; }; done
          [[ "$RATE" =~ ^[0-9]+[kmg]?bit$ ]] || { echo "not a rate: $RATE"; exit 1; }
          for c in $CONGESTION; do [[ "$c" =~ ^[a-z0-9]+$ ]] || { echo "not a congestion control: $c"; exit 1; }; done
          path() {
            sudo tc qdisc del dev lo root 2>/dev/null || true
            sudo tc qdisc add dev lo root handle 1: prio bands 4
            # only the path: the tunnels' server ports and the straight server; the rest of lo stays as it is
            sudo tc qdisc add dev lo parent 1:4 handle 40: netem delay "${DELAY}ms" loss "$1%" rate "$RATE" limit 400
            for p in 18443 18444 19002; do
              sudo tc filter add dev lo parent 1: protocol ip prio 1 u32 match ip dport "$p" 0xffff flowid 1:4
              sudo tc filter add dev lo parent 1: protocol ip prio 1 u32 match ip sport "$p" 0xffff flowid 1:4
            done
          }
          # a fresh client per block: naive keeps its tunnel connection in a pool, which would carry the last
          # block's congestion control and window into the next
          client() {
            pkill -f 'sing-box run -c client.json' || true
            for i in $(seq 50); do [ -z "$(ss -Hltn 'sport = :20001')" ] && break; sleep 0.1; done
            nohup /tmp/sing-box run -c client.json >> client.log 2>&1 &
            for i in $(seq 50); do
              [ -n "$(ss -Hltn 'sport = :20001')" ] && [ -n "$(ss -Hltn 'sport = :20002')" ] && break
              sleep 0.2
            done
          }
          row() { /tmp/quicbench run -label "$1" -proto "$2" -addr "$3" -cert cert.pem -reps "$REPS" -timeout 90s 2>>bench-errors.log || echo "| $1 | error | error | error |"; }
          {
            echo "## QUIC through stream profiles"
            echo
            echo "Path: ${DELAY} ms each way (round trip $((DELAY * 2)) ms), ${RATE}, loss as below, on the leg between the client and the node."
            echo "first: a fresh connection's first answer (setup and one round trip); bulk: 4 MiB on it; page: a fresh connection, 24 × 64 KiB at once. Medians of ${REPS}."
          } >> "$GITHUB_STEP_SUMMARY"
          for cc in $CONGESTION; do
            sudo sysctl -q -w net.ipv4.tcp_congestion_control="$cc"
            for loss in $LOSSES; do
              path "$loss"
              client
              {
                echo
                echo "### TCP $cc, loss $loss%"
                echo
                echo "| path | first, ms | bulk, Mbit/s | page, ms |"
                echo "|---|---|---|---|"
                row "TCP (HTTP/2) through REALITY" h2 127.0.0.1:20001
                row "QUIC (HTTP/3) through REALITY (XUDP)" h3 127.0.0.1:20001
                row "TCP (HTTP/2) through naive" h2 127.0.0.1:20002
                row "QUIC (HTTP/3) through naive (UDP over TCP)" h3 127.0.0.1:20002
                row "TCP (HTTP/2) straight" h2 127.0.0.1:19002
                row "QUIC (HTTP/3) straight (UDP of its own)" h3 127.0.0.1:19002
              } | tee -a "$GITHUB_STEP_SUMMARY"
              sudo tc -s qdisc show dev lo | grep -A2 netem || true
            done
          done
          sudo tc qdisc del dev lo root 2>/dev/null || true

      - name: Logs
        if: always()
        run: |
          sudo tc qdisc del dev lo root 2>/dev/null || true
          for f in serve server client; do echo "--- $f"; tail -n 40 /tmp/qb/$f.log 2>/dev/null || true; done
          echo "--- bench errors"; tail -n 80 /tmp/qb/bench-errors.log 2>/dev/null || true
          pkill -x sing-box || true; pkill -x quicbench || true
