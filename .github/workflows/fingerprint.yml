# The core's "chrome" fingerprint (uTLS, REALITY, Yggdrasil tls://) is the ClientHello captured from a real Chrome
# (sing-box fork, common/tls/chromehello). This job checks it against Google Chrome stable on the runner: the
# core must send the embedded capture, and the browser must still send it. When Chrome changes, the job fails
# and the new capture is in the "chrome-hello" artifact: it goes into the fork, the fork is pinned again.
name: Chrome fingerprint

on:
  push:
    paths:
      - "buildScript/lib/core/get_source_env.sh"
      - "libcore/chromecheck/**"
      - ".github/workflows/fingerprint.yml"
      - ".github/scripts/quic-sizes.py"
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

# read-only token: nothing here writes to the repository
permissions:
  contents: read

jobs:
  chrome:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: libcore/go.mod
          cache-dependency-path: libcore/go.sum

      - name: Fetch sources
        run: ./run lib core/init

      - name: Chrome and a display
        run: |
          google-chrome --version
          command -v xvfb-run || (sudo apt-get update -q && sudo apt-get install -y -q xvfb)
          # a name, not an address: Chrome sends what it sends to sites
          echo "127.0.0.1 niko-capture.example" | sudo tee -a /etc/hosts

      - name: Core's chrome = embedded capture = Chrome stable
        run: |
          TAGS=with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_xhttp,with_awg,with_dnstt,with_masterdnsvpn,with_yggdrasil,badlinkname,tfogo_checklinkname0
          (cd ../sing-box && go test -count=1 ./common/tls/chromehello)
          cd libcore
          CHROME_BIN="$(command -v google-chrome)" CHROME_HELLO_OUT="$RUNNER_TEMP/chrome-hello" \
            xvfb-run -a go test -count=1 -v -ldflags=-checklinkname=0 -tags="$TAGS" -run TestChromeLive ./chromecheck

      # What the same Chrome sends over HTTP/3: the sizes of its QUIC packets to real sites. The naive outbound is
      # Chromium as well, and a client option that would change these sizes (MTU discovery for UDP in HTTP/3
      # datagrams, raycontrol naive-udp-v1) is weighed against this. Informational: it never fails the job
      - name: Chrome's QUIC packet sizes (informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          command -v tcpdump > /dev/null || (sudo apt-get update -q && sudo apt-get install -y -q tcpdump) > /dev/null
          sudo timeout 60 tcpdump -i any -n -U -w "$RUNNER_TEMP/quic.pcap" 'udp port 443' > /dev/null 2>&1 &
          sleep 2
          # QUIC from the first request (no Alt-Svc round first), a fresh profile, pages with enough to fetch
          timeout 45 xvfb-run -a google-chrome --no-first-run --no-default-browser-check --user-data-dir="$RUNNER_TEMP/chrome-quic" \
            --origin-to-force-quic-on=www.google.com:443,www.youtube.com:443,cloudflare-quic.com:443 \
            https://www.google.com/ https://www.youtube.com/ https://cloudflare-quic.com/ > /dev/null 2>&1 || true
          sleep 3
          sudo pkill tcpdump || true
          sleep 1
          {
            echo "### QUIC packet sizes of $(google-chrome --version)"
            echo '```'
            sudo tcpdump -n -r "$RUNNER_TEMP/quic.pcap" 2> /dev/null | python3 -I .github/scripts/quic-sizes.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The capture of this Chrome
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chrome-hello
          path: ${{ runner.temp }}/chrome-hello
          if-no-files-found: ignore
