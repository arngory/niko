# The core's "chrome" fingerprint (uTLS, REALITY, Yggdrasil tls://) is the ClientHello captured from a real Chrome
# (sing-box fork, common/tls/chromehello). This job checks it against the reference Chrome: the Google Chrome of the
# release naive's library is built of (.github/fingerprint/chrome.env), not the one the runner's image happens to
# carry. The core must send the embedded capture, and that browser must send it too. When they differ, the job fails
# and the new capture is in the "chrome-hello" artifact: it goes into the fork, the fork is pinned again.
name: Chrome fingerprint

on:
  push:
    paths:
      - "buildScript/lib/core/get_source_env.sh"
      - "libcore/chromecheck/**"
      - ".github/workflows/fingerprint.yml"
      - ".github/scripts/quic-sizes.py"
      - ".github/scripts/netlog-quic.py"
      - ".github/scripts/netlog-chains.py"
      - ".github/scripts/hello.py"
      - ".github/tools/quicinitial/**"
      - ".github/fingerprint/**"
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

# read-only token: nothing here writes to the repository
permissions:
  contents: read

jobs:
  chrome:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: libcore/go.mod
          cache-dependency-path: libcore/go.sum

      - name: Fetch sources
        run: ./run lib core/init

      # The reference Chrome is of the library's release. The current stable from Google first (the image's own
      # lags by weeks); if that is not the release, the package chrome.env names, by its hash
      - name: The reference Chrome and a display
        run: |
          . .github/fingerprint/chrome.env
          # one Chromium for the project: the library's version is the core's ChromiumAnchorsVersion
          library_version="$(sed -n 's/^const ChromiumAnchorsVersion = "\([0-9.]*\)"$/\1/p' ../sing-box/common/certificate/chromium_anchors_neko_generated.go)"
          library="${library_version%%.*}"
          [ "$library" = "$CHROME_REFERENCE_MAJOR" ] ||
            { echo "::error::the reference Chrome is $CHROME_REFERENCE_MAJOR, naive's library is Chromium ${library_version:-unknown}: .github/fingerprint/chrome.env moves with the library"; exit 1; }
          major() { "$1" --version 2> /dev/null | sed -n 's/[^0-9]*\([0-9][0-9]*\)\..*/\1/p'; }
          echo "the image's Chrome: $(google-chrome --version)"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/chrome-stable.deb" https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb &&
            sudo apt-get install -y -q --allow-downgrades "$RUNNER_TEMP/chrome-stable.deb" > /dev/null ||
            echo "::warning::the current stable Chrome could not be installed: the image's is used as stable"
          echo "stable Chrome: $(google-chrome --version)"
          reference=
          if [ "$(major google-chrome)" = "$CHROME_REFERENCE_MAJOR" ]; then
            reference=google-chrome
          elif [ -n "$CHROME_REFERENCE_DEB" ]; then
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/chrome-reference.deb" "$CHROME_REFERENCE_DEB"
            echo "$CHROME_REFERENCE_DEB_SHA256  $RUNNER_TEMP/chrome-reference.deb" | sha256sum -c -
            package="$(dpkg-deb -f "$RUNNER_TEMP/chrome-reference.deb" Package)"
            sudo apt-get install -y -q --allow-downgrades "$RUNNER_TEMP/chrome-reference.deb" > /dev/null
            [ "$(major "$package")" = "$CHROME_REFERENCE_MAJOR" ] && reference="$package"
          fi
          [ -n "$reference" ] ||
            { echo "::error::no Chrome $CHROME_REFERENCE_MAJOR: stable is $(google-chrome --version), and chrome.env names no package of it"; exit 1; }
          # the same release branch as the library (158.0.8127 of 158.0.8127.36): the code of TLS and QUIC is the
          # branch's; the last number is the patch, which Linux packages get later than the library is built
          have="$("$reference" --version | sed -n 's/[^0-9]*\([0-9][0-9.]*[0-9]\).*/\1/p')"
          [ "${have%.*}" = "${library_version%.*}" ] ||
            { echo "::error::the reference Chrome is $have, naive's library is Chromium $library_version: not one release branch"; exit 1; }
          {
            echo "### One Chromium"
            echo "naive's library: Chromium $library_version; the reference: $("$reference" --version)"
            [ "$have" = "$library_version" ] || echo "(the same branch ${have%.*}; the patch differs: Linux has no package of $library_version yet)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "CHROME_REFERENCE_BIN=$(command -v "$reference")" >> "$GITHUB_ENV"
          command -v xvfb-run || (sudo apt-get update -q && sudo apt-get install -y -q xvfb)
          # a name, not an address: Chrome sends what it sends to sites
          echo "127.0.0.1 niko-capture.example" | sudo tee -a /etc/hosts

      - name: Core's chrome = embedded capture = the reference Chrome
        run: |
          TAGS=with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_xhttp,with_awg,with_dnstt,with_masterdnsvpn,with_yggdrasil,badlinkname,tfogo_checklinkname0
          (cd ../sing-box && go test -count=1 ./common/tls/chromehello)
          cd libcore
          CHROME_BIN="$CHROME_REFERENCE_BIN" CHROME_HELLO_OUT="$RUNNER_TEMP/chrome-hello" \
            xvfb-run -a go test -count=1 -v -ldflags=-checklinkname=0 -tags="$TAGS" -run TestChromeLive ./chromecheck

      # The reference Chrome's first flight over QUIC: its Initial packets to a port of the runner that only listens, opened by
      # .github/tools/quicinitial (their keys come from the connection ID the client picks: anyone on the path opens
      # them). The naive outbound's QUIC is Chromium's too: raycontrol-interop and e2e compare its first flight with
      # .github/fingerprint/chrome-quic-initial.hex, which is this capture (the chrome-hello artifact), committed by
      # hand. Against that reference a Chrome that changed is a warning here, not a failure
      - name: Chrome's QUIC first flight
        if: ${{ !cancelled() }}
        run: |
          (cd .github/tools/quicinitial && go test -count=1 . && go build -o "$RUNNER_TEMP/quicinitial" .)
          q="$RUNNER_TEMP/quicinitial" out="$RUNNER_TEMP/chrome-hello"
          mkdir -p "$out"
          "$q" capture 18448 "$out/quic-initial.hex" &
          cap=$!
          sleep 1
          # QUIC from the first request (no Alt-Svc round first); the name is the runner's (/etc/hosts above)
          timeout 60 xvfb-run -a "$CHROME_REFERENCE_BIN" --no-first-run --no-default-browser-check --no-proxy-server \
            --user-data-dir="$RUNNER_TEMP/chrome-quic-initial" --origin-to-force-quic-on=niko-capture.example:18448 \
            https://niko-capture.example:18448/ > /dev/null 2>&1 &
          chrome=$!
          # the capture ends once the ClientHello is whole, or after two minutes without a datagram
          ok=yes
          wait "$cap" || ok=no
          pkill -f chrome-quic-initial || true
          kill "$chrome" 2> /dev/null || true
          wait "$chrome" 2> /dev/null || true
          [ "$ok" = yes ] || { echo "::error::no QUIC first flight from Chrome"; exit 1; }
          "$CHROME_REFERENCE_BIN" --version > "$out/quic-initial.source"
          {
            echo "### QUIC first flight of $(cat "$out/quic-initial.source")"
            echo '```'
            "$q" open "$out/quic-initial.hex" "$RUNNER_TEMP/chrome-quic-hello.hex"
            if [ -s .github/fingerprint/chrome-quic-initial.hex ]; then
              echo "against the reference: $(cat .github/fingerprint/chrome-quic-initial.source)"
              "$q" compare .github/fingerprint/chrome-quic-initial.hex "$out/quic-initial.hex"
              "$q" open .github/fingerprint/chrome-quic-initial.hex "$RUNNER_TEMP/reference-quic-hello.hex" > /dev/null
              python3 -I .github/scripts/hello.py compare "$RUNNER_TEMP/reference-quic-hello.hex" "$RUNNER_TEMP/chrome-quic-hello.hex"
            else
              echo "no reference in .github/fingerprint yet: this capture is the first (the chrome-hello artifact)"
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # What Chrome sends over HTTP/3: the sizes of its QUIC packets to real sites. The naive outbound is Chromium as
      # well, and a client option that would change these sizes (MTU discovery for UDP in HTTP/3 datagrams, MTUH,
      # raycontrol naive-udp-v1 §4.5) is weighed against this: stable and beta (the next version), each on a profile
      # that has run once before, so the field trials of the variations seed an ordinary user gets are on, and with
      # uploads that finish. Informational: it never fails the job
      - name: Chrome's QUIC packet sizes (informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          command -v tcpdump > /dev/null || (sudo apt-get update -q && sudo apt-get install -y -q tcpdump) > /dev/null
          # the current beta, over the reference's package if that was a beta: the reference steps are done
          curl -fsSL -o "$RUNNER_TEMP/chrome-beta.deb" https://dl.google.com/linux/direct/google-chrome-beta_current_amd64.deb &&
            sudo apt-get install -y -q "$RUNNER_TEMP/chrome-beta.deb" > /dev/null || echo "::warning::no current Chrome beta"
          # an upload too: quiche sends its first MTU probe after a hundred packets of a session, and a page load is
          # mostly acknowledgements. Three POSTs of 1 MB to Cloudflare's speed test, one after another, each awaited
          cat > "$RUNNER_TEMP/upload.html" <<'PAGE'
          <!doctype html><title>upload</title><script>
          (async () => {
            for (let i = 0; i < 3; i++) {
              await fetch("https://speed.cloudflare.com/__up", {method: "POST", mode: "no-cors", body: new Uint8Array(1000000)});
              document.title = "sent " + (i + 1);
            }
          })().catch(() => document.title = "failed");
          </script>
          PAGE
          capture() {
            local bin="$1" name="$2" profile="$RUNNER_TEMP/chrome-quic-$2"
            command -v "$bin" > /dev/null || return 0
            # a first run on the profile fetches the variations seed; the field trials it holds are on from the
            # next start, as for an ordinary user's browser
            timeout 40 xvfb-run -a "$bin" --no-first-run --no-default-browser-check --user-data-dir="$profile" \
              about:blank > /dev/null 2>&1 || true
            local seed=no
            grep -qs '"variations_compressed_seed"' "$profile/Local State" && seed=yes
            sudo timeout 100 tcpdump -i any -n -U -w "$RUNNER_TEMP/quic-$name.pcap" 'udp port 443' > /dev/null 2>&1 &
            sleep 2
            # QUIC from the first request (no Alt-Svc round first), pages with enough to fetch, the uploads; the
            # browser's own net log for its sessions' settings and its field trials
            timeout 90 xvfb-run -a "$bin" --no-first-run --no-default-browser-check --user-data-dir="$profile" \
              --origin-to-force-quic-on=www.google.com:443,www.youtube.com:443,cloudflare-quic.com:443,speed.cloudflare.com:443 \
              --log-net-log="$RUNNER_TEMP/chrome-netlog-$name.json" \
              https://www.google.com/ https://www.youtube.com/ https://cloudflare-quic.com/ "file://$RUNNER_TEMP/upload.html" \
              > /dev/null 2>&1 || true
            sleep 3
            sudo pkill tcpdump || true
            sleep 1
            {
              echo "### QUIC packet sizes of $("$bin" --version) (variations seed: $seed)"
              echo '```'
              sudo tcpdump -n -r "$RUNNER_TEMP/quic-$name.pcap" 2> /dev/null | python3 -I .github/scripts/quic-sizes.py
              python3 -I .github/scripts/netlog-quic.py "$RUNNER_TEMP/chrome-netlog-$name.json"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          }
          capture google-chrome stable
          capture google-chrome-beta beta

      # A naive profile is held to the core's list of roots by key pins: a key of the list has to be in the chain
      # Chromium verified. That chain ends at the first certificate Chromium's store has as a trust anchor, and the
      # store has intermediates as anchors (Google's, Let's Encrypt's): the core counts each with the list that
      # has its root. Real Chrome's own net log says which chains it accepted, and the script which of their keys
      # the core's lists and those anchors have: a site with none would be refused by a naive profile
      - name: The chains Chrome verifies, against the core's root lists (informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          timeout 60 xvfb-run -a google-chrome --no-first-run --no-default-browser-check --user-data-dir="$RUNNER_TEMP/chrome-chains" \
            --log-net-log="$RUNNER_TEMP/chrome-chains.json" --net-log-capture-mode=Everything \
            https://www.gstatic.com/generate_204 https://www.google.com/ https://letsencrypt.org/ https://github.com/ \
            https://www.cloudflare.com/ https://www.microsoft.com/ https://www.amazon.com/ https://www.wikipedia.org/ \
            > /dev/null 2>&1 || true
          {
            echo "### The chains $(google-chrome --version) verified"
            echo '```'
            python3 -I .github/scripts/netlog-chains.py "$RUNNER_TEMP/chrome-chains.json" \
              chrome=../sing-box/common/certificate/chrome.go mozilla=../sing-box/common/certificate/mozilla.go \
              anchors=../sing-box/common/certificate/chromium_anchors_neko_generated.go
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The capture of this Chrome
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: chrome-hello
          path: ${{ runner.temp }}/chrome-hello
          if-no-files-found: ignore
