name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.4.3), must match VERSION_NAME in niko.properties. If it does not exist yet, the run leaves a draft with the signed files, and publishing it on the site makes the tag."
        required: true

# read-only by default: only publish writes (the release and its assets). The build runs Gradle, its plugins and
# the dependencies, and a token that could write would let them swap the assets of published releases
permissions:
  contents: read

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      kind: ${{ steps.tag.outputs.kind }}
      tag_exists: ${{ steps.tag.outputs.tag_exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag
        id: tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$TAG" == niko-server-* ]]; then
            echo "::error::niko-server is released from arngory/niko-server (vX.Y.Z tags) since v0.1.2"
            exit 1
          fi
          version=$(grep '^VERSION_NAME=' niko.properties | cut -d= -f2)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match VERSION_NAME=$version in niko.properties"
            exit 1
          fi
          # only what main carries is released: the environment release admits any v* tag, and a tag on a commit
          # of an unreviewed branch would bring that branch's workflows to the keys behind one approval. This
          # check runs from the tagged commit's own workflow, so it catches mistakes; the guard against intent is
          # the tag ruleset (docs/guide/release.md §2: only the owner creates v* tags)
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main: releases are cut from main only"
            exit 1
          fi
          # an existing tag must point at the commit being released
          tag_exists=false
          if existing=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}"); then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::tag $TAG already exists on $existing, not on $GITHUB_SHA"
              exit 1
            fi
            tag_exists=true
          fi
          # the owner published the draft a manual run left: that made the tag, and this run of the tag finds the
          # release out with its files, so it has nothing to build, sign or publish
          released=$(gh release view "$TAG" --json isDraft,assets \
            --jq '(.isDraft | not) and any(.assets[]; .name == "SHA256SUMS")' 2> /dev/null || true)
          if [ "$released" = "true" ]; then
            echo "::notice::$TAG is out with its files already: nothing to do"
            echo "kind=released" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # the release's UPDATE.json (client-min-v1 §6), when the owner wrote one: checked here, before the build and
          # the approval, as the app will read it; the job sign puts it into SHA256SUMS
          if [ -f ".github/release-notes/$TAG.update.json" ]; then
            python3 -I .github/scripts/update-json.py ".github/release-notes/$TAG.update.json" "$TAG"
          fi
          echo "kind=app" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$tag_exists" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: check
    if: needs.check.outputs.kind == 'app'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.check.outputs.sha }}

  # the release's Corresponding Source (GPL-3.0): the app's tree, the core fork, the Go modules, gomobile and the
  # slipstream client at the commits the build pins, in niko-<tag>-sources.tar.zst (.github/scripts/release-sources.sh).
  # It fetches and copies; nothing of what it fetches runs
  sources:
    name: Sources
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.kind == 'app'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: libcore/go.mod
          cache: false

      - name: The sources' archive
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: .github/scripts/release-sources.sh "$TAG" sources

      - name: Upload the sources' archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sources
          path: sources
          if-no-files-found: error

  # The release keys are secrets of the environment release only (one required reviewer, the owner; v* tags and
  # main), under names no repository secret has (RELEASE_*), so a job never falls back to one. This job asks for
  # the release's one approval and signs both the APKs and SHA256SUMS; no build code runs here, the APK artifact is
  # data to it (.github/scripts/release-sign.sh: zipalign, apksigner, minisign)
  sign:
    name: Sign
    runs-on: ubuntu-latest
    needs: [check, build]
    if: needs.check.outputs.kind == 'app'
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout the signing script
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
          # the files at the root come with it in cone mode: niko-update.pub
          sparse-checkout: |
            .github/scripts
            .github/release-notes

      - name: Download APKs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: APKs
          path: apks

      - name: Sign the APKs and SHA256SUMS
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.RELEASE_ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.RELEASE_ALIAS_PASS }}
          MINISIGN_KEY: ${{ secrets.RELEASE_MINISIGN_KEY }}
          # the certificate every Niko release is signed with (oss and preview): another one is refused
          EXPECT_CERT_SHA256: f4ac83655f2e6be36235706303bc4e4a1dd7bb36fcc2285dc526f9df5636c13f
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASS ALIAS_NAME ALIAS_PASS; do
            [ -n "${!name}" ] || { echo "::error::RELEASE_$name is not set in the environment release"; exit 1; }
          done
          sudo apt-get install -y -q minisign > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q minisign; }
          umask 077
          keys="$RUNNER_TEMP/keys"; mkdir -p "$keys"; trap 'rm -rf "$keys"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keys/release.keystore"
          export KEYSTORE_FILE="$keys/release.keystore" MINISIGN_KEY_FILE="" UPDATE_PUB=""
          if [ -n "$MINISIGN_KEY" ]; then printf '%s\n' "$MINISIGN_KEY" > "$keys/niko-update.key"; MINISIGN_KEY_FILE="$keys/niko-update.key"; fi
          [ -f niko-update.pub ] && UPDATE_PUB=niko-update.pub
          unset KEYSTORE_BASE64 MINISIGN_KEY
          # the UPDATE.json the job check checked, as it is in the tagged commit: signed with the APKs in SHA256SUMS
          if [ -f ".github/release-notes/$TAG.update.json" ]; then cp ".github/release-notes/$TAG.update.json" apks/UPDATE.json; fi
          bash .github/scripts/release-sign.sh apks

      - name: Upload the signed APKs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: APKs-signed
          path: apks
          if-no-files-found: error

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [check, sign, sources]
    if: needs.check.outputs.kind == 'app'
    # the one job that writes: gh release with GH_TOKEN; no build code runs here
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
          # the files at the root come with it in cone mode: niko-update.pub
          sparse-checkout: .github/release-notes

      - name: Download the signed APKs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: APKs-signed
          path: apks

      - name: Download the sources' archive
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sources
          path: sources

      # signed in the job sign under the environment release; this job holds no key and checks SHA256SUMS again as
      # the app does: the pinned public key, the trusted comment the tag
      - name: Check the SHA256SUMS signature
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          if [ ! -f niko-update.pub ]; then
            echo "::warning::no niko-update.pub: the app does not check this signature yet"
            exit 0
          fi
          [ -f apks/SHA256SUMS.minisig ] || { echo "::error::SHA256SUMS is not signed, and the app checks updates with niko-update.pub"; exit 1; }
          sudo apt-get install -y -q minisign > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q minisign; }
          minisign -V -p niko-update.pub -m apks/SHA256SUMS
          grep -qxF "trusted comment: niko $TAG" apks/SHA256SUMS.minisig
          # every file the list names is the one uploaded (the APKs, UPDATE.json where the release has one)
          (cd apks && sha256sum --strict -c SHA256SUMS)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
          SHA: ${{ needs.check.outputs.sha }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
          TAG_EXISTS: ${{ needs.check.outputs.tag_exists }}
        run: |
          flags=(--title "$TAG" --target "$SHA")
          # the notes say where the source is (GPL-3.0): after the hand-written ones, before GitHub's generated ones
          src="**Source code** · **Исходный код**: \`niko-$TAG-sources.tar.zst\` below · ниже: the app, the core fork, the Go modules, the slipstream client · приложение, форк ядра, модули Go, клиент slipstream (\`SOURCES.md\` inside · внутри)."
          notes="$RUNNER_TEMP/notes.md"
          # a manual run for a tag not made yet: a release published here would make the tag, and the tag ruleset
          # lets only the owner make v* tags (docs/guide/release.md §2), so the run leaves a draft, which makes
          # none. The owner publishes it on the site, the tag is made on $SHA then, and its run stops at check
          [ "$TAG_EXISTS" = "true" ] || flags+=(--draft)
          # hand-written notes for the tag if present, otherwise GitHub's generated ones
          if [ -f ".github/release-notes/$TAG.md" ]; then
            { cat ".github/release-notes/$TAG.md"; printf '\n%s\n' "$src"; } > "$notes"
            flags+=(--notes-file "$notes")
          else
            flags+=(--generate-notes --notes "$src")
          fi
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          if gh release view "$TAG" > /dev/null 2>&1; then
            # the release is there already: the tag was made on the site, which makes an empty release with it
            # (v1.57.0 went out with no title and no notes so). It gets the files, and the title and the notes
            # of the repository too; without a notes file, what was written by hand stays
            gh release upload "$TAG" apks/* sources/* --clobber
            # the pre-release mark follows the tag here too, whatever was ticked on the site: the app's update
            # check reads "latest" for stable builds and the mark for preview ones, and a node's mirror expects
            # the mark to agree with the dash in the tag
            edit=(--title "$TAG" --prerelease="$PRERELEASE")
            [ "$PRERELEASE" = "true" ] && edit+=(--latest=false)
            [ -f ".github/release-notes/$TAG.md" ] && edit+=(--notes-file "$notes")
            gh release edit "$TAG" "${edit[@]}"
          else
            gh release create "$TAG" apks/* sources/* "${flags[@]}"
          fi
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
            echo "::notice::$TAG is a draft with the signed files: publish it on the site (Releases, $TAG, Edit, Publish release), which makes the tag on $SHA"
            echo "**$TAG** is a draft with the signed files. Publish it on the site: Releases → $TAG → Edit → **Publish release**; that makes the tag on \`$SHA\`." >> "$GITHUB_STEP_SUMMARY"
          fi
