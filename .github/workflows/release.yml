name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.4.3), must match VERSION_NAME in niko.properties. Created on the selected branch's head if it does not exist yet."
        required: true

permissions:
  contents: write

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      kind: ${{ steps.tag.outputs.kind }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [[ "$TAG" == niko-server-* ]]; then
            echo "::error::niko-server is released from arngory/niko-server (vX.Y.Z tags) since v0.1.2"
            exit 1
          fi
          echo "kind=app" >> "$GITHUB_OUTPUT"
          version=$(grep '^VERSION_NAME=' niko.properties | cut -d= -f2)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match VERSION_NAME=$version in niko.properties"
            exit 1
          fi
          # an existing tag must point at the commit being released
          if existing=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}"); then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::tag $TAG already exists on $existing, not on $GITHUB_SHA"
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: check
    if: needs.check.outputs.kind == 'app'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.check.outputs.sha }}
      require-signing: true
    secrets: inherit

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [check, build]
    if: needs.check.outputs.kind == 'app'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.check.outputs.sha }}
          # the files at the root come with it in cone mode: niko-update.pub
          sparse-checkout: .github/release-notes

      - name: Download APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: APKs
          path: apks

      # SHA256SUMS signed with minisign (the secret MINISIGN_SECRET_KEY, a key made with minisign -G -W): the GitHub
      # build checks it with the public key of niko-update.pub, the trusted comment its tag, before it installs an
      # update (io.niko.utils.Updates; docs/RELEASE_SIGNING.md §5)
      - name: Sign SHA256SUMS
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            if [ -f niko-update.pub ]; then
              echo "::error::the app checks updates with niko-update.pub, and MINISIGN_SECRET_KEY is not set: it would refuse this release"
              exit 1
            fi
            echo "::warning::MINISIGN_SECRET_KEY is not set: SHA256SUMS goes out unsigned"
            exit 0
          fi
          sudo apt-get install -y -q minisign > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q minisign; }
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/niko-update.key"
          minisign -S -s "$RUNNER_TEMP/niko-update.key" -m apks/SHA256SUMS -t "niko $TAG" < /dev/null
          rm -f "$RUNNER_TEMP/niko-update.key"
          # as the app checks it: the pinned public key, the trusted comment the tag
          if [ -f niko-update.pub ]; then
            minisign -V -p niko-update.pub -m apks/SHA256SUMS
            grep -qxF "trusted comment: niko $TAG" apks/SHA256SUMS.minisig
          else
            echo "::warning::no niko-update.pub: the app does not check this signature yet"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
          SHA: ${{ needs.check.outputs.sha }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          # a manual run creates the tag on the released commit
          flags=(--title "$TAG" --target "$SHA")
          # hand-written notes for the tag if present, otherwise GitHub's generated ones
          if [ -f ".github/release-notes/$TAG.md" ]; then
            flags+=(--notes-file ".github/release-notes/$TAG.md")
          else
            flags+=(--generate-notes)
          fi
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" apks/* --clobber
          else
            gh release create "$TAG" apks/* "${flags[@]}"
          fi
