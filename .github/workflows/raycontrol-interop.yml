name: raycontrol interop

# The client side against a real rayd from arngory/raycontrol (niko-r3-note.md §4):
# registration by invite through the remote API (libcore/rayapi), and the
# NaiveProxy client and the core's own naive outbound (cronet, which replaces the
# plugin) against `rayd naive` behind the niko-server front, over h2 (TCP 443)
# and QUIC (UDP 443).
on:
  push:
    paths:
      - ".github/workflows/raycontrol-interop.yml"
      - ".github/raycontrol.env"
      - ".github/niko-server.env"
      - ".github/slipstream-server.env"
      - "buildScript/lib/slipstream/env.sh"
      - ".github/scripts/netlog-errors.py"
      - ".github/scripts/udp-dns-probe.py"
      - "libcore/rayapi/**"
      - "libcore/rayprobe/**"
      - "libcore/raysub/**"
      - "libcore/probe/**"
      - "libcore/knock/**"
      - "libcore/rayprobe_box.go"
      - "libcore/raysub.go"
      - "libcore/dnsprobe/**"
      - "libcore/dnsprobe_box.go"
      - "libcore/raycontrol_tunnel_interop_test.go"
      - "libcore/raycontrol_app_interop_test.go"
      - "libcore/raycontrol_traffic_interop_test.go"
      - "libcore/raycontrol_lan_interop_test.go"
      - ".github/xray-interop.env"
      - "buildScript/lib/core/get_source_env.sh"
      - "libcore/box_naive.go"
  workflow_dispatch:
    inputs:
      raycontrol:
        description: "A raycontrol commit to run against instead of .github/raycontrol.env's (a release not out yet)"
        default: ""
      niko_server_tag:
        description: "With it: the niko-server release that commit pins (deploy/versions.env)"
        default: ""
      niko_server_sha256:
        description: "That release's niko-server-linux-amd64 SHA-256"
        default: ""

permissions:
  contents: read

# a manual run's commit and release, through the environment (never into a script as they are); a push has none
env:
  RAYCONTROL_COMMIT_OVERRIDE: ${{ inputs.raycontrol }}
  NIKO_SERVER_TAG_OVERRIDE: ${{ inputs.niko_server_tag }}
  NIKO_SERVER_SHA256_OVERRIDE: ${{ inputs.niko_server_sha256 }}

jobs:
  invite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch raycontrol and the core
        run: |
          . .github/raycontrol.env
          COMMIT_RAYCONTROL=${RAYCONTROL_COMMIT_OVERRIDE:-$COMMIT_RAYCONTROL}
          . buildScript/lib/core/get_source_env.sh
          git clone --filter=blob:none "$REPOSITORY_RAYCONTROL" raycontrol
          git -C raycontrol checkout -q "$COMMIT_RAYCONTROL"
          # libcore/go.mod replaces the core with ../../sing-box and ../../libneko
          git clone --filter=blob:none "$REPOSITORY_SING_BOX" ../sing-box
          git -C ../sing-box checkout -q "$COMMIT_SING_BOX"
          git clone --filter=blob:none "$REPOSITORY_LIBNEKO" ../libneko
          git -C ../libneko checkout -q "$COMMIT_LIBNEKO"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: raycontrol/go.mod
          cache: false
      - name: Build rayd and rayctl
        working-directory: raycontrol
        run: |
          CGO_ENABLED=0 go build -o /tmp/rayd ./cmd/rayd
          CGO_ENABLED=0 go build -o /tmp/rayctl ./cmd/rayctl

      # the runner's addresses are private: a test AS database (raycontrol's test/install/asndb) puts them in an AS,
      # so ten reports from here give a hint (probe-v1.md §6.2)
      - name: A test AS database
        working-directory: raycontrol
        run: |
          go run ./test/install/asndb -o /tmp/asn-test.mmdb 0.0.0.0/0
          sudo install -d -m 755 /var/lib/raycontrol
          sudo install -m 644 /tmp/asn-test.mmdb /var/lib/raycontrol/asn.mmdb

      - name: A node with the remote API
        run: |
          mkdir -p /tmp/rc/rendered
          /tmp/rayd init -db /tmp/rc/rayd.db -host 127.0.0.1
          # no perimeter here (rayspa, nftables): the API port is open without SPA; the client still sends SPA
          nohup /tmp/rayd serve -db /tmp/rc/rayd.db -socket /tmp/rc/rayd.sock -group "$(id -gn)" \
            -live=false -acme-directory "" -rendered /tmp/rc/rendered > /tmp/rayd.log 2>&1 &
          for i in $(seq 100); do [ -S /tmp/rc/rayd.sock ] && break; sleep 0.2; done
          rc() { /tmp/rayctl -socket /tmp/rc/rayd.sock "$@"; }
          rc service add api api
          # a service with a profile in the subscription (the hints are for those), without a domain
          rc service add hy2-obfs hy2-obfs
          rc user add interop
          rc device invite interop phone -role admin -o /tmp/rc/invite
          # invites with a PIN (api-v1 §4, v0.13.0): rcinv1, the short rcinv2 (§3a), one to withdraw by wrong
          # tries; the PIN goes to rayctl's output only, never into the file
          mkdir -p /tmp/rc/pin
          rc device invite interop pin1 -pin -o /tmp/rc/pin/pin.invite > /tmp/rc/pin/pin.out
          rc device invite interop pin2 -pin -format rcinv2 -o /tmp/rc/pin/v2.invite > /tmp/rc/pin/v2.out
          rc device invite interop pin3 -pin -o /tmp/rc/pin/gone.invite > /tmp/rc/pin/gone.out
          grep -q '^RCINV2:' /tmp/rc/pin/v2.invite
          for f in pin v2 gone; do
            pin=$(sed -n 's/^PIN \([0-9]\{3\}\) \([0-9]\{3\}\):.*/\1\2/p' /tmp/rc/pin/$f.out)
            [ -n "$pin" ] || { echo "no PIN shown for $f"; cat /tmp/rc/pin/$f.out; exit 1; }
            if grep -q "$pin" /tmp/rc/pin/$f.invite; then echo "the PIN in $f's file"; exit 1; fi
          done
          # raycontrol v0.24.0: Register again with the same client key gets the same device (api-v1 §4.1); a second
          # switch of a dnstt seal key within the first one's grace is refused unless forced
          if grep -rqs "register-replay" raycontrol/internal/api; then echo "RAYCONTROL_REGISTER_RETRY=1" >> "$GITHUB_ENV"; fi
          if grep -qs "bool force = 3" raycontrol/api/proto/raycontrol/node/v1/node.proto; then
            rc service add dnstt dns
            echo "RAYCONTROL_ROTATE_SERVICE=dns" >> "$GITHUB_ENV"
          fi
          rc service list
          # the API listener follows the change
          sleep 2
          grep -q "remote api" /tmp/rayd.log && grep "remote api" /tmp/rayd.log | tail -2

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: libcore/go.mod
          cache: false
      - name: Register, admin calls, key rotation (libcore/rayapi)
        working-directory: libcore
        env:
          RAYCONTROL_INVITE_FILE: /tmp/rc/invite
          RAYCONTROL_PIN_DIR: /tmp/rc/pin
          RAYCONTROL_HINTS: "1"
        run: go test -count=1 -v -ldflags=-checklinkname=0 -run TestRaycontrolInterop ./rayapi

      - name: Logs
        if: always()
        run: |
          tail -n 60 /tmp/rayd.log || true
          pkill -x rayd || true

  # a node as raycontrol's test/supervise recipe runs it: a plain debian container, root, no systemd, rayd serve
  # -supervise running the data plane from the rendered files (Xray for REALITY and inner, niko-server for Hysteria2,
  # Yggdrasil and the front), a test CA for the site; the client on the runner measures through each tunnel profile
  # and finds its own Hysteria2 sessions in link
  supervised:
    runs-on: ubuntu-latest
    # the LAN step alone may take ten minutes (mesh paths through the node, the backend restarted twice)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch raycontrol, Xray and the core
        run: |
          . .github/raycontrol.env
          COMMIT_RAYCONTROL=${RAYCONTROL_COMMIT_OVERRIDE:-$COMMIT_RAYCONTROL}
          . .github/xray-interop.env
          . buildScript/lib/core/get_source_env.sh
          git clone --filter=blob:none "$REPOSITORY_RAYCONTROL" raycontrol
          git -C raycontrol checkout -q "$COMMIT_RAYCONTROL"
          git clone --filter=blob:none "$REPOSITORY_XRAY" xray
          git -C xray checkout -q "$COMMIT_XRAY"
          git clone --filter=blob:none "$REPOSITORY_SING_BOX" ../sing-box
          git -C ../sing-box checkout -q "$COMMIT_SING_BOX"
          git clone --filter=blob:none "$REPOSITORY_LIBNEKO" ../libneko
          git -C ../libneko checkout -q "$COMMIT_LIBNEKO"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: raycontrol/go.mod
          cache: false
      - name: Build rayd, rayctl, Xray; the test certificate; niko-server
        run: |
          mkdir -p /tmp/rcbin /tmp/rccert
          (cd raycontrol && CGO_ENABLED=0 go build -o /tmp/rcbin/rayd ./cmd/rayd &&
            CGO_ENABLED=0 go build -o /tmp/rcbin/rayctl ./cmd/rayctl &&
            CGO_ENABLED=0 go build -o /tmp/rcbin/rayspa ./cmd/rayspa &&
            go run ./test/supervise/testcert -o /tmp/rccert '*.example.test')
          (cd xray && CGO_ENABLED=0 go build -o /tmp/rcbin/xray -trimpath ./main) && /tmp/rcbin/xray version | head -1
          . .github/niko-server.env
          NIKO_SERVER_TAG=${NIKO_SERVER_TAG_OVERRIDE:-$NIKO_SERVER_TAG}
          NIKO_SERVER_SHA256_AMD64=${NIKO_SERVER_SHA256_OVERRIDE:-$NIKO_SERVER_SHA256_AMD64}
          curl -fsSL --retry 3 -o /tmp/rcbin/niko-server "$NIKO_SERVER_RELEASES/download/$NIKO_SERVER_TAG/niko-server-linux-amd64"
          echo "$NIKO_SERVER_SHA256_AMD64  /tmp/rcbin/niko-server" | sha256sum -c -
          # the release the node runs, for the steps that need a version of it
          echo "NIKO_SERVER_RUNNING=$NIKO_SERVER_TAG" >> "$GITHUB_ENV"
          chmod +x /tmp/rcbin/niko-server
          chmod 0644 /tmp/rccert/*.pem

      - name: The node under rayd serve -supervise
        id: node
        run: |
          # documentation addresses (relay-v1: the exit takes only a public relay address): the runner 203.0.113.1,
          # the node (the exit) .2, its relay .3; no NAT between the relay and the exit
          docker network create --subnet 203.0.113.0/24 --gateway 203.0.113.1 rc-net > /dev/null
          docker run -d --name rc-node --network rc-net --ip 203.0.113.2 -v /tmp/rcbin:/opt/rc:ro -v /tmp/rccert:/opt/cert:ro \
            debian:13 sleep infinity > /dev/null
          ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' rc-node)
          echo "address=$ip" >> "$GITHUB_OUTPUT"
          x() { docker exec rc-node "$@"; }
          x mkdir -p /var/lib/raycontrol /run/raycontrol
          x /opt/rc/rayd init -host "$ip" -domain example.test > /dev/null
          # a rayd with the slipstream service (v0.16.0) runs the released server raycontrol ships, fetched only for
          # it (/tmp/rcbin is the container's /opt/rc, bound: the file shows there)
          slip=
          if x /opt/rc/rayd serve -h 2>&1 | grep -q -- "-slipstream-server"; then
            . .github/slipstream-server.env
            curl -fsSL --retry 3 -o /tmp/rcbin/slipstream-server \
              "$SLIPSTREAM_SERVER_RELEASES/download/$SLIPSTREAM_SERVER_TAG/slipstream-server-linux-amd64"
            echo "$SLIPSTREAM_SERVER_SHA256_AMD64  /tmp/rcbin/slipstream-server" | sha256sum -c -
            chmod +x /tmp/rcbin/slipstream-server
            slip="-slipstream-server /opt/rc/slipstream-server"
            echo "RAYCONTROL_SLIPSTREAM=1" >> "$GITHUB_ENV"
          fi
          # a rayd with the app's mirror (app-update-v1, v0.18.0): releases from a GitHub of the test's own on the runner
          # (203.0.113.1:8091), signed by a key of the test's own, made here (rayd takes both at its start)
          app=
          if /tmp/rcbin/rayctl -h 2>&1 | grep -q "app-mirror"; then
            sudo apt-get install -y -qq minisign > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq minisign > /dev/null; }
            mkdir -p /tmp/appkey && rm -f /tmp/appkey/test.pub /tmp/appkey/test.key
            minisign -G -W -p /tmp/appkey/test.pub -s /tmp/appkey/test.key > /dev/null
            app="RAYCONTROL_UNSAFE_APP_MIRROR_API=http://203.0.113.1:8091 RAYCONTROL_UNSAFE_APP_MIRROR_KEY=$(sed -n 2p /tmp/appkey/test.pub)"
            echo "RAYCONTROL_APP_MIRROR=1" >> "$GITHUB_ENV"
          fi
          # NIKO_SERVER_UNSAFE_ANY_DESTINATION: the tunnels may reach this private network; never on a real node
          x sh -c 'NIKO_SERVER_UNSAFE_ANY_DESTINATION=1 '"$app"' nohup /opt/rc/rayd serve -supervise \
            -xray /opt/rc/xray -niko-server /opt/rc/niko-server '"$slip"' -acme-directory "" > /var/log/rayd.log 2>&1 &'
          for i in $(seq 50); do x test -S /run/raycontrol/rayd.sock && break; sleep 0.2; done
          x /opt/rc/rayctl service add reality reality > /dev/null
          x /opt/rc/rayctl service add hy2-obfs hy2o > /dev/null
          x /opt/rc/rayctl service add yggdrasil ygg > /dev/null
          # the DNS tunnels, on the container's UDP 53 (the runner's own is systemd-resolved's)
          x /opt/rc/rayctl service add dnstt dns > /dev/null
          # dnsauth-v1 (v0.10.0): unsigned queries are refused, the client signs with the device's key
          x /opt/rc/rayctl service set dns auth=required > /dev/null
          # dnsauth-v2 (raycontrol v0.15): a node that has it takes the hint only, so a v2 tag that failed would not
          # pass as an untagged query; and its name in the subscription
          if x /opt/rc/rayctl service set dns auth_hint=required > /dev/null 2>&1; then
            echo "RAYCONTROL_DNSAUTH_V2=1" >> "$GITHUB_ENV"
          fi
          if x /opt/rc/rayctl node name "Нода interop" > /dev/null 2>&1; then
            echo "RAYCONTROL_NODE_NAME=Нода interop" >> "$GITHUB_ENV"
          fi
          # the node's note (v0.21.0): emoji with a joiner, a flag and right-to-left text, kept as typed
          note='Лимит 100 ГБ 👨‍👩‍👧 🇷🇺 · مرحبا'
          if x /opt/rc/rayctl node note "$note" > /dev/null 2>&1; then
            echo "RAYCONTROL_NODE_NOTE=$note" >> "$GITHUB_ENV"
          fi
          x /opt/rc/rayctl service add masterdns mdns > /dev/null
          # the test CA in place of ACME: REALITY's site, Yggdrasil and hy2-masq take the site's certificate
          x /opt/rc/rayctl service cert site -chain /opt/cert/chain.pem -key /opt/cert/key.pem
          x /opt/rc/rayctl service add hy2-masq hy2m > /dev/null
          x /opt/rc/rayctl user add alice -services reality,hy2o,hy2m,ygg,dns,mdns > /dev/null
          # client summaries (probe-v1 §6): off by default, a node answers 404 to them then
          x /opt/rc/rayctl summary on > /dev/null
          x /opt/rc/rayctl device add alice phone -o /root/phone.bundle
          x cat /root/phone.bundle > /tmp/phone.bundle
          # relay-v1: the remote API the relay takes its perimeter from, the relay r1 and its bundle (root only); the
          # relay's own SSH opens to the runner
          x /opt/rc/rayctl service add api api > /dev/null
          x /opt/rc/rayctl relay add r1 203.0.113.3 > /dev/null
          x /opt/rc/rayctl relay bundle -exit 203.0.113.2 -admin 203.0.113.1/32 -o /root/r1.bundle r1
          x cat /root/r1.bundle > /tmp/r1.bundle
          # v0.10.0: what the front passes on goes to /run/niko/<service>-in/ (S-1), stats stay in /run/niko/<service>/
          for sock in /run/niko/inner/vless.sock /run/niko/site/tls.sock /run/niko/reality-in/reality.sock \
              /run/niko/hy2o/stats.sock /run/niko/hy2m/stats.sock /run/niko/ygg-in/fd.sock \
              /run/niko/dns-in/packet.sock /run/niko/mdns-in/packet.sock; do
            for i in $(seq 150); do x test -S "$sock" && break; sleep 0.2; done
            x test -S "$sock" || { echo "no $sock"; x tail -n 80 /var/log/rayd.log; exit 1; }
          done
          x grep 'supervise: started' /var/log/rayd.log | sed 's/^.*unit=/  /'

      - name: The relay (rayspa run -relay)
        run: |
          # the real rayspa in the relay's role: DNAT and masquerade to the exit for whoever knocked with K_relay
          docker run -d --name rc-relay --network rc-net --ip 203.0.113.3 --cap-add NET_ADMIN \
            --sysctl net.ipv4.ip_forward=1 -v /tmp/rcbin:/opt/rc:ro debian:13 sleep infinity > /dev/null
          r() { docker exec rc-relay "$@"; }
          r sh -c 'apt-get update -qq > /dev/null && apt-get install -y -qq nftables > /dev/null'
          docker cp /tmp/r1.bundle rc-relay:/root/r1.bundle
          r chmod 0600 /root/r1.bundle
          docker exec -d rc-relay sh -c '/opt/rc/rayspa run -relay /root/r1.bundle > /var/log/rayspa.log 2>&1'
          for i in $(seq 150); do r grep -q 'snapshot applied' /var/log/rayspa.log 2>/dev/null && break; sleep 0.2; done
          r grep -q 'snapshot applied' /var/log/rayspa.log || { r cat /var/log/rayspa.log; exit 1; }
          r nft list ruleset | grep -cE 'dnat|masquerade' | sed 's/^/  nat rules: /'
          # R6-c (v0.11.0): the relay's probe endpoint with the same bundle. It logs when it serves; the exit lists
          # relays[].probe once its feed is up, which the client test waits for in the subscription itself
          docker exec -d rc-relay sh -c '/opt/rc/rayd relay -bundle /root/r1.bundle > /var/log/rayd-relay.log 2>&1'
          for i in $(seq 150); do r grep -q 'relay probe endpoint' /var/log/rayd-relay.log 2>/dev/null && break; sleep 0.2; done
          r grep -q 'relay probe endpoint' /var/log/rayd-relay.log || { r cat /var/log/rayd-relay.log; exit 1; }

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: libcore/go.mod
          cache: false
      - name: Through each tunnel and own (libcore)
        working-directory: libcore
        env:
          RAYCONTROL_BUNDLE: /tmp/phone.bundle
          RAYCONTROL_ADDRESS: ${{ steps.node.outputs.address }}
          RAYCONTROL_CA: /tmp/rccert/root.pem
          RAYCONTROL_RELAY: 203.0.113.3
          RAYCONTROL_EXPECT: hysteria2-pin,hysteria2-ca,reality,yggdrasil,dnstt-auth-sealed,masterdns-auth-sealed,relay-subscription,relay-reality,relay-hysteria2-pin,relay-hysteria2-ca,relay-probe,relay-report,report-path,dnsprobe
          # the subscription as the app reads it, for the app's fixture (a CI node's throwaway keys)
          RAYCONTROL_PAYLOAD_OUT: /tmp/raycontrol-payload.json
        run: |
          TAGS=with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_xhttp,with_awg,with_dnstt,with_masterdnsvpn,with_yggdrasil,badlinkname,tfogo_checklinkname0
          go test -count=1 -v -timeout 10m -ldflags=-checklinkname=0 -tags="$TAGS" -run TestRaycontrolTunnelInterop .

      # dnsseal-v1 (v0.13.0): the node's dnstt with seal=required: the sealed profile goes through, the same profile
      # unsealed gets no answer; then its key rotated at once: the client takes the new key from its next
      # subscription, and the key before gets no answer
      - name: dnstt sealed, then its key rotated
        working-directory: libcore
        env:
          RAYCONTROL_BUNDLE: /tmp/phone.bundle
          RAYCONTROL_ADDRESS: ${{ steps.node.outputs.address }}
          RAYCONTROL_CA: /tmp/rccert/root.pem
          RAYCONTROL_ONLY: dnstt-auth-sealed
        run: |
          TAGS=with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_xhttp,with_awg,with_dnstt,with_masterdnsvpn,with_yggdrasil,badlinkname,tfogo_checklinkname0
          docker exec rc-node /opt/rc/rayctl service set dns seal=required
          RAYCONTROL_SEAL_KEY_OUT=/tmp/seal-before RAYCONTROL_SEAL_REFUSED=1 \
            go test -count=1 -v -timeout 5m -ldflags=-checklinkname=0 -tags="$TAGS" -run TestRaycontrolTunnelInterop .
          docker exec rc-node /opt/rc/rayctl service rotate dns -now
          RAYCONTROL_SEAL_KEY_OUT=/tmp/seal-after RAYCONTROL_SEAL_OLD_KEY=/tmp/seal-before \
            go test -count=1 -v -timeout 5m -ldflags=-checklinkname=0 -tags="$TAGS" -run TestRaycontrolTunnelInterop .
          if cmp -s /tmp/seal-before /tmp/seal-after; then echo "the seal key did not change with the rotation"; exit 1; fi

      # mdseal-v1 and dnsauth for masterdns (raycontrol v0.14.0, niko-server v0.11.0): the node's masterdns with seal
      # and auth required: the profile sealed and tagged goes through, the same profile open or untagged gets no
      # answer
      - name: masterdns sealed and tagged, both required
        working-directory: libcore
        env:
          RAYCONTROL_BUNDLE: /tmp/phone.bundle
          RAYCONTROL_ADDRESS: ${{ steps.node.outputs.address }}
          RAYCONTROL_CA: /tmp/rccert/root.pem
          RAYCONTROL_ONLY: masterdns-auth-sealed
          RAYCONTROL_MDNS_REFUSED: "1"
        run: |
          TAGS=with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_xhttp,with_awg,with_dnstt,with_masterdnsvpn,with_yggdrasil,badlinkname,tfogo_checklinkname0
          docker exec rc-node /opt/rc/rayctl service set mdns seal=required
          docker exec rc-node /opt/rc/rayctl service set mdns auth=required
          if [ -n "${RAYCONTROL_DNSAUTH_V2:-}" ]; then docker exec rc-node /opt/rc/rayctl service set mdns auth_hint=required; fi
          RAYCONTROL_MDNS_KEY_OUT=/tmp/mdns-key-1 \
            go test -count=1 -v -timeout 5m -ldflags=-checklinkname=0 -tags="$TAGS" -run TestRaycontrolTunnelInterop .

      # masterdns-key-rotation (raycontrol v0.15.0, niko-server v0.13.0): the service key rotated, the subscription has
      # the new one at once and the profile goes through with it; the key before still carries for the grace, and
      # after a rotation with -now it gets no answer. niko-server reads the key file every 5 s
      - name: masterdns, its service key rotated
        working-directory: libcore
        env:
          RAYCONTROL_BUNDLE: /tmp/phone.bundle
          RAYCONTROL_ADDRESS: ${{ steps.node.outputs.address }}
          RAYCONTROL_CA: /tmp/rccert/root.pem
          RAYCONTROL_ONLY: masterdns-auth-sealed
        run: |
          TAGS=with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_xhttp,with_awg,with_dnstt,with_masterdnsvpn,with_yggdrasil,badlinkname,tfogo_checklinkname0
          if ! docker exec rc-node /opt/rc/rayctl -h 2>&1 | grep -q "masterdns: a new service key"; then
            echo "::notice::this raycontrol does not rotate a masterdns key (v0.15.0 does)"
            exit 0
          fi
          # the backend rereads its key file, the previous key kept for the grace, from niko-server v0.13.0: an older
          # one with this raycontrol is a pin out of step (raycontrol's deploy/versions.env has the release it needs)
          if [ "$(printf '%s\n' v0.13.0 "$NIKO_SERVER_RUNNING" | sort -V | head -1)" != v0.13.0 ]; then
            echo "::error::raycontrol rotates masterdns keys, niko-server $NIKO_SERVER_RUNNING does not reread them (v0.13.0 does): .github/niko-server.env, or the run's niko_server_tag, behind raycontrol"
            exit 1
          fi
          docker exec rc-node /opt/rc/rayctl service rotate mdns
          sleep 6
          RAYCONTROL_MDNS_KEY_OUT=/tmp/mdns-key-2 RAYCONTROL_MDNS_GRACE_KEY=/tmp/mdns-key-1 \
            go test -count=1 -v -timeout 5m -ldflags=-checklinkname=0 -tags="$TAGS" -run TestRaycontrolTunnelInterop .
          docker exec rc-node /opt/rc/rayctl service rotate mdns -now
          sleep 6
          RAYCONTROL_MDNS_OLD_KEY=/tmp/mdns-key-2 \
            go test -count=1 -v -timeout 5m -ldflags=-checklinkname=0 -tags="$TAGS" -run TestRaycontrolTunnelInterop .

      # slipstream-v1 (raycontrol v0.16.0, slipstream-server v0.1.0): the node's slipstream service through the bundled
      # client's linux build at the app's pin, with the arguments the app gives it (its resolver, niko-slip's pin, ALPN
      # and SNI, --dnsauth with K in its environment): the row goes through; without the device's tag, or with another
      # pin, nothing. A user of its own, so the other steps' subscription stays as it was
      - name: slipstream through the app's client
        working-directory: libcore
        env:
          RAYCONTROL_BUNDLE: /tmp/slip.bundle
          RAYCONTROL_ADDRESS: ${{ steps.node.outputs.address }}
          RAYCONTROL_CA: /tmp/rccert/root.pem
          RAYCONTROL_ONLY: slipstream-auth
          RAYCONTROL_SLIPSTREAM_CLIENT: /tmp/slipc/build/slipstream-client
          RAYCONTROL_SLIP_REFUSED: "1"
        run: |
          if [ -z "${RAYCONTROL_SLIPSTREAM:-}" ]; then
            echo "::notice::this rayd has no slipstream service (v0.16.0 does)"
            exit 0
          fi
          TAGS=with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_xhttp,with_awg,with_dnstt,with_masterdnsvpn,with_yggdrasil,badlinkname,tfogo_checklinkname0
          . ../buildScript/lib/slipstream/env.sh
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq cmake ninja-build pkg-config libssl-dev meson > /dev/null
          git init -q /tmp/slipc && git -C /tmp/slipc remote add origin "$REPOSITORY_SLIPSTREAM"
          git -C /tmp/slipc fetch -q --depth 1 origin "$COMMIT_SLIPSTREAM"
          git -C /tmp/slipc checkout -q FETCH_HEAD && git -C /tmp/slipc submodule update -q --init --recursive
          (cd /tmp/slipc && meson setup --buildtype=release --warnlevel=0 build > /dev/null &&
            ninja -C build slipstream-client > /dev/null)
          docker exec rc-node /opt/rc/rayctl service add slipstream slip
          docker exec rc-node /opt/rc/rayctl user add bob -services slip > /dev/null
          docker exec rc-node /opt/rc/rayctl device add bob phone -o /root/bob.bundle
          docker exec rc-node cat /root/bob.bundle > /tmp/slip.bundle
          # dnsauth.v goes by a user's dnstt and masterdns (slipstream signs by v2 always): bob's has none
          RAYCONTROL_DNSAUTH_V2= \
            go test -count=1 -v -timeout 5m -ldflags=-checklinkname=0 -tags="$TAGS" -run TestRaycontrolTunnelInterop .

      # dnszones-v1 (raycontrol v0.14.0): dnstt with a spare zone, the main one cut by the network's resolver, its
      # queries dropped and then answered SERVFAIL: dnsprobe fails in the main zone and passes in the spare, the tunnel
      # goes through the spare and not through the main, the node takes the summary's zone. Another device: a summary
      # is once a day per device and AS
      - name: dnstt through its spare zone, the main one cut
        working-directory: libcore
        env:
          RAYCONTROL_BUNDLE: /tmp/tablet.bundle
          RAYCONTROL_ADDRESS: ${{ steps.node.outputs.address }}
          RAYCONTROL_CA: /tmp/rccert/root.pem
          RAYCONTROL_ONLY: dnstt-auth-sealed
        run: |
          TAGS=with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_xhttp,with_awg,with_dnstt,with_masterdnsvpn,with_yggdrasil,badlinkname,tfogo_checklinkname0
          docker exec rc-node /opt/rc/rayctl service set dns spare_zones=1
          docker exec rc-node /opt/rc/rayctl device add alice tablet -o /root/tablet.bundle
          docker exec rc-node cat /root/tablet.bundle > /tmp/tablet.bundle
          RAYCONTROL_CUT_MAIN=drop RAYCONTROL_ZONE_REPORT=1 RAYCONTROL_SPARE_OUT=/tmp/spare-zone \
            go test -count=1 -v -timeout 8m -ldflags=-checklinkname=0 -tags="$TAGS" -run TestRaycontrolTunnelInterop .
          RAYCONTROL_CUT_MAIN=servfail \
            go test -count=1 -v -timeout 8m -ldflags=-checklinkname=0 -tags="$TAGS" -run TestRaycontrolTunnelInterop .
          # the node's own count of the tagged queries in the spare zone (dnszones-v1 §4): rayd reads the backend's
          # counters every minute
          spare=$(cat /tmp/spare-zone)
          for i in $(seq 20); do
            n=$(docker exec rc-node /opt/rc/rayctl metrics | grep "^raycontrol_dnstt_zone_tagged_total{" | grep "zone=\"$spare\"" | awk '{print $2}')
            [ -n "$n" ] && [ "${n%.*}" -gt 0 ] && break
            sleep 6
          done
          docker exec rc-node /opt/rc/rayctl metrics | grep -E "^raycontrol_dnstt_(zone_tagged|auth|seal)_total" || true
          docker exec rc-node /opt/rc/rayctl status | grep -E "dnstt|dns-front|dns-zone" || true
          [ -n "$n" ] && [ "${n%.*}" -gt 0 ] || { echo "no tagged query counted in the spare zone $spare"; exit 1; }

      # app-update-v1 (raycontrol v0.18.0): the node's mirror of the app's releases, from a GitHub of the test's own
      # on the runner, a release signed by the test's key: the subscription names it, its files come the app's way
      # (RaycontrolAppFile: SPA, the pin, RC1), signed for "niko <tag>", the APK as SHA256SUMS says; a download cut
      # short goes on from its part, another file's part is replaced whole, a name or a release not held is the 404
      - name: The app's release from the node's mirror
        working-directory: libcore
        env:
          RAYCONTROL_BUNDLE: /tmp/phone.bundle
          RAYCONTROL_ADDRESS: ${{ steps.node.outputs.address }}
          RAYCONTROL_APP_TAG: v9.9.9
        run: |
          if [ -z "${RAYCONTROL_APP_MIRROR:-}" ]; then
            echo "::notice::this rayd has no mirror of the app's releases (v0.18.0 does)"
            exit 0
          fi
          TAGS=with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_xhttp,with_awg,with_dnstt,with_masterdnsvpn,with_yggdrasil,badlinkname,tfogo_checklinkname0
          # the release: four APKs of random bytes (the app checks hashes, not what an APK holds), the list signed
          rel=/tmp/apprel/www
          mkdir -p "$rel/dl" "$rel/repos/arngory/niko"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            head -c $((3 << 20)) /dev/urandom > "$rel/dl/Niko-9.9.9-$abi.apk"
          done
          (cd "$rel/dl" && sha256sum Niko-9.9.9-*.apk > SHA256SUMS)
          minisign -S -s /tmp/appkey/test.key -m "$rel/dl/SHA256SUMS" -t "niko $RAYCONTROL_APP_TAG" < /dev/null > /dev/null
          python3 -I - "$rel" "$RAYCONTROL_APP_TAG" <<'PY'
          import json, os, sys
          rel, tag = sys.argv[1:]
          names = sorted(os.listdir(os.path.join(rel, "dl")))
          assets = [{"name": n, "size": os.path.getsize(os.path.join(rel, "dl", n)),
                     "browser_download_url": "http://203.0.113.1:8091/dl/" + n} for n in names]
          with open(os.path.join(rel, "repos/arngory/niko/releases"), "w") as f:
              json.dump([{"tag_name": tag, "draft": False, "prerelease": "-" in tag, "assets": assets}], f)
          PY
          nohup python3 -I -m http.server 8091 --bind 203.0.113.1 --directory "$rel" > /tmp/apprel.log 2>&1 &
          sleep 1
          docker exec rc-node /opt/rc/rayctl app-mirror on
          for i in $(seq 60); do
            docker exec rc-node /opt/rc/rayctl app-mirror | grep -q "$RAYCONTROL_APP_TAG" && break
            sleep 2
          done
          docker exec rc-node /opt/rc/rayctl app-mirror
          RAYCONTROL_APP_KEY=$(sed -n 2p /tmp/appkey/test.pub) \
            go test -count=1 -v -timeout 5m -ldflags=-checklinkname=0 -tags="$TAGS" -run TestRaycontrolAppMirror .

      # lan-v1 (v0.23.0, niko-server v0.16.0): alice's phone and laptop show themselves and reach a port the other
      # opened through the node, on its 127.0.0.1, and nothing the other did not list (the client's filter); carol's
      # device, shown on a LAN of her own, does not reach the laptop even where it lets every flow in (the node's
      # filter); lan_relay=0 closes the path; the laptop that hides leaves the phone's list
      - name: The user's devices on the node's Yggdrasil
        working-directory: libcore
        env:
          RAYCONTROL_BUNDLE: /tmp/phone.bundle
          RAYCONTROL_LAN_BUNDLE: /tmp/laptop.bundle
          RAYCONTROL_LAN_STRANGER: /tmp/carol.bundle
          RAYCONTROL_LAN_STRANGER_USER: carol
          RAYCONTROL_ADDRESS: ${{ steps.node.outputs.address }}
          RAYCONTROL_CA: /tmp/rccert/root.pem
          RAYCONTROL_RAYCTL: docker exec rc-node /opt/rc/rayctl
          RAYCONTROL_USER: alice
          RAYCONTROL_LAN_SERVICE: ygg
        run: |
          if ! grep -q 'case "lan":' ../raycontrol/cmd/rayctl/main.go; then
            echo "::notice::this rayctl has no user lan (v0.23.0 does)"
            exit 0
          fi
          TAGS=with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_xhttp,with_awg,with_dnstt,with_masterdnsvpn,with_yggdrasil,badlinkname,tfogo_checklinkname0
          docker exec rc-node /opt/rc/rayctl device add alice laptop -o /root/laptop.bundle
          docker exec rc-node cat /root/laptop.bundle > /tmp/laptop.bundle
          docker exec rc-node /opt/rc/rayctl user add carol -services ygg > /dev/null
          docker exec rc-node /opt/rc/rayctl device add carol phone -o /root/carol.bundle
          docker exec rc-node cat /root/carol.bundle > /tmp/carol.bundle
          go test -count=1 -v -timeout 20m -ldflags=-checklinkname=0 -tags="$TAGS" -run TestRaycontrolLAN . || {
            docker exec rc-node /opt/rc/rayctl device list alice || true
            docker exec rc-node sh -c 'grep -iE "ygg|lan" /var/log/rayd.log | tail -n 40' || true
            exit 1
          }

      # traffic-limit-v1 (v0.22.0): a limit announced; set below what alice used, her Hysteria2 session is cut and the
      # subscription answers exhausted with no profiles; reset-usage brings them back. Last: it cuts her sessions
      - name: The user's traffic limit
        working-directory: libcore
        env:
          RAYCONTROL_BUNDLE: /tmp/phone.bundle
          RAYCONTROL_ADDRESS: ${{ steps.node.outputs.address }}
          RAYCONTROL_CA: /tmp/rccert/root.pem
          RAYCONTROL_RAYCTL: docker exec rc-node /opt/rc/rayctl
          RAYCONTROL_USER: alice
        run: |
          if ! grep -q '"reset-usage"' ../raycontrol/cmd/rayctl/main.go; then
            echo "::notice::this raycontrol has no traffic limit (v0.22.0 does)"
            exit 0
          fi
          TAGS=with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_xhttp,with_awg,with_dnstt,with_masterdnsvpn,with_yggdrasil,badlinkname,tfogo_checklinkname0
          go test -count=1 -v -timeout 10m -ldflags=-checklinkname=0 -tags="$TAGS" -run TestRaycontrolTrafficLimit .

      - name: The subscription as the app reads it
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: raycontrol-payload
          path: /tmp/raycontrol-payload.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Logs
        if: always()
        run: |
          docker exec rc-node tail -n 120 /var/log/rayd.log || true
          echo "--- relay"; docker exec rc-relay tail -n 60 /var/log/rayspa.log || true
          echo "--- relay probe (rayd relay)"; docker exec rc-relay tail -n 40 /var/log/rayd-relay.log || true
          docker exec rc-relay nft list ruleset 2>/dev/null | tail -n 60 || true
          docker rm -f rc-node rc-relay > /dev/null 2>&1 || true

  naive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch raycontrol
        run: |
          . .github/raycontrol.env
          COMMIT_RAYCONTROL=${RAYCONTROL_COMMIT_OVERRIDE:-$COMMIT_RAYCONTROL}
          git clone --filter=blob:none "$REPOSITORY_RAYCONTROL" raycontrol
          git -C raycontrol checkout -q "$COMMIT_RAYCONTROL"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: raycontrol/go.mod
          cache: false
      - name: Build rayd
        working-directory: raycontrol
        run: CGO_ENABLED=0 go build -o /tmp/rayd ./cmd/rayd

      - name: The core's naive outbound (cronet)
        run: |
          . buildScript/lib/core/get_source_env.sh
          git clone --filter=blob:none "$REPOSITORY_SING_BOX" /tmp/sing-box-src
          git -C /tmp/sing-box-src checkout -q "$COMMIT_SING_BOX"
          sudo apt-get install -y -qq lld > /dev/null
          cd /tmp/sing-box-src
          # cronet's static library links with clang and lld: the system ld refuses its objects
          CC=clang CXX=clang++ CGO_LDFLAGS=-fuse-ld=lld CGO_ENABLED=1 GOTOOLCHAIN=auto go build -o /tmp/sing-box \
            -ldflags=-checklinkname=0 -tags=with_naive_outbound,with_gvisor,badlinkname,tfogo_checklinkname0 ./cmd/sing-box
          /tmp/sing-box version | head -1

      - name: NaiveProxy client and the niko-server front
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . .github/raycontrol.env
          COMMIT_RAYCONTROL=${RAYCONTROL_COMMIT_OVERRIDE:-$COMMIT_RAYCONTROL}
          . .github/niko-server.env
          NIKO_SERVER_TAG=${NIKO_SERVER_TAG_OVERRIDE:-$NIKO_SERVER_TAG}
          NIKO_SERVER_SHA256_AMD64=${NIKO_SERVER_SHA256_OVERRIDE:-$NIKO_SERVER_SHA256_AMD64}
          sudo apt-get install -y -qq strace > /dev/null
          # rayd naive takes its connections from the node's front (raycontrol niko-mux-note.md §3), as in production
          curl -fsSL --retry 3 -o /tmp/niko-server "$NIKO_SERVER_RELEASES/download/$NIKO_SERVER_TAG/niko-server-linux-amd64"
          echo "$NIKO_SERVER_SHA256_AMD64  /tmp/niko-server" | sha256sum -c -
          chmod +x /tmp/niko-server
          tag=$(gh release list -R klzgrad/naiveproxy -L 100 --json tagName -q '.[].tagName' | grep -m1 "^v${NAIVE_CHROMIUM}-")
          [ -n "$tag" ] || { echo "no NaiveProxy release for Chromium $NAIVE_CHROMIUM"; exit 1; }
          gh release download "$tag" -R klzgrad/naiveproxy -p "naiveproxy-${tag}-linux-x64.tar.xz" -D /tmp
          tar -xJf /tmp/naiveproxy-${tag}-linux-x64.tar.xz -C /tmp
          mv /tmp/naiveproxy-${tag}-linux-x64/naive /tmp/naive
          echo "NaiveProxy $tag: $(sha256sum /tmp/naive | cut -d' ' -f1)"

      - name: rayd naive behind the front and TLS, a CA the client trusts
        run: |
          cd /tmp
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 30 -subj "/CN=interop CA" \
            -keyout ca.key -out ca.crt -addext "basicConstraints=critical,CA:TRUE" 2>/dev/null
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -subj "/CN=naive.test" -keyout leaf.key -out leaf.csr 2>/dev/null
          printf "subjectAltName=DNS:naive.test\nbasicConstraints=CA:FALSE\n" > leaf.ext
          openssl x509 -req -in leaf.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 30 -extfile leaf.ext -out leaf.crt 2>/dev/null
          pw=$(openssl rand -hex 16); echo "$pw" > /tmp/naive.pw
          printf '["%s"]' "$(printf %s "$pw" | sha256sum | cut -d' ' -f1)" > users.json
          # the order of raycontrol's TestRealitySelfStealWithXray: rayd naive takes the front's sockets (mode fd
          # for TCP 443, mode packet for QUIC), then the front routes naive.test to it on a test port
          uid=$(id -u); mkdir -p /tmp/run/naive && chmod 0710 /tmp/run/naive
          # rayd naive logs a failed dial to the destination at debug only. strace shows its dials: Go connects
          # non-blocking (EINPROGRESS), the outcome is the SO_ERROR of the getsockopt that follows
          # icmp-v1 (raycontrol v0.21.0): rayd naive pings for the client from ICMP datagram sockets, which the
          # runner's group must be allowed
          icmp=""
          if grep -q 'fs.Bool("icmp"' "$GITHUB_WORKSPACE/raycontrol/cmd/rayd/main.go"; then
            icmp=-icmp
            echo "RAYD_ICMP=1" >> "$GITHUB_ENV"
            sudo sysctl -q -w net.ipv4.ping_group_range="0 2147483647"
          fi
          nohup strace -f -tt -e trace=connect,getsockopt -o /tmp/rayd-naive.strace \
            /tmp/rayd naive -users users.json -chain leaf.crt -key leaf.key -front-uid "$uid" $icmp \
              -socket /tmp/run/naive/fd.sock -quic-socket /tmp/run/naive/packet.sock > /tmp/naive-server.log 2>&1 &
          for i in $(seq 50); do [ -S /tmp/run/naive/fd.sock ] && [ -S /tmp/run/naive/packet.sock ] && break; sleep 0.2; done
          jq -n --arg uid "$uid" '{schema: 1, role: "front", log: {level: "info"},
            tcp: {listen: ["127.0.0.1:18446"], routes: [{sni: ["naive.test"], backend: "naive"}]},
            udp: {listen: ["127.0.0.1:18446"], routes: [{sni: ["naive.test"], backend: "naive-quic"}]},
            backends: {naive: {socket: "/tmp/run/naive/fd.sock", mode: "fd", uid: ($uid | tonumber)},
                       "naive-quic": {socket: "/tmp/run/naive/packet.sock", mode: "packet", uid: ($uid | tonumber)}}}' > front.json
          /tmp/niko-server check -c front.json --json
          nohup /tmp/niko-server front -c front.json > /tmp/front.log 2>&1 &
          sleep 1

      - name: Interop
        run: |
          pw=$(cat /tmp/naive.pw)
          # NaiveProxy on Linux reads its roots from the system store, not NSS (use_nss_certs=false): SSL_CERT_FILE
          # replaces it, for naive only; curl checks the destination's certificate through the tunnel itself
          SSL_CERT_FILE=/tmp/ca.crt nohup /tmp/naive --listen=socks://127.0.0.1:11090 --proxy="https://niko:${pw}@naive.test:18446" \
            --host-resolver-rules="MAP naive.test 127.0.0.1" --log --log-net-log=/tmp/naive-net.json > /tmp/naive-client.log 2>&1 &
          SSL_CERT_FILE=/tmp/ca.crt nohup /tmp/naive --listen=socks://127.0.0.1:11091 --proxy="https://niko:wrong@naive.test:18446" \
            --host-resolver-rules="MAP naive.test 127.0.0.1" --log --log-net-log=/tmp/naive-wrong-net.json > /tmp/naive-wrong.log 2>&1 &
          # naive-quic (naive+quic:// in raycontrol's links): the same name and credentials over UDP 443 of the front
          SSL_CERT_FILE=/tmp/ca.crt nohup /tmp/naive --listen=socks://127.0.0.1:11092 --proxy="quic://niko:${pw}@naive.test:18446" \
            --host-resolver-rules="MAP naive.test 127.0.0.1" --log > /tmp/naive-quic.log 2>&1 &
          # the core's naive outbound, as the app builds it (fmt/naive/NaiveFmt.kt): h2, a wrong password, QUIC;
          # and UDP over TCP v2 (uot=2 in raycontrol's links, udp_over_tcp: true as ConfigBuilder writes it): a DNS
          # query to 11096 goes to 1.1.1.1:53 through rayd naive, and to 11097 through naive without it (dropped)
          tls='{"enabled": true, "server_name": "naive.test", "certificate_path": "/tmp/ca.crt"}'
          jq -n --arg pw "$pw" --argjson tls "$tls" '{log: {level: "debug"},
            inbounds: [{type: "socks", tag: "h2", listen: "127.0.0.1", listen_port: 11093},
                       {type: "socks", tag: "wrong", listen: "127.0.0.1", listen_port: 11094},
                       {type: "socks", tag: "quic", listen: "127.0.0.1", listen_port: 11095},
                       {type: "direct", tag: "uot", listen: "127.0.0.1", listen_port: 11096, network: "udp",
                        override_address: "1.1.1.1", override_port: 53},
                       {type: "direct", tag: "no-uot", listen: "127.0.0.1", listen_port: 11097, network: "udp",
                        override_address: "1.1.1.1", override_port: 53}],
            outbounds: [{type: "naive", tag: "naive", server: "127.0.0.1", server_port: 18446, username: "niko", password: $pw, tls: $tls},
                        {type: "naive", tag: "naive-wrong", server: "127.0.0.1", server_port: 18446, username: "niko", password: "wrong", tls: $tls},
                        {type: "naive", tag: "naive-quic", server: "127.0.0.1", server_port: 18446, username: "niko", password: $pw, quic: true, tls: $tls},
                        {type: "naive", tag: "naive-uot", server: "127.0.0.1", server_port: 18446, username: "niko", password: $pw,
                         udp_over_tcp: true, tls: $tls}],
            route: {rules: [{inbound: ["wrong"], outbound: "naive-wrong"}, {inbound: ["quic"], outbound: "naive-quic"},
                            {inbound: ["uot"], outbound: "naive-uot"}], final: "naive"}}' > /tmp/core-naive.json
          nohup /tmp/sing-box run -c /tmp/core-naive.json > /tmp/core-naive.log 2>&1 &
          for i in $(seq 75); do
            [ -n "$(ss -Hltn 'sport = :11090')" ] && [ -n "$(ss -Hltn 'sport = :11091')" ] && [ -n "$(ss -Hltn 'sport = :11092')" ] &&
              [ -n "$(ss -Hltn 'sport = :11093')" ] && [ -n "$(ss -Hltn 'sport = :11094')" ] &&
              [ -n "$(ss -Hltn 'sport = :11095')" ] && [ -n "$(ss -Hlun 'sport = :11096')" ] && break
            sleep 0.2
          done
          fail=0
          # curl's own error and exit code go to the log: a 000 alone does not say whether SOCKS, the tunnel or TLS
          # failed. Exit 7 (no proxy to connect to) fails every check: a refused tunnel must come from naive itself.
          probe() {
            local rc=0
            curl -sS -m 30 -o /dev/null -w '%{http_code}' -x "socks5h://127.0.0.1:$1" https://www.gstatic.com/generate_204 \
              2>"/tmp/curl-$1.err" || rc=$?
            echo "$rc" > "/tmp/curl-$1.rc"
          }
          check() {
            got=$(probe "$2"); rc=$(cat "/tmp/curl-$2.rc"); echo "$1: $got, curl exit $rc (want $3)"
            if [ -s "/tmp/curl-$2.err" ]; then sed 's/^/    curl: /' "/tmp/curl-$2.err"; fi
            [ "$got" = "$3" ] && [ "$rc" != 7 ] || fail=1
          }
          check "NaiveProxy (h2, padding) -> rayd naive" 11090 204
          check "wrong password (must fail: 404 on CONNECT)" 11091 000
          check "NaiveProxy over QUIC (naive-quic) -> front UDP -> rayd naive" 11092 204
          check "core naive outbound (cronet, h2) -> rayd naive" 11093 204
          check "core naive outbound, wrong password (must fail)" 11094 000
          check "core naive outbound over QUIC -> front UDP -> rayd naive" 11095 204
          udp() { got=$(python3 -I .github/scripts/udp-dns-probe.py "$2"); echo "$1: $got (want $3)"; [ "$got" = "$3" ] || fail=1; }
          if [ -f raycontrol/internal/naive/uot.go ]; then
            udp "core naive outbound, UDP over TCP v2 -> rayd naive -> 1.1.1.1:53" 11096 answer
          else
            echo "UDP over TCP: raycontrol $(git -C raycontrol rev-parse --short HEAD) has no UoT in rayd naive (since v0.20.0), not checked"
          fi
          udp "core naive outbound without UDP over TCP (UDP must not pass)" 11097 timeout
          # curl sees only that the tunnel failed (a 404, a reset and a hang all read 000): the CONNECT's own answer
          # comes from the clients' net logs. naive writes them in batches of 15 events, so a few more tries push
          # the first ones out; a CONNECT counts only with an answer to every request of its source
          for i in 1 2 3 4; do
            for port in 11090 11091; do curl -s -m 5 -o /dev/null -x "socks5h://127.0.0.1:$port" https://www.gstatic.com/generate_204 || true; done
          done
          sleep 1
          python3 .github/scripts/netlog-errors.py --connect 200 /tmp/naive-net.json || fail=1
          python3 .github/scripts/netlog-errors.py --connect 404 /tmp/naive-wrong-net.json || fail=1
          # ping through the node (icmp-v1, the core's naive `icmp`): a TUN of the core's takes only nobody's traffic;
          # nobody's ping goes into it, the naive outbound carries the echo to rayd naive, which pings for it
          if [ -n "${RAYD_ICMP:-}" ]; then
            jq -n --arg pw "$pw" --argjson tls "$tls" '{log: {level: "debug"},
              inbounds: [{type: "tun", tag: "tun-in", interface_name: "nikotun", address: ["172.19.0.1/30"], mtu: 9000,
                          auto_route: true, include_uid: [65534], stack: "gvisor"}],
              outbounds: [{type: "naive", tag: "naive-icmp", server: "127.0.0.1", server_port: 18446, username: "niko",
                           password: $pw, icmp: true, tls: $tls}],
              route: {final: "naive-icmp", auto_detect_interface: true}}' > /tmp/core-icmp.json
            sudo nohup /tmp/sing-box run -c /tmp/core-icmp.json > /tmp/core-icmp.log 2>&1 &
            for i in $(seq 50); do ip link show nikotun > /dev/null 2>&1 && break; sleep 0.2; done
            sleep 1
            nobody() { sudo -u nobody "$@" 2>&1 || true; }
            # the runner's ICMP does not leave Azure: a network of its own behind the node instead, a router
            # (192.0.2.254) and a host behind it (198.51.100.2), test addresses the node takes for public
            ns() { sudo ip netns exec "$@"; }
            sudo ip netns add rtr; sudo ip netns add far
            sudo ip link add vr0 type veth peer name vr1 netns rtr
            sudo ip link add vf0 netns rtr type veth peer name vf1 netns far
            sudo ip addr add 192.0.2.1/24 dev vr0; sudo ip link set vr0 up
            ns rtr ip addr add 192.0.2.254/24 dev vr1; ns rtr ip addr add 198.51.100.254/24 dev vf0
            ns rtr ip link set vr1 up; ns rtr ip link set vf0 up; ns rtr ip link set lo up
            ns rtr sysctl -q -w net.ipv4.ip_forward=1
            ns far ip addr add 198.51.100.2/24 dev vf1; ns far ip link set vf1 up; ns far ip link set lo up
            ns far ip route add default via 198.51.100.254
            # the way there for rayd (the runner's uid) only: a route in main would take nobody's ping past the TUN
            # (auto_route lets main's specific routes go first)
            sudo ip route add 198.51.100.0/24 via 192.0.2.254 table 100
            sudo ip rule add uidrange "$(id -u)-$(id -u)" lookup 100 priority 100
            out=$(nobody ping -n -c 3 -W 5 198.51.100.2); echo "$out" | sed 's/^/    /'
            echo "$out" | grep -q "bytes from 198.51.100.2" && echo "ping through the node: answered" ||
              { echo "ping through the node: no answer"; fail=1; }
            grep -q "forward icmp connection .* to 198.51.100.2 via outbound/naive" /tmp/core-icmp.log &&
              echo "the echo went through the core's naive" || { echo "the echo did not go through the core's naive"; fail=1; }
            # TTL 1 dies at the router behind the node: time exceeded from it, where the phone's own stack would
            # answer from the destination
            out=$(nobody ping -n -c 2 -W 5 -t 1 198.51.100.2); echo "$out" | sed 's/^/    /'
            echo "$out" | grep -q "From 192.0.2.254.*Time to live exceeded" && echo "TTL 1: time exceeded from the router" ||
              { echo "TTL 1: no time exceeded from the router"; fail=1; }
            # a destination the node does not ping: administratively prohibited, at once
            out=$(nobody ping -n -c 1 -W 5 10.0.0.1); echo "$out" | sed 's/^/    /'
            echo "$out" | grep -qi "filtered\|prohibited" && echo "a private destination: prohibited" ||
              { echo "a private destination: not refused"; fail=1; }
            # longer than the node carries, with DF: too big at 1480
            out=$(nobody ping -n -c 2 -W 5 -M do -s 1473 198.51.100.2); echo "$out" | sed 's/^/    /'
            echo "$out" | grep -q "mtu = 1480\|mtu=1480" && echo "too big: 1480" ||
              { echo "too big: no MTU 1480"; fail=1; }
            # conn-limit-v1 (raycontrol v0.24.0, §3.1): a user in debt for failed dials gets 429 to CONNECT in place of
            # the 200. 160 dials to a closed port of the host behind the node, each refused and paid for (the reserve
            # is 100, 5 a second come back); the core's log then names the status the app reads as the node's limit
            # (RayTestFindings: Cause.LIMIT, not a broken profile), and with the debt paid the same profile carries on
            if [ -f raycontrol/internal/naive/limits.go ]; then
              seq 160 | xargs -P 40 -I{} curl -s -m 10 -o /dev/null -x socks5h://127.0.0.1:11093 http://198.51.100.2:9/ || true
              curl -s -m 10 -o /dev/null -x socks5h://127.0.0.1:11093 https://www.gstatic.com/generate_204 || true
              sleep 1
              if grep -q "response status: 429" /tmp/core-naive.log; then
                echo "the limit of failed dials: 429, $(grep -c "response status: 429" /tmp/core-naive.log) lines in the core's log"
              else
                echo "the limit of failed dials: no 429 in the core's log"; fail=1
              fi
              got=000
              for i in $(seq 15); do
                got=$(probe 11093); [ "$got" = 204 ] && break
                sleep 2
              done
              echo "after the limit: $got (want 204)"; [ "$got" = 204 ] || fail=1
            else
              echo "the limit of connections: raycontrol $(git -C raycontrol rev-parse --short HEAD) has none in rayd naive (from v0.24.0), not checked"
            fi
          else
            echo "ping through the node: raycontrol $(git -C raycontrol rev-parse --short HEAD) has no icmp-v1 (from v0.21.0), not checked"
          fi
          exit $fail

      - name: Logs
        if: always()
        run: |
          for f in front naive-server naive-client naive-wrong naive-quic core-naive core-icmp; do echo "--- $f"; tail -n 30 /tmp/$f.log 2>/dev/null || true; done
          # the client's network errors (certificate, TLS, proxy): the --log output has none of them. naive writes
          # its net log in batches of 15 events and never at exit: a few more tries push the last ones out
          for i in 1 2 3 4; do curl -s -m 5 -o /dev/null -x socks5h://127.0.0.1:11090 https://www.gstatic.com/generate_204 || true; done
          sleep 1
          echo "--- client net log errors"
          python3 .github/scripts/netlog-errors.py /tmp/naive-net.json 'TUNNEL|RST_STREAM|GOAWAY|HTTP2_STREAM_ERROR|SEND_REQUEST_HEADERS|READ_RESPONSE_HEADERS|NAIVE|HTTP2_SESSION_RECV_DATA|HTTP2_SESSION_SEND_DATA|RECV_RST|STREAM_CLOSE' || true
          echo "--- rayd naive dials (strace: connect, then SO_ERROR)"
          grep -E 'connect\(|SO_ERROR' /tmp/rayd-naive.strace | grep -v 'AF_UNIX' | tail -n 30 || true
          pkill -x rayd || true; pkill -x naive || true; pkill -x niko-server || true; sudo pkill -x sing-box || true
