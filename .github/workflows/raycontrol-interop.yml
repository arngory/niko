name: raycontrol interop

# The client side against a real rayd from arngory/raycontrol (niko-r3-note.md §4):
# registration by invite through the remote API (libcore/rayapi), and the
# NaiveProxy client against `rayd naive` behind the niko-server front, over h2
# (TCP 443) and QUIC (UDP 443).
on:
  push:
    paths:
      - ".github/workflows/raycontrol-interop.yml"
      - ".github/raycontrol.env"
      - ".github/niko-server.env"
      - ".github/scripts/netlog-errors.py"
      - "libcore/rayapi/**"
      - "libcore/rayprobe/**"
      - "libcore/raysub/**"
      - "libcore/probe/**"
      - "libcore/knock/**"
      - "libcore/rayprobe_box.go"
      - "libcore/raycontrol_tunnel_interop_test.go"
      - ".github/xray-interop.env"
      - "buildScript/lib/core/get_source_env.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch raycontrol and the core
        run: |
          . .github/raycontrol.env
          . buildScript/lib/core/get_source_env.sh
          git clone --filter=blob:none "$REPOSITORY_RAYCONTROL" raycontrol
          git -C raycontrol checkout -q "$COMMIT_RAYCONTROL"
          # libcore/go.mod replaces the core with ../../sing-box and ../../libneko
          git clone --filter=blob:none "$REPOSITORY_SING_BOX" ../sing-box
          git -C ../sing-box checkout -q "$COMMIT_SING_BOX"
          git clone --filter=blob:none "$REPOSITORY_LIBNEKO" ../libneko
          git -C ../libneko checkout -q "$COMMIT_LIBNEKO"

      - uses: actions/setup-go@v5
        with:
          go-version-file: raycontrol/go.mod
          cache: false
      - name: Build rayd and rayctl
        working-directory: raycontrol
        run: |
          CGO_ENABLED=0 go build -o /tmp/rayd ./cmd/rayd
          CGO_ENABLED=0 go build -o /tmp/rayctl ./cmd/rayctl

      # the runner's addresses are private: a test AS database (raycontrol's test/install/asndb) puts them in an AS,
      # so ten reports from here give a hint (probe-v1.md §6.2)
      - name: A test AS database
        working-directory: raycontrol
        run: |
          go run ./test/install/asndb -o /tmp/asn-test.mmdb 0.0.0.0/0
          sudo install -d -m 755 /var/lib/raycontrol
          sudo install -m 644 /tmp/asn-test.mmdb /var/lib/raycontrol/asn.mmdb

      - name: A node with the remote API
        run: |
          mkdir -p /tmp/rc/rendered
          /tmp/rayd init -db /tmp/rc/rayd.db -host 127.0.0.1
          # no perimeter here (rayspa, nftables): the API port is open without SPA; the client still sends SPA
          nohup /tmp/rayd serve -db /tmp/rc/rayd.db -socket /tmp/rc/rayd.sock -group "$(id -gn)" \
            -live=false -acme-directory "" -rendered /tmp/rc/rendered > /tmp/rayd.log 2>&1 &
          for i in $(seq 100); do [ -S /tmp/rc/rayd.sock ] && break; sleep 0.2; done
          rc() { /tmp/rayctl -socket /tmp/rc/rayd.sock "$@"; }
          rc service add api api
          # a service with a profile in the subscription (the hints are for those), without a domain
          rc service add hy2-obfs hy2-obfs
          rc user add interop
          rc device invite interop phone -role admin -o /tmp/rc/invite
          rc service list
          # the API listener follows the change
          sleep 2
          grep -q "remote api" /tmp/rayd.log && grep "remote api" /tmp/rayd.log | tail -2

      - uses: actions/setup-go@v5
        with:
          go-version-file: libcore/go.mod
          cache: false
      - name: Register, admin calls, key rotation (libcore/rayapi)
        working-directory: libcore
        env:
          RAYCONTROL_INVITE_FILE: /tmp/rc/invite
          RAYCONTROL_HINTS: "1"
        run: go test -count=1 -v -ldflags=-checklinkname=0 -run TestRaycontrolInterop ./rayapi

      - name: Logs
        if: always()
        run: |
          tail -n 60 /tmp/rayd.log || true
          pkill -x rayd || true

  # hy2-obfs as rayd renders it: a niko-server backend (options.probe, stats_socket) behind its front, run from the
  # rendered files as the node's units would; the client measures through the tunnel and finds its own session in link
  hysteria:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch raycontrol and the core
        run: |
          . .github/raycontrol.env
          . buildScript/lib/core/get_source_env.sh
          git clone --filter=blob:none "$REPOSITORY_RAYCONTROL" raycontrol
          git -C raycontrol checkout -q "$COMMIT_RAYCONTROL"
          git clone --filter=blob:none "$REPOSITORY_SING_BOX" ../sing-box
          git -C ../sing-box checkout -q "$COMMIT_SING_BOX"
          git clone --filter=blob:none "$REPOSITORY_LIBNEKO" ../libneko
          git -C ../libneko checkout -q "$COMMIT_LIBNEKO"
          . .github/xray-interop.env
          git clone --filter=blob:none "$REPOSITORY_XRAY" xray
          git -C xray checkout -q "$COMMIT_XRAY"

      - uses: actions/setup-go@v5
        with:
          go-version-file: raycontrol/go.mod
          cache: false
      - name: Build rayd, rayctl and Xray
        run: |
          (cd raycontrol && CGO_ENABLED=0 go build -o /tmp/rayd ./cmd/rayd && CGO_ENABLED=0 go build -o /tmp/rayctl ./cmd/rayctl)
          (cd xray && CGO_ENABLED=0 go build -o /tmp/xray -trimpath ./main) && /tmp/xray version | head -1

      - name: niko-server
        run: |
          . .github/niko-server.env
          curl -fsSL --retry 3 -o /tmp/niko-server "$NIKO_SERVER_RELEASES/download/$NIKO_SERVER_TAG/niko-server-linux-amd64"
          echo "$NIKO_SERVER_SHA256_AMD64  /tmp/niko-server" | sha256sum -c -
          chmod +x /tmp/niko-server

      - name: A node with hy2-obfs and a DNS tunnel; the processes from the rendered files
        id: node
        run: |
          mkdir -p /tmp/rc/rendered
          # a domain: the DNS tunnel's zone is under it, and with the tunnel comes the inner stage
          /tmp/rayd init -db /tmp/rc/rayd.db -host 127.0.0.1 -domain interop.test
          # the Hysteria2 sockets (packet, stats) live under /run/niko on a node (render.DefaultPaths.Run), where
          # rayd asks the backends for link
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0755 /run/niko /run/niko/hy2-obfs
          # -live (the default): rayd renders the data plane; without systemd it only warns about the units
          nohup /tmp/rayd serve -db /tmp/rc/rayd.db -socket /tmp/rc/rayd.sock -group "$(id -gn)" \
            -acme-directory "" -rendered /tmp/rc/rendered > /tmp/rayd.log 2>&1 &
          for i in $(seq 100); do [ -S /tmp/rc/rayd.sock ] && break; sleep 0.2; done
          rc() { /tmp/rayctl -socket /tmp/rc/rayd.sock "$@"; }
          rc service add hy2-obfs hy2-obfs
          rc service add dnstt dns
          rc user add interop -services hy2-obfs,dns
          rc device add interop phone -o /tmp/rc/phone.bundle
          D=/tmp/rc/rendered/hy2-obfs
          for i in $(seq 100); do
            [ -f $D/backend.json ] && jq -e '.users | length > 0' $D/users.json > /dev/null 2>&1 && break; sleep 0.2
          done
          jq '{kind, socket, stats_socket, options: (.options | del(.obfs_password_file))}' $D/backend.json
          # what the unit's systemd does: the credentials into its runtime directory; the front as this user
          cp $D/key.pem $D/salamander /run/niko/hy2-obfs/
          uid=$(id -u)
          jq --arg uid "$uid" '.front_uid = ($uid | tonumber) | .log.level = "info"' $D/backend.json > /tmp/h2o.json
          own=$(ip -4 route get 1.1.1.1 | awk '{for (i = 1; i < NF; i++) if ($i == "src") print $(i + 1)}')
          echo "address=$own" >> "$GITHUB_OUTPUT"
          jq -n --arg uid "$uid" --arg own "$own" --arg pw "$D/salamander" '{schema: 1, role: "front", log: {level: "info"},
            backends: {h2o: {socket: "/run/niko/hy2-obfs/packet.sock", mode: "packet", uid: ($uid | tonumber)}},
            udp: {listen: [($own + ":18443")], routes: [{salamander_password_file: $pw, backend: "h2o"}]}}' > /tmp/front.json
          /tmp/niko-server check -c /tmp/h2o.json --json
          /tmp/niko-server check -c /tmp/front.json --json
          nohup /tmp/niko-server backend -c /tmp/h2o.json > /tmp/h2o.log 2>&1 &
          for i in $(seq 50); do [ -S /run/niko/hy2-obfs/packet.sock ] && [ -S /run/niko/hy2-obfs/stats.sock ] && break; sleep 0.2; done
          nohup /tmp/niko-server front -c /tmp/front.json > /tmp/front.log 2>&1 &
          # the inner stage as rendered (VLESS ML-KEM-768, the probe name's route to the subscription endpoint), its
          # inbound on TCP for a client here instead of the DNS tunnel's socket, without the API socket
          I=/tmp/rc/rendered/inner
          for i in $(seq 100); do [ -f $I/xray.json ] && break; sleep 0.2; done
          jq '.inbounds[0].listen = "127.0.0.1" | .inbounds[0].port = 18444 | del(.api)' $I/xray.json > /tmp/inner.json
          jq -c '.routing.rules[0], [.outbounds[] | select(.tag == "probe") | .settings.redirect]' /tmp/inner.json
          /tmp/xray run -test -c /tmp/inner.json > /dev/null
          nohup /tmp/xray run -c /tmp/inner.json > /tmp/inner.log 2>&1 &
          sleep 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: libcore/go.mod
          cache: false
      - name: Through the tunnel and own (libcore)
        working-directory: libcore
        env:
          RAYCONTROL_BUNDLE: /tmp/rc/phone.bundle
          RAYCONTROL_ADDRESS: ${{ steps.node.outputs.address }}
          RAYCONTROL_FRONT_PORT: "18443"
          RAYCONTROL_INNER_PORT: "18444"
        run: |
          TAGS=with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_xhttp,with_awg,with_dnstt,with_masterdnsvpn,with_yggdrasil,badlinkname,tfogo_checklinkname0
          go test -count=1 -v -ldflags=-checklinkname=0 -tags="$TAGS" -run TestRaycontrolTunnelInterop .

      - name: Logs
        if: always()
        run: |
          for f in rayd h2o front inner; do echo "== $f"; tail -n 40 /tmp/$f.log || true; done
          pkill -x rayd || true; pkill -x niko-server || true; pkill -x xray || true

  naive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch raycontrol
        run: |
          . .github/raycontrol.env
          git clone --filter=blob:none "$REPOSITORY_RAYCONTROL" raycontrol
          git -C raycontrol checkout -q "$COMMIT_RAYCONTROL"

      - uses: actions/setup-go@v5
        with:
          go-version-file: raycontrol/go.mod
          cache: false
      - name: Build rayd
        working-directory: raycontrol
        run: CGO_ENABLED=0 go build -o /tmp/rayd ./cmd/rayd

      - name: NaiveProxy client and the niko-server front
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . .github/raycontrol.env
          . .github/niko-server.env
          sudo apt-get install -y -qq strace > /dev/null
          # rayd naive takes its connections from the node's front (raycontrol niko-mux-note.md §3), as in production
          curl -fsSL --retry 3 -o /tmp/niko-server "$NIKO_SERVER_RELEASES/download/$NIKO_SERVER_TAG/niko-server-linux-amd64"
          echo "$NIKO_SERVER_SHA256_AMD64  /tmp/niko-server" | sha256sum -c -
          chmod +x /tmp/niko-server
          tag=$(gh release list -R klzgrad/naiveproxy -L 100 --json tagName -q '.[].tagName' | grep -m1 "^v${NAIVE_CHROMIUM}-")
          [ -n "$tag" ] || { echo "no NaiveProxy release for Chromium $NAIVE_CHROMIUM"; exit 1; }
          gh release download "$tag" -R klzgrad/naiveproxy -p "naiveproxy-${tag}-linux-x64.tar.xz" -D /tmp
          tar -xJf /tmp/naiveproxy-${tag}-linux-x64.tar.xz -C /tmp
          mv /tmp/naiveproxy-${tag}-linux-x64/naive /tmp/naive
          echo "NaiveProxy $tag: $(sha256sum /tmp/naive | cut -d' ' -f1)"

      - name: rayd naive behind the front and TLS, a CA the client trusts
        run: |
          cd /tmp
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 30 -subj "/CN=interop CA" \
            -keyout ca.key -out ca.crt -addext "basicConstraints=critical,CA:TRUE" 2>/dev/null
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -subj "/CN=naive.test" -keyout leaf.key -out leaf.csr 2>/dev/null
          printf "subjectAltName=DNS:naive.test\nbasicConstraints=CA:FALSE\n" > leaf.ext
          openssl x509 -req -in leaf.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 30 -extfile leaf.ext -out leaf.crt 2>/dev/null
          pw=$(openssl rand -hex 16); echo "$pw" > /tmp/naive.pw
          printf '["%s"]' "$(printf %s "$pw" | sha256sum | cut -d' ' -f1)" > users.json
          # the order of raycontrol's TestRealitySelfStealWithXray: rayd naive takes the front's sockets (mode fd
          # for TCP 443, mode packet for QUIC), then the front routes naive.test to it on a test port
          uid=$(id -u); mkdir -p /tmp/run/naive && chmod 0710 /tmp/run/naive
          # rayd naive logs a failed dial to the destination at debug only. strace shows its dials: Go connects
          # non-blocking (EINPROGRESS), the outcome is the SO_ERROR of the getsockopt that follows
          nohup strace -f -tt -e trace=connect,getsockopt -o /tmp/rayd-naive.strace \
            /tmp/rayd naive -users users.json -chain leaf.crt -key leaf.key -front-uid "$uid" \
              -socket /tmp/run/naive/fd.sock -quic-socket /tmp/run/naive/packet.sock > /tmp/naive-server.log 2>&1 &
          for i in $(seq 50); do [ -S /tmp/run/naive/fd.sock ] && [ -S /tmp/run/naive/packet.sock ] && break; sleep 0.2; done
          jq -n --arg uid "$uid" '{schema: 1, role: "front", log: {level: "info"},
            tcp: {listen: ["127.0.0.1:18446"], routes: [{sni: ["naive.test"], backend: "naive"}]},
            udp: {listen: ["127.0.0.1:18446"], routes: [{sni: ["naive.test"], backend: "naive-quic"}]},
            backends: {naive: {socket: "/tmp/run/naive/fd.sock", mode: "fd", uid: ($uid | tonumber)},
                       "naive-quic": {socket: "/tmp/run/naive/packet.sock", mode: "packet", uid: ($uid | tonumber)}}}' > front.json
          /tmp/niko-server check -c front.json --json
          nohup /tmp/niko-server front -c front.json > /tmp/front.log 2>&1 &
          sleep 1

      - name: Interop
        run: |
          pw=$(cat /tmp/naive.pw)
          # NaiveProxy on Linux reads its roots from the system store, not NSS (use_nss_certs=false): SSL_CERT_FILE
          # replaces it, for naive only; curl checks the destination's certificate through the tunnel itself
          SSL_CERT_FILE=/tmp/ca.crt nohup /tmp/naive --listen=socks://127.0.0.1:11090 --proxy="https://niko:${pw}@naive.test:18446" \
            --host-resolver-rules="MAP naive.test 127.0.0.1" --log --log-net-log=/tmp/naive-net.json > /tmp/naive-client.log 2>&1 &
          SSL_CERT_FILE=/tmp/ca.crt nohup /tmp/naive --listen=socks://127.0.0.1:11091 --proxy="https://niko:wrong@naive.test:18446" \
            --host-resolver-rules="MAP naive.test 127.0.0.1" --log --log-net-log=/tmp/naive-wrong-net.json > /tmp/naive-wrong.log 2>&1 &
          # naive-quic (naive+quic:// in raycontrol's links): the same name and credentials over UDP 443 of the front
          SSL_CERT_FILE=/tmp/ca.crt nohup /tmp/naive --listen=socks://127.0.0.1:11092 --proxy="quic://niko:${pw}@naive.test:18446" \
            --host-resolver-rules="MAP naive.test 127.0.0.1" --log > /tmp/naive-quic.log 2>&1 &
          for i in $(seq 75); do
            [ -n "$(ss -Hltn 'sport = :11090')" ] && [ -n "$(ss -Hltn 'sport = :11091')" ] && [ -n "$(ss -Hltn 'sport = :11092')" ] && break
            sleep 0.2
          done
          fail=0
          # curl's own error and exit code go to the log: a 000 alone does not say whether SOCKS, the tunnel or TLS
          # failed. Exit 7 (no proxy to connect to) fails every check: a refused tunnel must come from naive itself.
          probe() {
            local rc=0
            curl -sS -m 30 -o /dev/null -w '%{http_code}' -x "socks5h://127.0.0.1:$1" https://www.gstatic.com/generate_204 \
              2>"/tmp/curl-$1.err" || rc=$?
            echo "$rc" > "/tmp/curl-$1.rc"
          }
          check() {
            got=$(probe "$2"); rc=$(cat "/tmp/curl-$2.rc"); echo "$1: $got, curl exit $rc (want $3)"
            if [ -s "/tmp/curl-$2.err" ]; then sed 's/^/    curl: /' "/tmp/curl-$2.err"; fi
            [ "$got" = "$3" ] && [ "$rc" != 7 ] || fail=1
          }
          check "NaiveProxy (h2, padding) -> rayd naive" 11090 204
          check "wrong password (must fail: 404 on CONNECT)" 11091 000
          check "NaiveProxy over QUIC (naive-quic) -> front UDP -> rayd naive" 11092 204
          # curl sees only that the tunnel failed (a 404, a reset and a hang all read 000): the CONNECT's own answer
          # comes from the clients' net logs. naive writes them in batches of 15 events, so a few more tries push
          # the first ones out; a CONNECT counts only with an answer to every request of its source
          for i in 1 2 3 4; do
            for port in 11090 11091; do curl -s -m 5 -o /dev/null -x "socks5h://127.0.0.1:$port" https://www.gstatic.com/generate_204 || true; done
          done
          sleep 1
          python3 .github/scripts/netlog-errors.py --connect 200 /tmp/naive-net.json || fail=1
          python3 .github/scripts/netlog-errors.py --connect 404 /tmp/naive-wrong-net.json || fail=1
          exit $fail

      - name: Logs
        if: always()
        run: |
          for f in front naive-server naive-client naive-wrong naive-quic; do echo "--- $f"; tail -n 30 /tmp/$f.log 2>/dev/null || true; done
          # the client's network errors (certificate, TLS, proxy): the --log output has none of them. naive writes
          # its net log in batches of 15 events and never at exit: a few more tries push the last ones out
          for i in 1 2 3 4; do curl -s -m 5 -o /dev/null -x socks5h://127.0.0.1:11090 https://www.gstatic.com/generate_204 || true; done
          sleep 1
          echo "--- client net log errors"
          python3 .github/scripts/netlog-errors.py /tmp/naive-net.json 'TUNNEL|RST_STREAM|GOAWAY|HTTP2_STREAM_ERROR|SEND_REQUEST_HEADERS|READ_RESPONSE_HEADERS|NAIVE|HTTP2_SESSION_RECV_DATA|HTTP2_SESSION_SEND_DATA|RECV_RST|STREAM_CLOSE' || true
          echo "--- rayd naive dials (strace: connect, then SO_ERROR)"
          grep -E 'connect\(|SO_ERROR' /tmp/rayd-naive.strace | grep -v 'AF_UNIX' | tail -n 30 || true
          pkill -x rayd || true; pkill -x naive || true; pkill -x niko-server || true
