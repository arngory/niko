name: Checks

# What a pull request brings to main, before the build (CONTRIBUTING.md): its messages and its secrets. Light, and
# run on an edit of the title or the description too, which a squash merge makes main's commit of; the ruleset on
# main asks for "Commit messages" and "Secrets" beside ci.yml's "CI result". A push to main is not checked again:
# its pull request was, and what was pushed stays as it is
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# one run per pull request: a newer push or edit cancels the run it supersedes
concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # no bare #N in the commits, the title or the description: in a fork GitHub links a bare #N to the parent's issues
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # the commits the pull request brings: those of its head not on its base as the base is now (the event's
      # base.sha can be older, and main's commits since would count)
      - env:
          BASE_REF: ${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 -I .github/scripts/bare-refs.py "origin/$BASE_REF" "$HEAD"

  # keys and tokens in the pull request's commits: gitleaks from its module (sum.golang.org checks what go install
  # takes), findings shown redacted; .gitleaks.toml takes the default rules and says where a false finding goes
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: libcore/go.mod
          cache: false
      - env:
          BASE_REF: ${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$RUNNER_TEMP/bin/gitleaks" git --no-banner --redact --verbose --config .gitleaks.toml \
            --log-opts="origin/$BASE_REF..$HEAD" .
